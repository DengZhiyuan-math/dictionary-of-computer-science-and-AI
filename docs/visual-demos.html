<script id="exampleData" type="application/json">[{"id":"two-sum","title":"哈希配对：先查再存","area":"hot100","chapters":[81],"concepts":["hash-table"],"scenario":"数组 [4,1,5,3]，目标和 8。需要返回两个不同位置。哈希表保存已经读过的值及其下标。","steps":["下标 0 的值是 4，需要另一个 4；表中没有，随后写入 4→0。下标 1 的值是 1，需要 7，也没有。","下标 2 的值是 5，需要 3；查询失败后写入 5→2。","下标 3 的值是 3，需要 5；命中下标 2，得到位置 (2,3)。每一步只查询当前位置之前的元素。"],"result":"5+3=8，返回零基下标 [2,3]。哈希查找按期望常数时间计算，整体期望 O(n)，辅助空间 O(n)。","pitfall":"先把当前位置写入再查询，可能把同一元素使用两次。重复值要区分值和位置。","question":"输入 [3,3]、目标 6，为什么两个相同数可以使用？","answer":"第一次查询时没有 3，随后保存位置 0；第二次命中位置 0，两个位置不同。","demo":"hash","number":1},{"id":"container","title":"双指针：为什么移动短板","area":"hot100","chapters":[82],"concepts":["two-pointers","loop-invariant"],"scenario":"高度 [2,7,4,6,3]。两条线与横轴形成容器，面积是宽度乘较短高度。","steps":["左右端点为 (0,4)，面积 4×2=8。保持左端高度 2 而把右端左移，宽度变小且短板不可能超过 2。","所以排除左端 0，得到 (1,4)，面积 3×3=9；这次右端更短，排除右端。","来到 (1,3)，面积 2×6=12。随后继续移动较短侧，直至相遇，记录遍历中的最大值。"],"result":"最大面积 12，端点 (1,3)。每个指针只向内移动，时间 O(n)，辅助空间 O(1)。","pitfall":"移动规则依赖面积的短板上界；不能把这种规则直接搬到任意两个元素的最优化问题。","question":"两端一样高时移动哪边？","answer":"可以移动任一边；保留另一边时，更窄的容器也无法超过当前短板形成的上界。","demo":"pointers","number":2},{"id":"unique-window","title":"滑动窗口：重复字符出现时逐步收缩","area":"hot100","chapters":[83],"concepts":["sliding-window"],"scenario":"字符串 abcaad，求不含重复字符的最长连续子串。维护区间 [left,right] 的字符集合。","steps":["读入 a、b、c，窗口 abc 长度 3。读入下一个 a 前，它已在集合中，移除左端 a 并把 left 推进到 1。","窗口变成 bca。下一个 a 再次重复；依次移除 b、c、a，直到旧 a 被移走，再加入新 a。","最后读入 d，当前窗口 ad 长度 2；历史最佳仍为 3。每个字符最多加入、移除各一次。"],"result":"答案为 3，可取 abc 或 bca。时间 O(n)，集合空间 O(min(n,字符集大小))。","pitfall":"只把 left 增加一次无法保证窗口合法；最长子串要求连续，不能跳过中间字符。","question":"字符串 aaaa 的答案是什么？","answer":"1。每次新的 a 到来，都必须移走窗口中的旧 a。","demo":"window","number":3},{"id":"prefix-count","title":"前缀和：负数为什么不妨碍计数","area":"hot100","chapters":[84],"concepts":["prefix-sum","hash-table"],"scenario":"数组 [1,-1,1]，统计和为 1 的连续子数组。令前缀和 s，历史频次表起始为 {0:1}。","steps":["第一项后 s=1，查询 s-1=0，找到 1 个前缀，累计 1，再记录前缀 1。","第二项后 s=0，查询 -1，找到 0 个，再把前缀 0 的次数加到 2。","第三项后 s=1，查询 0，找到 2 个历史前缀，累计变成 3，再记录当前前缀。"],"result":"三个区间是位置 [0,0]、[0,2]、[2,2]。时间期望 O(n)，辅助空间 O(n)。","pitfall":"不能先记录当前前缀再查询，否则目标为 0 时会把长度为零的区间计入。含负数时，区间和不随窗口扩张单调变化。","question":"[0,0,0] 中和为 0 的非空区间有几个？","answer":"6 个：三个长度 1、两个长度 2、一个长度 3；前缀频次累计得到 1+2+3。","demo":"prefix","number":4},{"id":"temperatures","title":"单调栈：弹栈时确定等待天数","area":"hot100","chapters":[92],"concepts":["monotonic-stack"],"scenario":"温度 [20,24,22,27,21]，求每一天到更暖一天的等待天数。栈里保存尚未找到答案的下标。","steps":["第 1 天的 24 高于第 0 天的 20，弹出下标 0，答案写为 1。","第 2 天的 22 不高于 24，入栈等待。第 3 天的 27 先弹出 2，写入 1；再弹出 1，写入 2。","剩余下标 3、4 后面没有更暖的一天，答案保留为 0。"],"result":"等待天数 [1,2,1,0,0]。每个下标最多入栈、出栈一次，时间 O(n)，辅助空间 O(n)。","pitfall":"这里寻找严格更暖，温度相同不能结算；保存值而不保存下标就无法算距离。","question":"把温度改成 [20,20,21] 会怎样？","answer":"结果为 [2,1,0]；第二个 20 不会弹出第一个 20。","demo":"stack","number":5},{"id":"bfs-path","title":"BFS：入队即标记与最短路","area":"hot100","chapters":[89],"concepts":["bfs-dfs"],"scenario":"有向等权图 A→B、A→C、B→D、C→D、D→E，F 是孤立节点。寻找从 A 出发的最少边数。","steps":["A 距离为 0，出队后将 B、C 标记并入队，距离均为 1。","B 出队时发现 D，记录距离 2、父节点 B；C 再遇到 D 时，因为 D 已标记而不重复入队。","D 发现 E，距离 3。最终队列为空，F 始终没有距离。沿 E→D→B→A 反转父指针得到路径。"],"result":"A 到 E 的一条最短路径是 A-B-D-E，长度 3；F 不可达。邻接表时间 O(V+E)，空间 O(V)。","pitfall":"结论依赖所有边代价相同；一般带权图不能只按层数比较。出队才标记会产生重复入队。","question":"把 A→C 的代价改为 10，仍能用 BFS 保证最低代价吗？","answer":"不能。BFS 最少边数与最小总代价是两个目标；非负权可考虑 Dijkstra。","demo":"bfs","number":6},{"id":"topo-cycle","title":"拓扑排序：队列为空与有向环","area":"hot100","chapters":[89],"concepts":["topological-sort"],"scenario":"依赖关系 A→C、B→C、C→D、D→E，F 无依赖。每条边表示前者必须先完成。","steps":["统计入度，A、B、F 为 0，先放入队列。弹出 A、B 时各把 C 的入度减一，降到 0 才让 C 入队。","随后 C 释放 D，D 释放 E。F 虽然孤立，也需要在输出中。","如果额外加入 E→C，处理 A、B、F 后队列为空，但 C、D、E 仍未输出，形成有向环。"],"result":"无环时输出 6 个节点的一种拓扑序；加环后只能输出 3 个节点，判定不存在覆盖全图的拓扑序。时间 O(V+E)。","pitfall":"拓扑序通常不唯一；有部分节点输出并不表示整个依赖图可执行。","question":"只检查起点的可达子图够不够？","answer":"不够，另一连通分量也可能有环。必须统计全部 V 个节点的处理数。","demo":"topo","number":7},{"id":"knapsack","title":"0/1 背包：倒序容量避免重复使用","area":"hot100","chapters":[95],"concepts":["0-1-knapsack-unbounded-knapsack"],"scenario":"物品重量 [1,2,5]，每件最多一次，容量 4，问能否恰好装满。布尔 dp[c] 表示已处理物品是否能组成 c。","steps":["初始化只有 dp[0]=真。处理重量 1 时，容量从 4 向 1 遍历，最终只有 0、1 可达。","处理重量 2 时，倒序更新后可达容量为 0、1、2、3；容量 4 读取的是处理该物品之前的 dp[2]，因此仍为假。","重量 5 超过容量，不能加入。若改为从小到大遍历，重量 1 会在同一轮反复使用，错误地让所有容量可达。"],"result":"容量 4 不可达。时间 O(物品数×容量)，辅助空间 O(容量)。这是恰好装满的可达性问题。","pitfall":"完全背包允许无限使用同类物品，才会采用适合重复使用的正序更新；循环顺序表达了使用次数约束。","question":"把物品改成 [1,2,3] 呢？","answer":"可以，由 1+3 得到 4；每件仍只用一次。","demo":"knapsack","number":8},{"id":"permutations","title":"回溯：选择、递归与撤销","area":"hot100","chapters":[90],"concepts":["backtracking-pruning"],"scenario":"枚举 [1,2,3] 的全排列。path 保存当前路径，used 标记已选位置。","steps":["先选 1，再选 2、3，得到 [1,2,3]；保存路径的副本。","撤销 3，再撤销 2，改选 3、2，得到 [1,3,2]；撤销后继续枚举其他起点。","到达深度 3 时保存结果并返回；每一次选择都必须有对应撤销，使兄弟分支看到相同的入口状态。"],"result":"得到 6 个排列。输出本身占 Θ(n×n!) 空间和时间量级；递归与标记的辅助空间 O(n)，不含输出。","pitfall":"直接保存可变 path 引用可能使所有结果最终相同。输入含重复值时，位置标记仍会产生相同的值排列，需要另做去重。","question":"空数组的全排列数量是 0 还是 1？","answer":"按组合约定是 1：包含一个空排列 [[]]，它也是递归的自然终止情形。","demo":"backtrack","number":9},{"id":"lower-bound","title":"二分：半开区间与第一个不小于","area":"hot100","chapters":[91],"concepts":["lower-bound-upper-bound"],"scenario":"有序数组 [1,2,2,4,7]，找第一个不小于 2 的位置，区间约定为 [left,right)，初始 [0,5)。","steps":["中点 2 的值为 2，满足条件，将 right 收到 2，保留更靠左的候选。","中点 1 的值仍为 2，将 right 收到 1；中点 0 的值为 1，不满足，将 left 推到 1。","left=right=1 时结束。边界位置可以等于数组长度；它是插入位置，不保证目标存在。"],"result":"目标 2 的 lower bound 为 1；目标 3 的 lower bound 为 3；目标 8 的边界为 5。时间 O(log n)。","pitfall":"区间不含 right，所以 right 初始可取 n；不能在返回值等于 n 时直接读数组。","question":"求目标 2 的出现次数还缺哪个边界？","answer":"还需第一个大于 2 的 upper bound，位置 3；次数为 3-1=2。","demo":"binary","number":10},{"id":"lru-cache","title":"LRU：一次访问怎样改变淘汰对象","area":"infrastructure","chapters":[18,87],"concepts":["cache","hash-table"],"scenario":"缓存容量 2。以最近使用在左的顺序显示条目，依次执行 put(1)、put(2)、get(1)、put(3)、get(2)。","steps":["前两次写入后顺序为 [2,1]。get(1) 命中，把 1 移到最前，顺序变为 [1,2]。","put(3) 加入后容量超限，淘汰最久未使用的 2，保留 [3,1]。","get(2) 未命中，顺序保持 [3,1]。哈希表定位节点，双向链表负责移到头部与删除尾部。"],"result":"访问 1 改变了后续淘汰对象。哈希表加双向链表可使典型操作达到期望 O(1)，空间 O(容量)。","pitfall":"演示用短数组显示次序，数组实现本身不是 O(1)。LRU 不是按插入时间淘汰，也不能保证最优命中率。","question":"容量改为 3 时，get(2) 还会未命中吗？","answer":"不会；写入 3 时容量没有超限，2 仍在缓存中。","demo":"lru","number":11},{"id":"bce-confidence","title":"BCE：同样判错，损失差多少","area":"training","chapters":[41],"concepts":["bce","bcewithlogitsloss"],"scenario":"真实标签 y=1；模型给正类概率 p。阈值固定为 0.5，比较 p=0.49 与 p=0.01。","steps":["y=1 时，BCE=-ln(p)。p=0.49 得到约 0.71335；p=0.01 得到约 4.60517。","两次硬分类都为负类，但后者给真实类别的概率更低，损失约为前者的 6.46 倍。","切换 y=0 时，损失改为 -ln(1-p)；同一个 0.01 此时是正确且较自信的预测。"],"result":"损失衡量概率预测，不等于 0/1 错误数。演示概率限制在 (0,1)，端点的对数发散另行讨论。","pitfall":"BCEWithLogitsLoss 输入是原始 logit；不要对它的输入再先做 Sigmoid。演示显示概率和对应 logit，计算的是等价的单样本 BCE。","question":"p=0.5 时，两个标签的损失一样吗？","answer":"一样，均为 ln(2)≈0.69315。","demo":"bce","number":12},{"id":"learning-rate","title":"学习率：收敛、震荡与发散","area":"training","chapters":[43],"concepts":["learning-rate","gradient"],"scenario":"简化目标 L(θ)=θ²/2，梯度为 θ，初始 θ=4，每步使用固定学习率 η。","steps":["更新为 θ下一步=(1-η)θ。η=0.1 时，4→3.6→3.24，缓慢靠近 0。","η=1.8 时，4→-3.2→2.56，符号交替但绝对值缩小，仍会收敛。","η=2.2 时，4→-4.8→5.76，符号交替且绝对值增大，发生发散。"],"result":"在这个曲率恰为 1 的二次函数上，0\u003cη\u003c2 收敛；η=2 保持等幅震荡，η=1 一步到 0。","pitfall":"区间 (0,2) 不是所有神经网络的安全学习率范围；一般目标的曲率、噪声和优化器都会改变稳定条件。","question":"目标改成 L=5θ²/2，固定学习率的稳定范围怎么变？","answer":"梯度为 5θ，更新系数为 1-5η；要求其绝对值小于 1，所以 0\u003cη\u003c0.4。","demo":"gd","number":13},{"id":"threshold-metrics","title":"阈值：重新计算混淆矩阵","area":"data-evaluation","chapters":[38],"concepts":["threshold","precision","recall","f1"],"scenario":"分数 [.95,.8,.7,.6,.4,.3,.2,.05]，真实标签 [1,0,1,0,1,0,0,0]。规定分数大于等于阈值即预测为正。","steps":["阈值 0.5 时，前四条预测为正，其中两条真阳性、两条假阳性。其余有一条假阴性、三条真阴性。","Precision=2/(2+2)=0.5，Recall=2/(2+1)=2/3，F1=4/(4+2+1)=4/7，Accuracy=5/8。","把阈值降至 0.4，第三条真实正样本也被找出：TP=3、FP=2、FN=0、TN=3。"],"result":"降低阈值会扩大预测正集合，召回率不会下降，精确率则不保证单调。分数本身在演示中没有变化。","pitfall":"没有预测正样本时，Precision 分母为 0；演示显示“未定义”，不悄悄把它解释成 100%。业务需要明确约定。","question":"阈值为 1，准确率与召回率分别是多少？","answer":"全预测为负，准确率 5/8，召回率 0，Precision 未定义。","demo":"metrics","number":14},{"id":"attention","title":"注意力：分数、归一化与加权求和","area":"architectures","chapters":[53,52],"concepts":["attention-transformer"],"scenario":"查询 q=[1,0]，三个键为 [1,0]、[0,1]、[1,1]，值为 [2,0]、[0,2]、[1,1]。键维度为 2。","steps":["点积为 [1,0,1]，除以 √2 得到约 [.707,0,.707]。演示温度默认 1。","Softmax 先减去最大分数再取指数，得到权重约 [.4011,.1978,.4011]，总和为 1。","按权重加权值向量，输出约 [1.2033,.7967]。屏蔽第三个键后，它的权重为 0，其他权重重新归一化。"],"result":"注意力输出是值的加权组合；权重由查询和键的匹配决定。温度降低会使这组非相等分数的权重更集中。","pitfall":"演示只展示单个查询、单头、无 dropout 的缩放点积注意力；额外温度旋钮是教学设置。完全屏蔽所有键需要另外定义行为。","question":"两个键的分数相同，权重是否一定相同？","answer":"在同一查询、相同掩码条件下，它们的 softmax 权重相同；对应值向量仍可以不同。","demo":"attention","number":15},{"id":"kmeans","title":"K-means：分配与均值更新","area":"ml-methods","chapters":[31],"concepts":["knn-k-means","clustering"],"scenario":"六个二维点为 (0,0)、(0,2)、(2,0)、(7,7)、(7,9)、(9,7)，取 K=2，初始中心为 (0,0)、(2,0)。","steps":["按欧氏距离把每个点分给最近中心，距离相同取较小中心编号。初始中心都在左下，并没有覆盖两团。","用各簇点的均值替换中心，再按新中心重新分配，重复两步。每一步都检查簇内平方误差 SSE。","最终分成左右两团，中心为 (2/3,2/3) 与 (23/3,23/3)，SSE=32/3。"],"result":"在这个例子中，Lloyd 交替步骤找到明显分组；每次分配或均值更新不会增加该目标，但不保证全局最优。","pitfall":"K 是预先指定的；演示遇到空簇时保留旧中心，这只是显式教学策略，实际库的处理可能不同。尺度会影响欧氏距离。","question":"把第二坐标都乘以 100，会保持同样的距离含义吗？","answer":"不会，第二坐标将主导距离；应根据任务决定是否标准化以及怎样处理单位。","demo":"kmeans","number":16},{"id":"rrf","title":"RRF：融合排名而非直接相加原始分数","area":"retrieval-agents","chapters":[60,59],"concepts":["bm25-hnsw","rag"],"scenario":"关键词检索排名 A、B、C；向量检索排名 C、B、D。每个文档在一个列表中贡献 1/(k+rank)，rank 从 1 开始。","steps":["取 k=60，A 得 1/61，D 得 1/63；B 得 2/62。","C 得 1/63+1/61，约 0.032266；B 约 0.032258，因此 C 略高于 B。","合并所有出现过的文档后排序；没有出现在某列表的文档，在该列表贡献为 0。"],"result":"结果为 C、B、A、D。它融合的是排名信息，避免把尺度不同的 BM25 原始分数与相似度直接相加。","pitfall":"RRF 分数不是概率；重复文档应先在每个检索列表中去重。k 的作用不能等同于返回条数。","question":"只保留一个检索列表会怎样？","answer":"融合排序保持该列表的排名顺序，因为 1/(k+rank) 随 rank 变大而减小。","demo":"rrf","number":17},{"id":"q-update","title":"Q-learning：终止状态不再自举","area":"rl","chapters":[66,65],"concepts":["q-learning-sarsa","bellman"],"scenario":"当前 Q(s,a)=2，奖励 r=1，下一状态最大 Q 为 4，折扣 γ=0.9，步长 α=0.5。","steps":["非终止转移的目标为 r+γ max Q=1+0.9×4=4.6。","TD 误差为 4.6-2=2.6，更新 Q=2+0.5×2.6=3.3。","若这一步到达真正终止状态，目标只为 r=1，更新变成 2+0.5×(1-2)=1.5。"],"result":"同样的观测奖励，是否终止会改变学习目标。只演示一次表格 Q-learning 更新，不代表完整策略已经学好。","pitfall":"环境真正终止与时间上限截断需要区分；是否自举应根据任务和接口语义决定。Q-learning 使用下一状态最大值，SARSA 使用实际下一动作的值。","question":"把 α 改为 1，非终止时更新到哪里？","answer":"直接更新到本次目标 4.6；这并不表示目标估计本身没有噪声。","demo":"qlearning","number":18},{"id":"world-feedback","title":"世界模型：预测偏差与反馈修正","area":"embodied","chapters":[73],"concepts":["world-model","pid-mpc"],"scenario":"一维位置 x，目标为 5。真实系统 x下一步=x+u+风，预测模型忽略风。动作限制在 [-1,1]，初始位置为 0。","steps":["固定动作策略每次 u=1；若风=-0.3，每次实际只移动 0.7，预测与观测逐渐不同。","反馈策略每步重新观察，取 u=clip(5-x,-1,1)。靠近目标时，动作随误差缩小。","风=-0.3 时，反馈会停在约 4.7，仍有稳态偏差；固定动作会继续越过目标。"],"result":"闭环反馈能改变累积误差，但一个不含风补偿的比例策略不能消除所有偏差。演示同步列出预测与实际的下一位置。","pitfall":"这不是完整 MPC；没有优化多步动作序列，也没有训练世界模型。用简化动态仅说明预测、观测、反馈之间的关系。","question":"若风为 0，反馈策略到达 5 后会怎样？","answer":"动作变为 0，位置保持 5；固定动作策略仍会每次前进 1。","demo":"world","number":19},{"id":"convolution","title":"卷积窗口：一次输出来自哪些像素","area":"architectures","chapters":[49,48],"concepts":["cnn"],"scenario":"输入为 3×3 矩阵 [[1,2,3],[4,5,6],[7,8,9]]，核为 [[1,0],[0,1]]，步长 1，无填充，偏置为 0。","steps":["左上窗口 [[1,2],[4,5]] 与核逐项相乘求和：1×1+2×0+4×0+5×1=6。","窗口向右移动一格，得到 2+6=8；换到下一行两个窗口，分别得到 4+8=12、5+9=14。","输出空间尺寸为 (3-2)/1+1=2，所以输出是 2×2。演示用同一个核滑动共享权重。"],"result":"输出 [[6,8],[12,14]]。这里使用深度学习库常见的不翻转卷积核的互相关约定。","pitfall":"数学卷积常涉及核翻转；不能在不说明约定时混用。通道、填充、膨胀和多个核在此例中省略。","question":"核改为 [[1,-1],[1,-1]] 会得到什么？","answer":"四个位置均为 -2，因为每个窗口计算左列和减去右列和。","demo":"conv","number":20},{"id":"broadcast","title":"张量广播：一列加一行变成矩阵","area":"training","chapters":[22],"concepts":["tensor-shape-axis","broadcasting"],"scenario":"预测张量形状为 [3,1]，标签形状为 [3]，做一般逐元素减法来计算误差。","steps":["广播从尾轴对齐：[3,1] 与 [1,3] 可广播到 [3,3]。这已经不是三个样本一一对应。","例如预测 [[1],[2],[3]] 减标签 [1,2,3]，结果是 [[0,-1,-2],[1,0,-1],[2,1,0]]。","若先把标签显式变为 [3,1]，差值为三行零，才符合这里的样本配对意图。"],"result":"错误形状可能产生合法但语义错误的计算；检查 shape、轴含义和期望输出形状。","pitfall":"不要据此推断所有损失接口都自动广播；BCEWithLogitsLoss 要求输入和目标形状相同。","question":"batch=1 时为何更难发现？","answer":"[1,1] 和 [1] 的广播结果仍只有一个数，小样本测试可能掩盖轴错误。","demo":null,"number":21},{"id":"leakage","title":"数据泄露：用未来均值修正过去","area":"data-evaluation","chapters":[23,37],"concepts":["data-leakage","cross-validation"],"scenario":"用前两个月数据训练，第三个月验证。某特征训练值 [0,2]，未来验证值 [100,102]。","steps":["若全量求均值，得到 51，再据此处理训练数据，训练流程已接触未来分布。","按时间先切分，训练集均值为 1；训练和验证都使用训练时得到的 1，验证值可以很大。","交叉验证每个折也应在该折的训练部分拟合变换；模型选择完成后再评估独立测试集。"],"result":"避免泄露的关键是拟合操作的数据边界，包含填补、缩放、特征选择和目标编码等步骤。","pitfall":"此处大数只是帮助观察泄露，并不表示均值泄露必然提高某个具体模型的分数；时间依赖任务不能随意随机打散。","question":"验证集均值和训练集差很多时，应该用验证集重新拟合缩放器吗？","answer":"评估阶段不应为获得更好分数这样做；先检查分布漂移，并在明确的数据更新协议下重新训练。","demo":null,"number":22},{"id":"forest-vote","title":"随机森林：相关性决定投票能帮多少","area":"ml-methods","chapters":[27],"concepts":["decision-tree","random-forest"],"scenario":"五棵分类树对同一邮件投票 [1,1,0,1,0]。正类表示垃圾邮件。","steps":["硬投票得到 3 比 2，最终类别为 1。每棵树若都来自完全相同的数据和特征，错误可能高度一致。","Bootstrap 对训练样本有放回采样；每个划分再随机选择候选特征，使树之间产生差异。","若五棵树在同一类邮件上都犯相同错误，增加投票数量不会自动修正这种系统性偏差。"],"result":"集成既需要单棵模型有预测能力，也受错误相关性影响。真实随机森林分类器还可平均叶节点概率，不等同于本例硬投票。","pitfall":"不能把 3/5 直接解释为经过校准的真实概率；OOB 评估也不能替代所有任务下的独立测试。","question":"所有树都输出 0，但真实为 1，增添一百棵完全相同的树有用吗？","answer":"没有，复制相同错误不会带来新的信息。","demo":null,"number":23},{"id":"weight-decay","title":"Weight decay 与学习率衰减：两个不同的旋钮","area":"training","chapters":[45,46],"concepts":["adam-adamw","weight-decay","learning-rate"],"scenario":"用简化的解耦更新 θ下一步=(1-ηλ)θ-ηg 表示参数收缩与梯度更新，取 θ=2、η=0.1、λ=0.01、g=0.4。","steps":["收缩系数为 0.999，收缩后的参数为 1.998。","梯度项为 0.04，更新得到 1.958；λ=0 时同一步为 1.96。","若下一步把学习率降至 0.01，这是改变 η 的 schedule；λ 仍是参数收缩强度设置。"],"result":"Weight decay 是参数更新中的收缩机制；learning-rate decay 是 η 随时间的变化规则。示例两者数值作用也有关联，因为收缩含 ηλ。","pitfall":"上式的 g 是用于更新的方向；真实 AdamW 的梯度方向经过动量与二阶矩调整，不可直接等同于原始梯度。","question":"当前 g=0 时，设置 weight decay 会不会更新参数？","answer":"会，只要 ηλ 非零且该参数适用衰减，本式仍执行 θ←(1-ηλ)θ。","demo":null,"number":24},{"id":"checkpoint","title":"两种 checkpoint：恢复状态与重算激活","area":"training","chapters":[47],"concepts":["activation-checkpointing","checkpoint-resume-seed"],"scenario":"网络有四段，每段需保存约 100 MB 中间激活。机器可能中断，也可能训练显存不足。","steps":["为中断恢复而保存 checkpoint：需要模型、优化器、调度器、训练步数，必要时还包括随机状态和数据进度。它主要写到持久存储。","Activation checkpointing：只保留选定边界的激活，在反向时重新执行某些前向计算，以计算时间换激活显存。","假设保留两段边界能减少部分中间保存量，但还要计入边界、输入、临时张量与其他状态，不能简单承诺显存精确减半。"],"result":"磁盘快照解决恢复问题；激活重计算解决训练时部分内存开销。两个机制可以同时使用。","pitfall":"只保存模型权重通常不能精确续训；激活 checkpoint 不会自动保存一个可恢复的训练任务。","question":"优化器状态很大，开启激活 checkpoint 就能把它省掉吗？","answer":"不能；它针对中间激活，优化器状态需采用另外的存储或分片方案。","demo":null,"number":25},{"id":"amdahl","title":"CPU 与 GPU：先算不能加速的部分","area":"systems","chapters":[2],"concepts":["cpu-gpu","concurrency-parallelism"],"scenario":"程序耗时 100 秒，其中 80 秒可被 GPU 加速 10 倍，其余 20 秒保持不变，先忽略传输开销。","steps":["可加速部分从 80 秒降到 8 秒，总耗时变为 28 秒。","整体加速比为 100/28≈3.57，而不是 10。","即使那 80 秒完全消失，最短也要 20 秒，加速比上界为 5；实际数据传输和调度还会影响结果。"],"result":"Amdahl 分析提醒我们测量整体瓶颈，而不是只报告某个核函数的倍率。","pitfall":"假设固定工作量与可加速比例；扩大批次或改变算法可能改变这个比例，需重新测量。","question":"只有 10% 时间可以加速，哪怕无限快，整体上限是多少？","answer":"1/0.9≈1.11 倍。","demo":null,"number":26},{"id":"transaction","title":"事务：转账中途失败怎么办","area":"infrastructure","chapters":[16,14],"concepts":["transaction-acid"],"scenario":"账户 A 有 100，B 有 20，转账 30，预期结果 A=70、B=50。","steps":["若先扣 A 再加 B，恰在两步之间进程崩溃，裸写入可能只留下扣款。","将两次更新纳入同一事务，提交前失败时应回滚；成功提交后，两次更新共同构成已提交结果。","还应通过条件更新或合适的并发控制检查余额，避免两个同时转账都基于过时余额批准。"],"result":"原子性关注一组操作共同成功或失败；隔离性处理并发交错；持久性依赖提交与恢复机制。","pitfall":"只是把两个语句写在一起不等于事务；跨数据库或外部支付还涉及其他协议与幂等设计。","question":"数据库已提交但客户端没收到响应，直接重试一定安全吗？","answer":"不一定，可能重复转账；需要业务幂等键或可查询的操作状态。","demo":null,"number":27},{"id":"cosine","title":"跨模态表征：余弦相似度不是事实核验","area":"multimodal","chapters":[64],"concepts":["multimodal-representation"],"scenario":"将图像向量设为 [1,0]，两个文本向量为 [2,0] 和 [1,1]，仅演示向量比较。","steps":["图像与第一段文本的余弦为 2/(1×2)=1；第二段为 1/√2≈0.707。","归一化后，第一文本为 [1,0]，第二文本约为 [.707,.707]；点积就等于余弦。","第一文本长度变成 [20,0] 仍得余弦 1，说明度量忽略向量的正比例长度变化。"],"result":"共享表征可把跨模态检索写成向量邻近问题；这个人造向量例子没有训练或验证真实图文模型。","pitfall":"相似度不是正确性或概率；零向量的余弦未定义，否定、数量与细粒度空间关系还可能被模型误判。","question":"文本向量为 [-1,0] 时，余弦是多少？","answer":"-1，表示方向相反；语义上如何解释仍取决于模型学到的空间。","demo":null,"number":28},{"id":"kv-cache","title":"KV cache：复用的是哪些计算","area":"llm","chapters":[58],"concepts":["kv-cache-flashattention","attention-transformer"],"scenario":"自回归解码已有 4 个 token，现在生成第 5 个。前缀各层的 Key 与 Value 可在先前步骤保存。","steps":["缓存让第 5 步复用前 4 个 token 的 K、V，不必在每步重复做它们的同类投影。","新 token 的 Query 仍需与可见前缀 Key 比较，再对 Value 加权，前缀更长时这部分工作仍增长。","假设每个 token 存 2 组、每组 d 个数值、每数值 b 字节，L 层、T 个 token、批量 B 的简化内存为 2BLTdb。"],"result":"例如 B=1、L=2、T=4、d=8、b=2 时为 256 字节；这里 d 是每层合计缓存的 KV 宽度。","pitfall":"真实 GQA/MQA、量化、分页和框架元数据会改变内存；KV cache 与 FlashAttention 优化的对象不同。","question":"长度翻倍，按这个简化缓存公式会怎样？","answer":"缓存大小翻倍；不能据此声称整个推理时间也恰好翻倍。","demo":null,"number":29},{"id":"top-k-interview","title":"Top K：用需求解释算法选择","area":"practice","chapters":[93],"concepts":["heap","quickselect-top-k"],"scenario":"输入 [9,1,7,3,8]，求最大的两个数。先确认是否要求有序、输入能否修改、是否持续接收数据。","steps":["大小为 2 的最小堆，堆顶保存当前第二大。读完 9、1 后为 {1,9}；读到 7 替换 1，读到 3 忽略，读到 8 替换 7。","最终保留 {8,9}，若要求从大到小，还需对这两个结果排序。","静态数组也可用快速选择定位分界，平均 O(n)；它会重排数组，结果区间不天然有序，最坏复杂度取决于选主元策略。"],"result":"堆适合流式维护，时间 O(n log k)、辅助空间 O(k)；快速选择适合可修改的静态数据，选择理由来自约束。","pitfall":"只说“快速选择比排序快”不完整；需要说明平均与最坏、输出顺序和输入修改要求。","question":"数据持续到来，还要随时返回前 K，优先考虑什么？","answer":"固定大小堆通常更方便增量维护；也要说明当 k 接近 n 时的成本与返回排序开销。","demo":null,"number":30},{"id":"dsu-components","title":"并查集：重复连接不减少集合数","area":"algorithms","chapters":[98],"concepts":["disjoint-set-union"],"scenario":"六个节点 0…5，依次加入无向连接 (0,1)、(2,3)、(1,2)、(0,3)、(4,5)。","steps":["最初集合数为 6。前两次分别合并两组，集合数变为 4。","合并 (1,2) 后，0、1、2、3 属于同一集合，集合数变为 3。","再次连接 (0,3) 时两端根已相同，不执行合并；最后 (4,5) 把集合数降到 2。"],"result":"最终两组为 {0,1,2,3}、{4,5}。具体代表元依合并策略而变，成员划分不变。","pitfall":"不要每读到一条边就把集合数减一；重复边或成环边可能不产生新合并。","question":"去掉 (1,2)，仍加入 (0,3)，最后几组？","answer":"仍是 2 组，(0,3) 会把先前分离的 {0,1} 与 {2,3} 合并。","demo":"dsu","number":31},{"id":"dijkstra-stale","title":"Dijkstra：旧距离为什么还在队列里","area":"algorithms","chapters":[99],"concepts":["dijkstra","heap"],"scenario":"有向边 A→B=5、A→C=1、C→B=1、B→D=2、C→D=7；从 A 出发。","steps":["处理 A 后，候选 B=5、C=1。先处理 C，把 B 改进为 2、D 改进为 8。","处理新 B=2 后，D 改进为 4。队列里仍可能保留旧 B=5 和旧 D=8。","随后取 D=4；弹出 B=5 时发现它不等于当前 dist[B]=2，跳过；D=8 同理。"],"result":"距离 A=0、C=1、B=2、D=4，最短路线 A-C-B-D。","pitfall":"演示按小列表排序展示候选，不是高效堆实现；理论堆复杂度不适用于该展示容器。","question":"允许 C→B=-4 时还能套同一个非负权证明吗？","answer":"不能；负边可能让已经确认的距离再次下降，应根据约束改用其他方法。","demo":"dijkstra","number":32},{"id":"zero-one-improve","title":"0-1 BFS：第一次发现不一定最短","area":"algorithms","chapters":[99],"concepts":["zero-one-bfs","bfs-dfs"],"scenario":"有向边 A→B=1、A→C=0、C→B=0，从 A 求到 B 的最小代价。","steps":["处理 A 时，B 暂定为 1，放队尾；C 暂定为 0，放队首。","先处理 C，经 C→B 得到新代价 0，比 1 更小，更新 B 并放到队首。","最终 B 的距离为 0，路径是 A-C-B；虽然它使用两条边，却比一条边的直达代价更低。"],"result":"0-1 BFS 按距离改进松弛，不能把普通等权 BFS 的访问标记规则原样使用。","pitfall":"把“入队过”当作“永不更新”，会错误保留 B=1；权重为 2 时也不能继续沿用该双端队列规则。","question":"如果三条边全为 1，最少代价是多少？","answer":"1，A→B 的直达路线就最短，此时普通 BFS 足够。","demo":null,"number":33},{"id":"negative-cycle","title":"负环：先问它是否可达","area":"algorithms","chapters":[99],"concepts":["bellman-ford"],"scenario":"节点 A、B、C、D、E；边 A→B=2、B→C=1、D→E=-2、E→D=1，从 A 出发。","steps":["从 A 只能到 B、C，最短距离分别为 2、3。D-E-D 总权为 -1，但从 A 无法到达。","扫描边时，不可达节点不参与松弛，因此这个负环不影响 A、B、C 的距离。","额外加 C→D=0 后，负环变为可达。D、E 可反复绕环降低代价，若再有 E→B，B、C 也会受到影响。"],"result":"负环影响取决于源点可达性及从负环能到达谁，不等于整张图每个节点都没有答案。","pitfall":"有限轮中得到的很小负数不是受负环影响节点的真正最短距离；应标记无有限下界。","question":"未增加 E→B 时，A 的距离仍为 0 吗？","answer":"是，因为负环无法返回 A；其影响不会逆着不存在的边传播。","demo":null,"number":34},{"id":"fenwick-prefix","title":"Fenwick：查询与更新沿不同方向走","area":"algorithms","chapters":[100],"concepts":["fenwick-tree"],"scenario":"一基数组 a=[2,1,3,4,2]。tree 保存区间和，初始 tree[1…5]=[2,3,3,10,2]。","steps":["查询前 5 项，先读 tree[5]=2，索引减 lowbit(5)=1 到 4，再读 tree[4]=10，得到 12。","把位置 3 加 2，先让 tree[3] 从 3 到 5，再让 tree[4] 从 10 到 12；下一索引 8 超过 n，停止。","更新后前 5 项为 14；位置 2…4 的和为 prefix(4)-prefix(1)=12-2=10。"],"result":"Fenwick 只更新包含该位置的二进制区间块；每条查询或更新路径至多 O(log n) 步。","pitfall":"下标 0 不适合作为这个一基更新接口的起点，因为 lowbit(0)=0。","question":"位置 3 的增量改成 -2，前 5 项是多少？","answer":"10。原总和 12 减 2，结构同样支持负增量。","demo":"fenwick","number":35},{"id":"segment-range","title":"线段树：查询最大值不能做前缀相减","area":"algorithms","chapters":[100],"concepts":["segment-tree"],"scenario":"数组 [2,1,3,4,2,6]，零基半开查询 [1,5)，目标是区间最大值。","steps":["目标元素为 [1,3,4,2]，最大值是 4；不包括下标 5 的 6。","用线段树将区间分解成覆盖节点，按 max 合并各节点摘要，合并身份元可以是负无穷。","若把下标 2 从 3 改为 9，只需更新相关叶和祖先；再次查询 [1,5)，结果为 9。"],"result":"节点保存什么由查询目标决定。sum、max 与更复杂摘要的合并规则不同。","pitfall":"prefixMax(5)-prefixMax(1) 不会得到区间最大值；空区间返回约定也必须明确。","question":"如果所有值都是负数，合并初值设为 0 对吗？","answer":"不对，0 可能大于所有真实值；应使用适当身份元或显式处理空结果。","demo":null,"number":36},{"id":"difference-range","title":"差分：区间结束之后撤销增量","area":"algorithms","chapters":[100],"concepts":["difference-array","prefix-sum"],"scenario":"零基长度 5 的全零数组。先对闭区间 [1,3] 加 2，再对 [2,4] 加 -1，最后统一还原。","steps":["预留长度 6 的差分，第一次在 d[1] 加 2、d[4] 减 2。","第二次在 d[2] 减 1、d[5] 加 1，d[5] 是末尾之后的撤销哨兵。","对前五个差分做累加，得到位置 0=0、1=2、2=1、3=1、4=-1。"],"result":"最终 [0,2,1,1,-1]，每次区间更新只改两个端点，最后 O(n) 还原。","pitfall":"闭区间撤销位置是 r+1，不是 r；哨兵需要分配空间，但不作为原数组第六个结果。","question":"改成半开区间 [l,r)，撤销在哪？","answer":"在 d[r]，因为 r 已经不属于被更新区间。","demo":null,"number":37},{"id":"kmp-border","title":"KMP：失配时退到哪个边界","area":"algorithms","chapters":[101],"concepts":["kmp-prefix-function"],"scenario":"模式 ababaca，文本 abababaca。π 是每个前缀的最长相等真前后缀长度。","steps":["模式前五个字符 ababa 的 π 依次为 0、0、1、2、3。","处理第六个字符 c，候选边界长度 3 对应下一字符 b，不匹配；退到长度 1，仍对应 b，再退到 0，得到 π[5]=0。","最终 π=[0,0,1,2,3,0,1]；搜索文本时复用边界，匹配从零基位置 2 开始。"],"result":"单模式搜索不必在每次失配后让文本指针退回，重叠候选信息已编码在边界链里。","pitfall":"π 的值是长度而非字符位置；访问 π[j-1] 前必须保证 j>0。","question":"模式 aaa 在文本 aaaaa 中允许重叠时有几个匹配？","answer":"3 个，起点 0、1、2；报告后退到长度 2，而不是清零。","demo":"kmp","number":38},{"id":"aho-overlap","title":"多模式：一个位置可以结束多个词","area":"algorithms","chapters":[101],"concepts":["aho-corasick","trie"],"scenario":"模式 he、she、hers，文本 ushers，零基下标 0…5。","steps":["文本走到下标 3 的 e 时，后缀 she 对应模式 she，区间 [1,3]。","同一位置还有后缀 he，区间 [2,3]；失败链接与输出关系需要保留这个结果。","继续读 r、s 后，hers 在 [2,5] 结束；这些结果允许重叠，不能发现一个长词就跳过全部字符。"],"result":"匹配结果包括 she、he、hers。输出所有结果本身有成本，复杂度说明必须计入输出数量。","pitfall":"只检查当前 Trie 节点自己的结束标记，可能漏掉失败链上的短模式。","question":"只想判断是否出现过任一模式，还需要存所有匹配位置吗？","answer":"不需要，可以在发现第一个结果时返回；这改变输出成本，但结构语义仍要正确。","demo":null,"number":39},{"id":"lis-boundary","title":"LIS：重复值替换而非延长","area":"algorithms","chapters":[102],"concepts":["lis-tails","lower-bound-upper-bound"],"scenario":"输入 [3,1,2,2,5,4]，求最长严格递增子序列长度。","steps":["读 3 后 tails=[3]；读 1 替换首个不小于 1 的位置，变为 [1]。","读 2 延长为 [1,2]；第二个 2 替换同一位置，长度不变，避免把相等算作严格递增。","读 5 后为 [1,2,5]，读 4 后为 [1,2,4]，长度为 3。"],"result":"答案为 3。这里 tails 恰好能形成一个实际序列，但该现象不是所有输入都成立。","pitfall":"输入 [2,3,1] 的最终 tails=[1,3] 不符合原顺序，不能把它当作恢复出的子序列。","question":"目标改为最长非递减子序列，重复的 2 怎么办？","answer":"应使用第一个大于当前值的位置更新，使相等值可以延长，当前输入的非递减长度为 4。","demo":"lis","number":40},{"id":"weighted-jobs","title":"带权调度：前驱让选择可以相加","area":"algorithms","chapters":[102],"concepts":["weighted-interval-dp"],"scenario":"任务 A=(1,3,5)、B=(2,5,6)、C=(3,6,5)、D=(6,7,4)，三元组是开始、结束、收益。相接边界不冲突。","steps":["按结束时间顺序 A、B、C、D。只有 A 时最佳收益为 5；加入 B 后为 max(5,6)=6。","C 可以接在 A 后，选择它得到 5+5=10，优于不选的 6。","D 可以接在 C 后，得到 10+4=14，最终选择 A、C、D。"],"result":"最大收益 14；兼容前驱索引避免每次重新枚举全部已选组合。","pitfall":"若结束与开始相等也视为冲突，A 与 C、C 与 D 的兼容关系都会改变。","question":"把 B 收益改为 100，原先的最早结束贪心还最优吗？","answer":"不再最优。B+D 收益 104，高于 A+C+D 的 14。","demo":null,"number":41},{"id":"tsp-mask","title":"状态压缩：还要记住最后停在哪","area":"algorithms","chapters":[102],"concepts":["bitmask-dp"],"scenario":"四个节点 0…3，有向距离矩阵 [[0,2,9,10],[1,0,6,4],[15,7,0,8],[6,3,12,0]]。从 0 出发，访问其余各一次后回到 0。","steps":["状态必须同时包含访问集合和最后节点，因为同一访问集合从不同终点继续，下一条边代价不同。","例如路线 0→2→3 的代价为 9+8=17，最后接到 1 再回 0，增加 3+1。","这条完整回路为 0→2→3→1→0，总代价 21；枚举另外五种访问顺序可确认没有更低值。"],"result":"最优回路代价 21；位掩码 DP 以 O(n²2ⁿ) 时间共享子问题，而不是把问题变成多项式规模。","pitfall":"没有补上回到起点的边，就解成了另一种路径问题；非对称距离不能把反向路线视为相同。","question":"访问完集合后只保留一个最小数，不记录终点够吗？","answer":"不够，不同终点的后续成本不同，局部较便宜的状态未必能形成全局最优回路。","demo":null,"number":42},{"id":"matrix-chain","title":"区间 DP：乘法顺序改变多少运算","area":"algorithms","chapters":[102],"concepts":["interval-dp"],"scenario":"矩阵 A1 为 10×30，A2 为 30×5，A3 为 5×60。只比较标量乘法次数。","steps":["先算 A1A2，成本 10×30×5=1500，得到 10×5 矩阵。","再乘 A3，成本 10×5×60=3000，总计 4500。","若先算 A2A3，成本为 9000；再由 A1 左乘，需要 18000，总计 27000。"],"result":"同一矩阵链的最终形状相同，运算次序可使标量乘法数从 27000 降至 4500。","pitfall":"此例只优化朴素矩阵乘法的运算次数，不保证在任意硬件与实现上实际耗时也正好缩为六分之一。","question":"只有一个矩阵时，状态的基础成本是多少？","answer":"0，因为没有矩阵乘法需要执行。","demo":null,"number":43},{"id":"split-answer","title":"二分答案：先检查候选上限","area":"algorithms","chapters":[103],"concepts":["binary-search-answer","greedy"],"scenario":"非负任务 [7,2,5,10,8]，保持顺序，分成至多 2 个非空连续组，最小化最大组和。","steps":["答案至少是最大单项 10，至多是全部总和 32。","候选上限 17：先放 [7,2,5] 和为 14，再放 [10]，最后的 8 需要第三组，所以不可行。","候选上限 18：分为 [7,2,5] 与 [10,8]，两组足够。二分缩小最早可行上限，得到 18。"],"result":"最优最大组和为 18，划分点在 5 与 10 之间。单次检查 O(n)，整数搜索约 O(n log U)。","pitfall":"贪心检查依赖非负数；如果存在负数，超限后还可能被后续负数抵消，不能原样使用。","question":"最多一组时，答案是多少？","answer":"32，全部任务必须留在同一个组。","demo":"split-answer","number":44},{"id":"greedy-objective","title":"贪心反例：最多任务与最高收益","area":"algorithms","chapters":[103],"concepts":["greedy","weighted-interval-dp"],"scenario":"仍使用 A=(1,3,5)、B=(2,5,100)、C=(3,6,5)、D=(6,7,4)，相接不冲突。","steps":["若目标是数量最多，最早结束规则选 A、C、D，共 3 项。","若目标是收益最大，同样的选择只有 14；选择 B、D 收益为 104。","问题描述只改了优化目标，安全选择的证明就需要重做，可转成带权区间 DP。"],"result":"“某规则常见”不等于它适用于所有看起来相似的调度题。","pitfall":"不要一看到区间就固定按开始或结束排序后贪心；需要先明确目标、兼容条件和资源限制。","question":"若全部收益都为 1，两种目标还冲突吗？","answer":"不冲突，最大收益等同于最大数量，可以恢复无权情形的结论。","demo":null,"number":45},{"id":"reservoir-probability","title":"蓄水池：每个元素最后都有三分之一","area":"algorithms","chapters":[104],"concepts":["reservoir-sampling"],"scenario":"流依次到来 A、B、C，只保留一个样本，每个元素按其位置执行替换概率。","steps":["A 首先进入；B 以 1/2 概率替换 A。","C 以 1/3 概率替换当前样本；A 最终保留的概率为 1×1/2×2/3=1/3。","B 最终保留的概率为 1/2×2/3=1/3；C 最终保留的概率就是 1/3。"],"result":"三个位置等概率被留下，无需事先知道流最终长度。","pitfall":"每次都以 1/2 替换会偏向较晚元素；均匀整数随机区间的端点错误也会改变概率。","question":"A、A、B 三条记录，最后取到值 A 的概率是多少？","answer":"2/3。这里按记录位置均匀采样，两个 A 是两个不同位置，并非先按取值去重。","demo":null,"number":46},{"id":"bloom-collision","title":"Bloom：两个已见元素拼出一个误报","area":"algorithms","chapters":[104],"concepts":["bloom-filter"],"scenario":"8 位全零位图，两个哈希位置。A 对应 [1,4]，B 对应 [4,6]，未插入的 C 对应 [1,6]。","steps":["插入 A，将位 1、4 设为 1；插入 B，将位 4、6 设为 1。","查询 C 的两个位置都为 1，因此返回“可能存在”，但 C 从未插入，这是一个假阳性。","若为了删除 A 直接清零位 4，则 B 的查询会遇到 0，产生错误的缺失判断。"],"result":"共享位带来紧凑存储，也带来误报和普通删除的限制；可再查精确记录确认。","pitfall":"这个固定的小位图只展示机制，不能用它宣称某个生产系统的误判率。","question":"查询 D 的位置为 [0,6]，能确定什么？","answer":"因为位 0 仍为 0，在标准只插入且哈希一致的条件下，可确定 D 未插入。","demo":null,"number":47},{"id":"array-amortized","title":"动态数组：昂贵扩容如何摊还","area":"algorithms","chapters":[105],"concepts":["amortized-analysis","complexity"],"scenario":"容量初始为 1，满时扩为 2 倍；追加 8 个元素，忽略分配器额外开销。","steps":["扩到容量 2、4、8 时，分别复制已有的 1、2、4 个元素，总复制量为 7。","八次写入加七次复制，共 15 次单位工作。某一次追加可能很贵，但整段工作仍与 8 成正比。","若追加第 9 个，需要扩到 16 再复制 8 个；此前复制总量变为 15，总单位工作 24，仍小于 3×9。"],"result":"按倍数增长时，几何级数控制 n 次追加总成本 O(n)，所以追加的摊还成本 O(1)。","pitfall":"摊还结论不是每次最坏 O(1)；如果每次只扩一格，复制量会变成 1+2+…+(n-1)。","question":"扩容到新数组时，旧内存可立即忽略吗？","answer":"不能，复制期间可能同时存在新旧数组，峰值内存和释放策略需单独考虑。","demo":null,"number":48},{"id":"imbalanced-accuracy","title":"不平衡评估：两个 99% 完全不同","area":"data-evaluation","chapters":[38],"concepts":["precision","recall","roc-auc-pr-auc"],"scenario":"1000 个样本，正类 10 个。模型 TP=5、FP=5、FN=5、TN=985。","steps":["准确率为 (5+985)/1000=99%，Precision=5/(5+5)=50%，Recall=5/(5+5)=50%。","若全部预测为负，TN=990、FN=10，准确率同样是 99%，Recall 却为 0。","这两个操作点的准确率相同，但能否发现正类、需要复核多少误报不同；应结合成本与阈值选择。"],"result":"类别不平衡时，准确率可能掩盖重要差异；单个混淆矩阵不能直接计算完整 ROC AUC 或 PR AUC。","pitfall":"不要用阈值下的 Precision 取代 PR AUC，也不要从这几个计数推断未给出的完整排名。","question":"只把阈值调高，一定提高 Precision 吗？","answer":"不一定。预测正集合缩小，Recall 不会提高，但剩余样本中的正类比例可升可降。","demo":null,"number":49},{"id":"softmax-stability","title":"Softmax：先平移再取指数","area":"training","chapters":[41,53],"concepts":["softmax","cross-entropy-nll"],"scenario":"三个 logits 为 [1000,1001,999]，真实类别是第二类，计算概率与多类交叉熵。","steps":["直接取指数容易溢出。先减去最大值 1001，得到 [-1,0,-2]，Softmax 结果不变。","指数约为 [.367879,1,.135335]，归一化后概率约 [.244728,.665241,.090031]。","真实类别交叉熵为 -ln(.665241)≈.407606；一次加常数不改变相对分数，因此也不改变这些概率。"],"result":"稳定计算依赖代数等价变形，而不是任意截断 logits；训练代码通常使用接收原始分数的交叉熵接口。","pitfall":"不要对 CrossEntropyLoss 先做 Softmax 再当作 logits 输入；也不要把推理阈值混进损失公式。","question":"全部 logits 再加 500，结果会变吗？","answer":"数学上不变；稳定实现仍先减最大值，避免中间值无必要地变大。","demo":null,"number":50}]</script>

function svgEl(tag,attrs={},text){const node=document.createElementNS(svgNS,tag);for(const[k,v]of Object.entries(attrs))node.setAttribute(k,v);if(text!==undefined)node.textContent=text;return node}
function svgBase(height,label){const w=Math.max(280,Math.floor(canvas.clientWidth));const s=svgEl('svg',{viewBox:`0 0 ${w} ${height}`,role:'img','aria-label':label});canvas.append(s);return {s,w}}
function cells(values,active=[],labels=[]){const box=el('div',undefined,{class:'cells'});values.forEach((v,i)=>{const c=el('div',undefined,{class:'cell'+(active.includes(i)?' active':'')});c.append(el('b',v),el('small',labels[i]??`[${i}]`));box.append(c)});return box}
function renderTable(headers,rows){const wrap=el('div',undefined,{class:'scroll'}),t=el('table'),head=el('thead'),tr=el('tr');for(const h of headers)tr.append(el('th',h,{scope:'col'}));head.append(tr);t.append(head);const body=el('tbody');for(const row of rows){const r=el('tr');for(const v of row)r.append(el('td',v));body.append(r)}t.append(body);wrap.append(t);return wrap}
function plot(v){const {s,w}=svgBase(290,v.kind==='series'?`${v.yLabel} 随 ${v.xLabel} 变化`:'二维样本与聚类中心');const left=68,right=w-20,top=22,bottom=232;
 const points=v.kind==='series'?v.values.map((y,x)=>[x,y]):[...v.points,...v.centers];
 const xs=points.map(q=>q[0]),ys=points.map(q=>q[1]);if(v.reference!==undefined)ys.push(v.reference);
 function domain(a){const lo=Math.min(...a),hi=Math.max(...a),pad=(hi-lo||Math.abs(hi)||1)*.12;return [lo-pad,hi+pad]}
 const [xmin,xmax]=v.kind==='series'?[0,Math.max(1,...xs)]:domain(xs),[ymin,ymax]=domain(ys),x=a=>left+6+(a-xmin)/(xmax-xmin)*(right-left-12),y=a=>bottom-(a-ymin)/(ymax-ymin)*(bottom-top);
 s.append(svgEl('rect',{x:left,y:top,width:right-left,height:bottom-top,class:'axis'}));
 const tick=n=>Math.abs(n)>=1000?n.toExponential(1):Number(n.toPrecision(3));const xticks=v.kind==='series'?[...new Set([0,Math.round(xmax/3),Math.round(2*xmax/3),xmax])]:Array.from({length:4},(_,i)=>xmin+(xmax-xmin)*i/3);xticks.forEach((n,i)=>s.append(svgEl('text',{x:x(n),y:bottom+20,'text-anchor':i===0?'start':i===xticks.length-1?'end':'middle'},tick(n))));for(let i=0;i<4;i++){const n=ymin+(ymax-ymin)*i/3;s.append(svgEl('text',{x:left-8,y:y(n)+4,'text-anchor':'end'},tick(n)))}
 s.append(svgEl('text',{x:(left+right)/2,y:282,'text-anchor':'middle',class:'axis-title','data-axis':'x'},v.xLabel),svgEl('text',{x:left,y:14,class:'axis-title','data-axis':'y'},v.yLabel));
 if(v.reference!==undefined){s.append(svgEl('path',{d:`M${left},${y(v.reference)}H${right}`,class:'reference'}),svgEl('text',{x:right-4,y:y(v.reference)-7,'text-anchor':'end'},'目标 '+v.reference))}
 if(v.kind==='series'){s.append(svgEl('path',{d:points.map((q,i)=>`${i?'L':'M'}${x(q[0])},${y(q[1])}`).join(' '),class:'curve'}));for(const q of points)s.append(svgEl('circle',{cx:x(q[0]),cy:y(q[1]),r:3,fill:'var(--series)'}))}
 else{v.points.forEach((q,i)=>{s.append(svgEl('circle',{cx:x(q[0]),cy:y(q[1]),r:6,fill:v.assignment[i]?'var(--second)':'var(--series)'}));s.append(svgEl('text',{x:x(q[0])+8,y:y(q[1])-8},'簇 '+(v.assignment[i]+1)))});v.centers.forEach((q,i)=>s.append(svgEl('text',{x:x(q[0]),y:y(q[1])+6,'text-anchor':'middle',fill:i?'var(--second)':'var(--series)'},'✚')))}
}
function renderView(v){canvas.replaceChildren();
 if(v.kind==='array'){canvas.append(cells(v.values,v.active,v.labels));return}
 if(v.kind==='table'){canvas.append(renderTable(v.headers,v.rows));return}
 if(v.kind==='bars'){const box=el('div',undefined,{class:'bars'}),max=v.max??Math.max(...v.values,1e-10);v.values.forEach((n,i)=>{const r=el('div',undefined,{class:'barrow'}),track=el('div',undefined,{class:'track'}),fill=el('div',undefined,{class:'fill'+(v.active?.includes(i)?' active':'')});fill.style.width=`${100*n/max}%`;track.append(fill);r.append(el('span',v.labels?.[i]??i),track,el('span',fmt(n),{class:'value'}));box.append(r)});canvas.append(box);return}
 if(v.kind==='graph'){const {s,w}=svgBase(290,'有向图；节点标注当前距离或入度'),pos={A:[.12,65],B:[.12,190],C:[.46,65],D:[.70,140],E:[.9,65],F:[.88,235]};
 for(const[a,b]of v.edges){const ax=pos[a][0]*w,ay=pos[a][1],bx=pos[b][0]*w,by=pos[b][1],dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len,ex=bx-ux*26,ey=by-uy*26;s.append(svgEl('path',{d:`M${ax+ux*26},${ay+uy*26}L${ex},${ey}`,class:'axis'}),svgEl('path',{d:`M${ex-ux*8-uy*4},${ey-uy*8+ux*4}L${ex},${ey}L${ex-ux*8+uy*4},${ey-uy*8-ux*4}`,stroke:'var(--muted)',fill:'none'}))}
 for(const n of v.nodes){const [a,b]=pos[n];s.append(svgEl('circle',{cx:a*w,cy:b,r:24,fill:v.active.includes(n)?'var(--soft)':'var(--panel)',stroke:'var(--line)'}),svgEl('text',{x:a*w,y:b+4,'text-anchor':'middle'},n));s.append(svgEl('text',{x:a*w,y:b+43,'text-anchor':'middle'},v.labels[n]===undefined?'—':v.labels[n]))}return}
 if(v.kind==='series'||v.kind==='scatter'){plot(v);if(v.kind==='scatter')canvas.append(el('p','● 样本（簇编号见标签）　✚ 中心',{class:'hint'}));return}
 if(v.kind==='matrix'){const wrap=el('div',undefined,{class:'matrices'});for(const [label,rows,type]of [['输入',v.input,'input'],['核',v.kernel,'kernel'],['输出',v.output,'output']]){const box=el('div'),t=el('table',undefined,{class:'matrix'});box.append(el('h3',label));rows.forEach((row,r)=>{const tr=el('tr');row.forEach((n,c)=>{const active=type==='input'?r>=v.row&&r<v.row+2&&c>=v.col&&c<v.col+2:type==='output'&&r===v.row&&c===v.col;tr.append(el('td',n??'·',{class:active?'active':''}))});t.append(tr)});box.append(t);wrap.append(box)}canvas.append(wrap)}
}
function draw(){step=Math.max(0,Math.min(trace.frames.length-1,step));const f=trace.frames[step];$('message').textContent=f.message;$('counter').textContent=`${step+1} / ${trace.frames.length}`;$('previous').disabled=step===0;$('next').disabled=step===trace.frames.length-1;renderView(f.view);$('demo-metrics').replaceChildren();for(const [k,v]of f.rows){const row=el('div');row.append(el('dt',k),el('dd',v));$('demo-metrics').append(row)}}
function calculate(){trace=runDemo(current.id,Number(scenario.value),Number(range.value));step=0;$('parameter-value').textContent=trace.value;draw()}
function choose(id){current=demos.find(d=>d.id===id)||demos[0];select.value=current.id;scenario.replaceChildren(...current.variants.map((v,i)=>el('option',v,{value:i})));$('parameter').hidden=!current.control;if(current.control){for(const key of ['min','max','step'])range[key]=current.control[key];range.value=current.control.value;$('parameter-label').textContent=current.control.label}
 const x=examples.find(x=>x.id===current.example);$('demo-title').textContent=x.title;$('scenario').textContent='基准场景：'+x.scenario;$('worked').replaceChildren(...x.steps.map(s=>el('li',s)));$('result').textContent='结果：'+x.result;$('pitfall').textContent='易错点：'+x.pitfall;$('question').textContent='自测：'+x.question;$('answer').textContent=x.answer;$('related').replaceChildren();for(const num of x.chapters)$('related').append(el('a',`阅读第 ${num} 讲`,{href:`../chapters/${String(num).padStart(2,'0')}.md`}));$('related').append(el('a','阅读案例集',{href:`EXAMPLES.md#example-${x.id}`}));calculate()}
select.append(...demos.map(d=>el('option',d.name,{value:d.id})));
for(const x of examples){const li=el('li'),a=el('a',`${String(x.number).padStart(2,'0')} · ${x.title}`,{href:x.demo?'#'+x.demo:`EXAMPLES.md#example-${x.id}`});li.append(a);$('all-examples').append(li)}
select.addEventListener('change',()=>{location.hash=select.value});scenario.addEventListener('change',calculate);range.addEventListener('input',calculate);$('previous').addEventListener('click',()=>{step--;draw()});$('next').addEventListener('click',()=>{step++;draw()});window.addEventListener('hashchange',()=>choose(location.hash.slice(1)));new ResizeObserver(()=>{if(trace)renderView(trace.frames[step].view)}).observe(canvas);choose(location.hash.slice(1));
})();
</script></body></html>
