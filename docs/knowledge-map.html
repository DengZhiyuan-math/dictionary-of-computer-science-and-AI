ining","note":"Concepts/激活重计算.md","description":"少保存中间激活，反向时重新计算，以时间换显存。","boundary":"与保存模型以便恢复的 checkpoint 不同。","chapters":[47],"heading":"Activation Checkpointing 与 Model Checkpoint【重点】","category":"稳定性"},{"id":"concept:adagrad-rmsprop","key":"adagrad-rmsprop","type":"concept","label":"逐参数自适应更新方法","en":"Adagrad / RMSProp","area":"training","note":"Concepts/逐参数自适应更新方法.md","description":"Adagrad 累计梯度平方统计；RMSProp 更强调近期的滑动统计。","boundary":"自适应仍需要设置和验证学习率。","chapters":[45],"heading":"AdaGrad 与 RMSProp【认识】","category":"优化器"},{"id":"concept:adam-adamw","key":"adam-adamw","type":"concept","label":"自适应矩估计／解耦权重衰减","en":"Adam / AdamW","area":"training","note":"Concepts/自适应矩估计／解耦权重衰减.md","description":"Adam 使用一、二阶矩统计调节更新；AdamW 将权重衰减单独处理。","boundary":"不能把 AdamW 简化为更快的 Adam。","chapters":[45],"heading":"Adam【重点精学】","category":"优化器"},{"id":"concept:agent","key":"agent","type":"concept","label":"智能体","en":"Agent","area":"retrieval-agents","note":"Concepts/智能体.md","description":"围绕目标与状态组织模型、工具、反馈和执行循环的系统。","boundary":"能生成一次工具调用不等于具备可靠的任务闭环。","chapters":[61],"heading":"Workflow 与 Agent Loop【重点】","category":"智能体"},{"id":"concept:api","key":"api","type":"concept","label":"应用程序编程接口","en":"API","area":"systems","note":"Concepts/应用程序编程接口.md","description":"软件向其他程序暴露的调用约定，包括输入、输出和错误行为。","boundary":"接口约定与内部实现应分开理解。","chapters":[4],"heading":null,"category":"软件抽象"},{"id":"concept:attention-transformer","key":"attention-transformer","type":"concept","label":"注意力／Transformer 架构","en":"Attention / Transformer","area":"llm","note":"Concepts/注意力／Transformer 架构.md","description":"注意力按相关性聚合信息，Transformer 以相关模块组织序列计算。","boundary":"注意力权重不自动等同于因果解释。","chapters":[53],"heading":"Query、Key、Value、Attention Score【重点精学】","category":"LLM"},{"id":"concept:backtracking-pruning","key":"backtracking-pruning","type":"concept","label":"回溯／剪枝","en":"Backtracking / Pruning","area":"hot100","note":"Concepts/回溯／剪枝.md","description":"按选择树探索构造，返回时撤销路径状态，并排除不可能产生合法答案的分支。","boundary":"剪枝依赖题目约束，枚举总成本还受输出数量限制。","chapters":[90],"heading":"Backtracking，回溯：路径、候选集合与撤销操作【重点精学】","category":"Hot 100"},{"id":"concept:batch-size","key":"batch-size","type":"concept","label":"批量大小","en":"Batch Size","area":"training","note":"Concepts/批量大小.md","description":"一次前向计算使用的样本数量；累积与数据并行可增大有效批量。","boundary":"要区分每设备微批量与全局有效批量。","chapters":[44],"heading":"Batch Size、Iteration、Step、Epoch【重点精学】","category":"训练流程"},{"id":"concept:batchnorm-layernorm-rmsnorm","key":"batchnorm-layernorm-rmsnorm","type":"concept","label":"批归一化／层归一化／均方根归一化","en":"BatchNorm / LayerNorm / RMSNorm","area":"training","note":"Concepts/批归一化／层归一化／均方根归一化.md","description":"分别使用不同范围和形式的激活统计，改善网络计算与训练行为。","boundary":"BN 依赖批统计；LN 常按单样本特征；RMSNorm 通常不中心化。","chapters":[46],"heading":"BatchNorm【重点】","category":"归一化"},{"id":"concept:bce","key":"bce","type":"concept","label":"二元交叉熵","en":"BCE","area":"training","note":"Concepts/二元交叉熵.md","description":"给二元概率预测评分，对自信地否定真实答案给予更大惩罚。","boundary":"适用于二分类与逐标签多标签，不只是统计对错。","chapters":[41],"heading":"BCE，Binary Cross-Entropy，二元交叉熵【重点精学】","category":"损失"},{"id":"concept:bcewithlogitsloss","key":"bcewithlogitsloss","type":"concept","label":"融合 Sigmoid 的二元交叉熵","en":"BCEWithLogitsLoss","area":"training","note":"Concepts/融合 Sigmoid 的二元交叉熵.md","description":"直接接收 logits，在内部稳定地合并 Sigmoid 与 BCE。","boundary":"目标应为同形状浮点张量；不要在输入端重复 Sigmoid。","chapters":[41],"heading":"BCELoss 与 BCEWithLogitsLoss【重点】","category":"损失"},{"id":"concept:bfs-dfs","key":"bfs-dfs","type":"concept","label":"广度／深度优先搜索","en":"BFS / DFS","area":"algorithms","note":"Concepts/广度／深度优先搜索.md","description":"BFS 逐层扩展，DFS 沿路径深入后回退。","boundary":"BFS 的最少边数路径不自动等于一般加权最短路。","chapters":[10],"heading":"BFS 与 DFS【重点】","category":"算法"},{"id":"concept:binary-multiclass-multilabel","key":"binary-multiclass-multilabel","type":"concept","label":"二分类／互斥多分类／多标签","en":"Binary / Multiclass / Multilabel","area":"data-evaluation","note":"Concepts/二分类／互斥多分类／多标签.md","description":"分别对应是非判断、多个互斥答案中选一个、多个答案可以同时成立。","boundary":"先确定任务语义，再选输出与损失。","chapters":[22],"heading":"Binary、Multiclass、Multilabel【重点精学】","category":"模型输出"},{"id":"concept:bm25-hnsw","key":"bm25-hnsw","type":"concept","label":"词项检索评分／近似近邻图索引","en":"BM25 / HNSW","area":"retrieval-agents","note":"Concepts/词项检索评分／近似近邻图索引.md","description":"BM25 结合词项匹配统计；HNSW 在向量空间中通过层次图加速近邻检索。","boundary":"向量表示质量不能靠索引结构补救。","chapters":[60],"heading":"Inverted Index、TF-IDF、BM25【重点】","category":"检索"},{"id":"concept:boosting","key":"boosting","type":"concept","label":"提升方法","en":"Boosting","area":"ml-methods","note":"Concepts/提升方法.md","description":"逐轮添加模型来改进组合模型，不同方法有不同目标与加权方式。","boundary":"不要把所有 Boosting 都说成拟合同一种残差。","chapters":[28],"heading":"Gradient Boosting、GBDT【重点精学】","category":"机器学习"},{"id":"concept:bootstrap-oob","key":"bootstrap-oob","type":"concept","label":"自助抽样／袋外样本","en":"Bootstrap / OOB","area":"ml-methods","note":"Concepts/自助抽样／袋外样本.md","description":"有放回抽样形成训练集；未被某棵树抽到的样本可供该树评估。","boundary":"OOB 不能替代适当的时间或分组验证。","chapters":[27],"heading":"Bootstrap 与 Bagging【重点精学】","category":"机器学习"},{"id":"concept:broadcasting","key":"broadcasting","type":"concept","label":"广播","en":"Broadcasting","area":"data-evaluation","note":"Concepts/广播.md","description":"按形状规则扩展较小张量的运算含义，避免手动复制。","boundary":"能运行的广播也可能在计算错误的对象。","chapters":[22],"heading":"Dtype、Device、Broadcasting【认识】","category":"模型输入"},{"id":"concept:calibration","key":"calibration","type":"concept","label":"概率校准","en":"Calibration","area":"data-evaluation","note":"Concepts/概率校准.md","description":"检查报出的概率与长期实际发生比例是否相符。","boundary":"AUC 高不保证概率可信。","chapters":[38],"heading":"Calibration、Brier Score 与 Temperature Scaling【重点】","category":"评价"},{"id":"concept:canonical-key","key":"canonical-key","type":"concept","label":"规范化键","en":"Canonical Key","area":"hot100","note":"Concepts/规范化键.md","description":"消除不重要的表示差异，为同一等价类生成相同索引键。","boundary":"字符频次可以识别异位词，拼接键必须无歧义。","chapters":[81],"heading":"Canonical Key：先定义“什么算同一组”【重点】","category":"Hot 100"},{"id":"concept:checkpoint-resume-seed","key":"checkpoint-resume-seed","type":"concept","label":"检查点／恢复／随机种子","en":"Checkpoint / Resume / Seed","area":"training","note":"Concepts/检查点／恢复／随机种子.md","description":"保存状态后恢复训练；种子帮助控制随机过程。","boundary":"只存权重通常不够精确续训，种子也不保证跨环境完全一致。","chapters":[44],"heading":"Checkpoint、Resume 与 Seed【认识】","category":"训练流程"},{"id":"concept:concurrency-parallelism","key":"concurrency-parallelism","type":"concept","label":"并发／并行","en":"Concurrency / Parallelism","area":"systems","note":"Concepts/并发／并行.md","description":"并发让多项工作交替推进；并行让多项工作在同一时间执行。","boundary":"异步描述等待与控制流程，不能直接等同于并行。","chapters":[2],"heading":null,"category":"系统"},{"id":"concept:contrastive-loss","key":"contrastive-loss","type":"concept","label":"对比损失","en":"Contrastive Loss","area":"training","note":"Concepts/对比损失.md","description":"通过正负关系或其他对比结构学习有用表征。","boundary":"怎样定义正负对象本身就是关键假设。","chapters":[42],"heading":"Contrastive Loss、Triplet Loss、InfoNCE【重点】","category":"损失"},{"id":"concept:cpu-gpu","key":"cpu-gpu","type":"concept","label":"中央处理器／图形处理器","en":"CPU / GPU","area":"systems","note":"Concepts/中央处理器／图形处理器.md","description":"CPU 擅长复杂控制流程；GPU 擅长适合并行的大量相似计算。","boundary":"GPU 并不对所有任务都更快。","chapters":[2],"heading":"案例 26：CPU 与 GPU：先算不能加速的部分","category":"系统"},{"id":"concept:cross-entropy-nll","key":"cross-entropy-nll","type":"concept","label":"交叉熵／负对数似然","en":"Cross-Entropy / NLL","area":"training","note":"Concepts/交叉熵／负对数似然.md","description":"分类交叉熵与真实类别的负对数概率有关；NLL 适用于更一般的似然建模。","boundary":"PyTorch CrossEntropyLoss 接收原始分数，NLLLoss 接收对数概率。","chapters":[41],"heading":"BCE，Binary Cross-Entropy，二元交叉熵【重点精学】","category":"损失"},{"id":"concept:cross-validation","key":"cross-validation","type":"concept","label":"交叉验证","en":"Cross-Validation","area":"data-evaluation","note":"Concepts/交叉验证.md","description":"用多次数据划分评价训练流程，必要时以嵌套方式隔离模型选择。","boundary":"数据有时间或分组依赖时不能随意随机切分。","chapters":[38],"heading":"Cross-Validation、Nested CV、OOF【重点】","category":"评价"},{"id":"concept:ctc","key":"ctc","type":"concept","label":"连接时序分类","en":"CTC","area":"training","note":"Concepts/连接时序分类.md","description":"在序列输入与标签缺少逐帧对齐时，对合法对齐路径聚合评分。","boundary":"不等于任意两段序列都能自动对齐。","chapters":[42],"heading":"CTC、Label Smoothing 与辅助损失【认识】","category":"损失"},{"id":"concept:data-leakage","key":"data-leakage","type":"concept","label":"数据泄露","en":"Data Leakage","area":"data-evaluation","note":"Concepts/数据泄露.md","description":"训练或选择模型时无意利用了实际预测拿不到的信息。","boundary":"预处理统计和目标编码也可能泄露验证答案。","chapters":[23],"heading":null,"category":"数据"},{"id":"concept:dice-loss","key":"dice-loss","type":"concept","label":"Dice 重叠损失","en":"Dice Loss","area":"training","note":"Concepts/Dice 重叠损失.md","description":"根据预测与目标区域的重叠构造训练目标，常见于分割。","boundary":"不同实现的平滑项和归约方式会影响结果。","chapters":[42],"heading":"IoU、Dice Loss 与分割【认识】","category":"损失"},{"id":"concept:dijkstra","key":"dijkstra","type":"concept","label":"非负权最短路算法","en":"Dijkstra","area":"algorithms","note":"Concepts/非负权最短路算法.md","description":"反复确定当前最近节点，并用它松弛其他路径。","boundary":"一般不能用于含负权边的图。","chapters":[10],"heading":"Dijkstra【重点】","category":"算法"},{"id":"concept:dpo-grpo","key":"dpo-grpo","type":"concept","label":"直接偏好优化／组相对策略优化","en":"DPO / GRPO","area":"llm","note":"Concepts/直接偏好优化／组相对策略优化.md","description":"DPO 常使用偏好对；GRPO 通过一组采样输出的相对奖励构造更新信号。","boundary":"反馈形式与采样训练流程不同。","chapters":[56],"heading":"DPO、IPO、KTO、ORPO【重点】","category":"LLM"},{"id":"concept:dreamer-muzero","key":"dreamer-muzero","type":"concept","label":"想象中学习策略／学模型并搜索","en":"Dreamer / MuZero","area":"embodied","note":"Concepts/想象中学习策略／学模型并搜索.md","description":"Dreamer 在潜在模型轨迹中训练行为；MuZero 将学到的模型与搜索结合。","boundary":"应比较控制目标、预测对象和规划机制。","chapters":[73],"heading":"Dreamer【重点精学】","category":"世界模型"},{"id":"concept:dropout","key":"dropout","type":"concept","label":"随机屏蔽激活","en":"Dropout","area":"training","note":"Concepts/随机屏蔽激活.md","description":"训练时随机屏蔽部分激活，减少对特定通路的依赖。","boundary":"通常不是推理时永久删除神经元。","chapters":[46],"heading":"Dropout、Drop Path、Stochastic Depth【重点】","category":"正则化"},{"id":"concept:dtype-device","key":"dtype-device","type":"concept","label":"数据类型／计算设备","en":"Dtype / Device","area":"data-evaluation","note":"Concepts/数据类型／计算设备.md","description":"Dtype 指数值表示方式，Device 指数据与运算所在的 CPU 或 GPU 等设备。","boundary":"形状一致不代表类型和设备一定匹配。","chapters":[22],"heading":"Dtype、Device、Broadcasting【认识】","category":"模型输入"},{"id":"concept:dummy-node","key":"dummy-node","type":"concept","label":"链表哨兵节点","en":"Dummy Node","area":"hot100","note":"Concepts/链表哨兵节点.md","description":"在真实头节点前放辅助节点，统一头部与普通位置的连接修改。","boundary":"返回真实头节点；不要把哨兵值当成输入数据。","chapters":[87],"heading":"Dummy Node：统一头节点与普通节点的边界【重点】","category":"Hot 100"},{"id":"concept:dynamic-programming","key":"dynamic-programming","type":"concept","label":"动态规划","en":"Dynamic Programming","area":"algorithms","note":"Concepts/动态规划.md","description":"保存可复用的子问题结果，按状态与转移关系求解。","boundary":"记住结果不够，还要明确状态与边界。","chapters":[9],"heading":"Dynamic Programming，动态规划【重点精学】","category":"算法"},{"id":"concept:early-stopping-patience","key":"early-stopping-patience","type":"concept","label":"提前停止／容忍检查次数","en":"Early Stopping / Patience","area":"training","note":"Concepts/提前停止／容忍检查次数.md","description":"按验证表现决定停止，Patience 规定允许多久没有改善。","boundary":"计数通常是验证检查次数，需要说明单位。","chapters":[44],"heading":"Validation 与 Early Stopping【重点】","category":"训练流程"},{"id":"concept:em-viterbi","key":"em-viterbi","type":"concept","label":"潜变量参数估计／最可能路径解码","en":"EM / Viterbi","area":"ml-methods","note":"Concepts/潜变量参数估计／最可能路径解码.md","description":"EM 迭代估计含潜变量模型参数；Viterbi 在给定模型下寻找最可能的隐藏路径。","boundary":"学习模型与使用模型找路径是两件事。","chapters":[33],"heading":"Latent Variable 与 EM【重点】","category":"统计模型"},{"id":"concept:f1","key":"f1","type":"concept","label":"精确率与召回率的调和平均","en":"F1","area":"data-evaluation","note":"Concepts/精确率与召回率的调和平均.md","description":"用一个数汇总 Precision 与 Recall，偏低的一项会限制结果。","boundary":"比较多类别结果要交代 Macro、Micro 等平均方式。","chapters":[38],"heading":"混淆矩阵例题：Precision、Recall、F1 各在数什么【重点】","category":"评价"},{"id":"concept:fast-and-slow-pointers","key":"fast-and-slow-pointers","type":"concept","label":"快慢指针","en":"Fast and Slow Pointers","area":"hot100","note":"Concepts/快慢指针.md","description":"利用不同移动速度寻找中点、检测环，并通过后续同速阶段定位入口。","boundary":"首次相遇点通常不是环入口，空指针判断不可省。","chapters":[87],"heading":"Fast and Slow Pointers，快慢指针：中点、环与入口【重点精学】","category":"Hot 100"},{"id":"concept:focal-loss","key":"focal-loss","type":"concept","label":"聚焦损失","en":"Focal Loss","area":"training","note":"Concepts/聚焦损失.md","description":"降低容易样本的相对贡献，使训练更关注困难样本。","boundary":"困难样本也可能是错误标签，不保证总有收益。","chapters":[42],"heading":"Focal Loss【重点】","category":"损失"},{"id":"concept:forward-backward","key":"forward-backward","type":"concept","label":"前向／反向传播","en":"Forward / Backward","area":"training","note":"Concepts/前向／反向传播.md","description":"前向计算预测，反向按计算图求损失对参数的梯度。","boundary":"反向传播本身不等于参数更新。","chapters":[44],"heading":"Forward、Backward、Optimizer Step【重点精学】","category":"训练流程"},{"id":"concept:gradient","key":"gradient","type":"concept","label":"梯度","en":"Gradient","area":"training","note":"Concepts/梯度.md","description":"各参数方向上的局部变化率，告诉更新算法损失如何变化。","boundary":"方向信息与最终更新步幅是不同层次。","chapters":[44],"heading":"Gradient Accumulation 与 Microbatch【重点】","category":"训练流程"},{"id":"concept:gradient-clipping","key":"gradient-clipping","type":"concept","label":"梯度裁剪","en":"Gradient Clipping","area":"training","note":"Concepts/梯度裁剪.md","description":"限制梯度的范数或分量，减轻异常大梯度导致的不稳定。","boundary":"梯度缩放场景中通常先还原尺度再裁剪。","chapters":[47],"heading":"Gradient Clipping【重点】","category":"稳定性"},{"id":"concept:hash-table","key":"hash-table","type":"concept","label":"哈希表","en":"Hash Table","area":"algorithms","note":"Concepts/哈希表.md","description":"把键映射到存储位置，以支持高效的按键查找。","boundary":"平均查找效率不能无条件当成最坏情况保证。","chapters":[5],"heading":null,"category":"数据结构"},{"id":"concept:huber-loss","key":"huber-loss","type":"concept","label":"Huber 损失","en":"Huber Loss","area":"training","note":"Concepts/Huber 损失.md","description":"小误差区域像平方误差，大误差区域像绝对误差。","boundary":"转折尺度仍需结合任务设置。","chapters":[41],"heading":"Huber Loss 与 Quantile Loss【认识】","category":"损失"},{"id":"concept:in-place-marking","key":"in-place-marking","type":"concept","label":"原地标记","en":"In-place Marking","area":"hot100","note":"Concepts/原地标记.md","description":"利用输入存储中的部分位置记录未来操作或访问状态，减少额外空间。","boundary":"会修改输入；标记位置本身的信息必须先保存或按顺序处理。","chapters":[86],"heading":"In-place Marking：用首行首列保存延迟操作【重点】","category":"Hot 100"},{"id":"concept:index","key":"index","type":"concept","label":"数据库索引","en":"Index","area":"infrastructure","note":"Concepts/数据库索引.md","description":"维护额外查找结构以减少查询需要扫描的数据。","boundary":"查询收益伴随写入和存储维护成本。","chapters":[15],"heading":"倒排索引与 Bitmap Index【认识】","category":"数据库"},{"id":"concept:initialization-residual-connection","key":"initialization-residual-connection","type":"concept","label":"初始化／残差连接","en":"Initialization / Residual Connection","area":"training","note":"Concepts/初始化／残差连接.md","description":"初始化决定参数起点；残差结构让分支学习相对输入的变化。","boundary":"残差详见第 49 讲；二者都不是模型已经学到的知识。","chapters":[47],"heading":"Initialization、Xavier 与 He【认识】","category":"稳定性"},{"id":"concept:iteration-optimizer-step-epoch","key":"iteration-optimizer-step-epoch","type":"concept","label":"迭代／参数更新／数据遍历","en":"Iteration / Optimizer Step / Epoch","area":"training","note":"Concepts/迭代／参数更新／数据遍历.md","description":"Iteration 是一次循环，optimizer step 是一次实际更新，epoch 通常是遍历一轮有限数据。","boundary":"梯度累积或跳过更新时，三者不能互换。","chapters":[44],"heading":"Forward、Backward、Optimizer Step【重点精学】","category":"训练流程"},{"id":"concept:kadane","key":"kadane","type":"concept","label":"最大连续子数组和的线性状态更新","en":"Kadane","area":"hot100","note":"Concepts/最大连续子数组和的线性状态更新.md","description":"维护以当前位置结束的最大非空和，选择继续前段或从当前值重新开始。","boundary":"全负数组仍需返回一个负数，不能用空区间零替代。","chapters":[85],"heading":"Kadane：以当前位置结尾的最优解【重点精学】","category":"Hot 100"},{"id":"concept:kl-divergence","key":"kl-divergence","type":"concept","label":"KL 散度","en":"KL Divergence","area":"training","note":"Concepts/KL 散度.md","description":"衡量一个分布相对另一个分布的差异，具有方向性。","boundary":"不是对称距离；输入约定依实现而定。","chapters":[42],"heading":"KL Divergence 与蒸馏【重点】","category":"损失"},{"id":"concept:knn-k-means","key":"knn-k-means","type":"concept","label":"近邻预测／K 均值聚类","en":"KNN / K-means","area":"ml-methods","note":"Concepts/近邻预测／K 均值聚类.md","description":"KNN 利用邻居答案预测；K-means 在无标签数据中找指定数量的中心。","boundary":"前者详见第 29 讲；名称接近但任务不同。","chapters":[31],"heading":"K-means 与 K-means++【重点】","category":"机器学习"},{"id":"concept:kv-cache-flashattention","key":"kv-cache-flashattention","type":"concept","label":"键值缓存／高效注意力计算","en":"KV Cache / FlashAttention","area":"llm","note":"Concepts/键值缓存／高效注意力计算.md","description":"KV Cache 复用已生成前缀的键值；FlashAttention 优化注意力的数据搬运与存储。","boundary":"缓存管理、精度量化与计算内核优化不是同一手段。","chapters":[58],"heading":"KV Cache 与 Prefix Caching【重点精学】","category":"LLM"},{"id":"concept:learning-rate","key":"learning-rate","type":"concept","label":"学习率","en":"Learning Rate","area":"training","note":"Concepts/学习率.md","description":"影响参数更新的总体步幅，实际变化还取决于梯度与优化器状态。","boundary":"不是训练轮数，也不是每个权重固定改变的量。","chapters":[43],"heading":"Learning Rate，学习率【重点精学】","category":"更新"},{"id":"concept:logit","key":"logit","type":"concept","label":"概率变换前的分数","en":"Logit","area":"data-evaluation","note":"Concepts/概率变换前的分数.md","description":"神经网络分类语境中，通常是尚未经过 Sigmoid 或 Softmax 的原始分数。","boundary":"分数可为负，也可大于一，并不是概率。","chapters":[22],"heading":"Logit、Sigmoid、Softmax【重点精学】","category":"模型输出"},{"id":"concept:loop-invariant","key":"loop-invariant","type":"concept","label":"循环不变式","en":"Loop Invariant","area":"hot100","note":"Concepts/循环不变式.md","description":"每轮循环开始与结束都保持成立的性质，用来解释状态与正确性。","boundary":"不能只展示一组样例，要说明每次移动为何仍保留答案。","chapters":[82],"heading":"Two Pointers 与 Loop Invariant：先说清两个指针的职责【重点精学】","category":"Hot 100"},{"id":"concept:loss-objective-metric","key":"loss-objective-metric","type":"concept","label":"损失／目标函数／评价指标","en":"Loss / Objective / Metric","area":"training","note":"Concepts/损失／目标函数／评价指标.md","description":"损失提供训练评分；目标可含其他约束；指标衡量实际任务表现。","boundary":"训练目标下降不保证业务指标改善。","chapters":[41],"heading":"Loss、Objective 与 Metric【重点精学】","category":"损失"},{"id":"concept:lower-bound-upper-bound","key":"lower-bound-upper-bound","type":"concept","label":"首次不小于／首次大于的边界","en":"Lower Bound / Upper Bound","area":"hot100","note":"Concepts/首次不小于／首次大于的边界.md","description":"在有序序列或单调谓词中定位真假分界，可组合得到相等值的完整范围。","boundary":"区间开闭与更新规则必须一致，边界处还需确认目标存在。","chapters":[91],"heading":"Lower Bound，下界二分：寻找第一个满足条件的位置【重点精学】","category":"Hot 100"},{"id":"concept:macro-micro","key":"macro-micro","type":"concept","label":"按类平均／汇总计数","en":"Macro / Micro","area":"data-evaluation","note":"Concepts/按类平均／汇总计数.md","description":"Macro 先算各类再等权平均；Micro 汇总计数后计算。","boundary":"加权平均还会受类别样本数量影响。","chapters":[38],"heading":"Macro、Micro、Weighted Average【重点】","category":"评价"},{"id":"concept:microbatch-gradient-accumulation","key":"microbatch-gradient-accumulation","type":"concept","label":"微批／梯度累积","en":"Microbatch / Gradient Accumulation","area":"training","note":"Concepts/微批／梯度累积.md","description":"分多次小批前后向，累计梯度后再更新参数，以减少单次激活占用。","boundary":"尾批、损失归一化和 BatchNorm 会影响结果。","chapters":[44],"heading":"Gradient Accumulation 与 Microbatch【重点】","category":"训练流程"},{"id":"concept:mixed-precision-loss-scaling","key":"mixed-precision-loss-scaling","type":"concept","label":"混合精度／损失缩放","en":"Mixed Precision / Loss Scaling","area":"training","note":"Concepts/混合精度／损失缩放.md","description":"对不同运算选择精度；缩放帮助某些低精度梯度保持可表示。","boundary":"缩放还原与优化器更新应在正确边界执行。","chapters":[47],"heading":"FP32、FP16、BF16 与 Mixed Precision【重点】","category":"稳定性"},{"id":"concept:monotonic-deque","key":"monotonic-deque","type":"concept","label":"单调双端队列","en":"Monotonic Deque","area":"hot100","note":"Concepts/单调双端队列.md","description":"两端维护仍可能成为窗口极值的下标候选，并从队首删除过期项。","boundary":"区别于单调栈；普通数组头删可能让实际实现退化。","chapters":[84],"heading":"Monotonic Deque，单调队列：只保留仍可能成为最大值的候选【重点精学】","category":"Hot 100"},{"id":"concept:monotonic-stack","key":"monotonic-stack","type":"concept","label":"单调栈","en":"Monotonic Stack","area":"hot100","note":"Concepts/单调栈.md","description":"保存尚未解决的候选，新元素到来时弹出已能确定答案的旧候选。","boundary":"总线性来自每项至多入栈出栈一次，重复值比较规则必须说明。","chapters":[92],"heading":"Monotonic Stack，单调栈：等待下一个更大元素【重点精学】","category":"Hot 100"},{"id":"concept:mse-mae-rmse","key":"mse-mae-rmse","type":"concept","label":"均方／绝对／均方根误差","en":"MSE / MAE / RMSE","area":"training","note":"Concepts/均方／绝对／均方根误差.md","description":"MSE 强调大误差；MAE 对极端值相对稳健；RMSE 与目标同单位。","boundary":"不能把不同单位和不同误差偏好直接混比。","chapters":[41],"heading":"MSE、MAE 与 RMSE【重点】","category":"损失"},{"id":"concept:multi-source-bfs","key":"multi-source-bfs","type":"concept","label":"多源广度优先搜索","en":"Multi-source BFS","area":"hot100","note":"Concepts/多源广度优先搜索.md","description":"多个起点同时以零距离入队，按层计算等权图中的最早传播时间或距离。","boundary":"边耗时不相同时，层数未必代表实际最短时间。","chapters":[89],"heading":"Multi-source BFS：所有起点同时扩散【重点精学】","category":"Hot 100"},{"id":"concept:nan-inf-oom","key":"nan-inf-oom","type":"concept","label":"无效数值／无穷／内存不足","en":"NaN / Inf / OOM","area":"training","note":"Concepts/无效数值／无穷／内存不足.md","description":"NaN 与 Inf 指数值异常，OOM 指内存资源不足。","boundary":"数值诊断与显存诊断应先区分。","chapters":[47],"heading":"Loss Scaling、NaN、Inf 与 OOM【重点】","category":"稳定性"},{"id":"concept:off-policy-offline-rl","key":"off-policy-offline-rl","type":"concept","label":"离策略／离线强化学习","en":"Off-policy / Offline RL","area":"rl","note":"Concepts/离策略／离线强化学习.md","description":"离策略描述目标与行为策略的关系；离线描述依赖固定数据的训练设置。","boundary":"离策略算法也可以在线持续收集数据。","chapters":[67],"heading":"Offline RL、CQL、IQL【重点】","category":"强化学习"},{"id":"concept:parameter-hyperparameter","key":"parameter-hyperparameter","type":"concept","label":"参数／超参数","en":"Parameter / Hyperparameter","area":"data-evaluation","note":"Concepts/参数／超参数.md","description":"参数由拟合获得，超参数通常控制模型结构或训练方式。","boundary":"学习率与批量大小通常是超参数。","chapters":[22],"heading":"Weight、Bias、Parameter、Hyperparameter【重点】","category":"模型输入"},{"id":"concept:pca","key":"pca","type":"concept","label":"主成分分析","en":"PCA","area":"ml-methods","note":"Concepts/主成分分析.md","description":"以方差较大的正交方向表示数据，常用于线性降维。","boundary":"高方差方向未必最有利于分类。","chapters":[32],"heading":"PCA，主成分分析【重点】","category":"机器学习"},{"id":"concept:pid-mpc","key":"pid-mpc","type":"concept","label":"反馈控制／模型预测控制","en":"PID / MPC","area":"embodied","note":"Concepts/反馈控制／模型预测控制.md","description":"PID 按误差及其变化反馈；MPC 在模型与约束下滚动规划。","boundary":"预测的时间范围与实际执行的范围可以不同。","chapters":[70],"heading":"PID Controller【重点】","category":"机器人"},{"id":"concept:postorder-dp","key":"postorder-dp","type":"concept","label":"树上的后序动态规划","en":"Postorder DP","area":"hot100","note":"Concepts/树上的后序动态规划.md","description":"先获取子树摘要，再计算当前节点向父节点返回的状态或全局候选答案。","boundary":"可传向父节点的单侧路径与当前连接双侧的答案不同。","chapters":[88],"heading":"Postorder DP：单侧贡献与全局路径分开【重点精学】","category":"Hot 100"},{"id":"concept:ppo-sac-td3","key":"ppo-sac-td3","type":"concept","label":"策略与价值学习方法","en":"PPO / SAC / TD3","area":"rl","note":"Concepts/策略与价值学习方法.md","description":"PPO 控制策略目标更新，SAC 结合熵正则，TD3 改进连续动作价值学习。","boundary":"PPO 的目标 clipping 不等于梯度裁剪。","chapters":[67],"heading":"TRPO 与 PPO【重点精学】","category":"强化学习"},{"id":"concept:precision","key":"precision","type":"concept","label":"精确率","en":"Precision","area":"data-evaluation","note":"Concepts/精确率.md","description":"预测为正的对象中，真正为正的比例。","boundary":"分母是报出的正类，不是真实正类。","chapters":[38],"heading":"混淆矩阵例题：Precision、Recall、F1 各在数什么【重点】","category":"评价"},{"id":"concept:prefix-sum","key":"prefix-sum","type":"concept","label":"前缀和","en":"Prefix Sum","area":"hot100","note":"Concepts/前缀和.md","description":"记录从起点到各边界的累计量，用两个前缀之差表示区间和。","boundary":"计数题常需前缀频次与初始零前缀；树路径还需回溯撤销。","chapters":[84],"heading":"Prefix Sum，前缀和：把区间性质变成两个前缀的关系【重点精学】","category":"Hot 100"},{"id":"concept:q-learning-sarsa","key":"q-learning-sarsa","type":"concept","label":"离策略／在策略时序差分控制","en":"Q-learning / SARSA","area":"rl","note":"Concepts/离策略／在策略时序差分控制.md","description":"Q-learning 用贪心目标动作形成更新；SARSA 使用实际下一动作。","boundary":"二者对行为策略与目标策略的关系不同。","chapters":[66],"heading":"Q-learning 与 SARSA【重点】","category":"强化学习"},{"id":"concept:quickselect-top-k","key":"quickselect-top-k","type":"concept","label":"快速选择／前 K 项","en":"Quickselect / Top K","area":"hot100","note":"Concepts/快速选择／前 K 项.md","description":"快速选择只进入目标排名所在分区；Top K 也可用有限大小的堆维护排名边界。","boundary":"快速选择通常修改输入，随机版本期望线性、最坏可平方。","chapters":[93],"heading":"Top K：小根堆维护最大的 k 个候选【重点精学】","category":"Hot 100"},{"id":"concept:rag","key":"rag","type":"concept","label":"检索增强生成","en":"RAG","area":"retrieval-agents","note":"Concepts/检索增强生成.md","description":"先检索相关材料，再让生成模型结合材料回答。","boundary":"检索到资料不保证回答正确或证据充分。","chapters":[59],"heading":null,"category":"检索"},{"id":"concept:random-forest","key":"random-forest","type":"concept","label":"随机森林","en":"Random Forest","area":"ml-methods","note":"Concepts/随机森林.md","description":"用样本抽样和候选特征随机性训练多棵树，再综合预测。","boundary":"主要降低方差，不能保证完全不过拟合。","chapters":[27],"heading":"Random Forest，随机森林【重点精学】","category":"机器学习"},{"id":"concept:recall","key":"recall","type":"concept","label":"召回率","en":"Recall","area":"data-evaluation","note":"Concepts/召回率.md","description":"真实正类中被找到的比例，也称敏感度或真阳性率。","boundary":"提高召回不代表误报一定可接受。","chapters":[38],"heading":"混淆矩阵例题：Precision、Recall、F1 各在数什么【重点】","category":"评价"},{"id":"concept:regularization","key":"regularization","type":"concept","label":"正则化","en":"Regularization","area":"training","note":"Concepts/正则化.md","description":"用惩罚或训练约束等方式限制对训练细节的过度依赖。","boundary":"约束太强也会压掉真实信号。","chapters":[46],"heading":null,"category":"正则化"},{"id":"concept:replication-sharding","key":"replication-sharding","type":"concept","label":"复制／分片","en":"Replication / Sharding","area":"infrastructure","note":"Concepts/复制／分片.md","description":"复制保留数据副本，分片把数据分到不同节点。","boundary":"副本数量与数据划分方式解决不同问题。","chapters":[19],"heading":null,"category":"分布式"},{"id":"concept:roc-auc-pr-auc","key":"roc-auc-pr-auc","type":"concept","label":"排序区分指标","en":"ROC AUC / PR AUC","area":"data-evaluation","note":"Concepts/排序区分指标.md","description":"ROC 汇总真阳性率与假阳性率；PR 汇总精确率与召回率的变化。","boundary":"AP 与 PR 曲线的梯形积分未必相同。","chapters":[38],"heading":null,"category":"评价"},{"id":"concept:sample-feature-label","key":"sample-feature-label","type":"concept","label":"样本／特征／标签","en":"Sample / Feature / Label","area":"data-evaluation","note":"Concepts/样本／特征／标签.md","description":"样本是一条学习对象，特征是可用输入，标签是监督答案。","boundary":"预测时拿不到的答案信息进入特征会造成泄露。","chapters":[22],"heading":"Sample、Feature、Label、Target【重点】","category":"模型输入"},{"id":"concept:scheduler","key":"scheduler","type":"concept","label":"学习率调度器","en":"Scheduler","area":"training","note":"Concepts/学习率调度器.md","description":"根据训练进度或验证表现改变学习率的规则。","boundary":"要说清按实际更新、迭代还是 epoch 调度。","chapters":[43],"heading":"Scheduler、Step Decay、Cosine Annealing【重点】","category":"更新"},{"id":"concept:sft-lora-qlora","key":"sft-lora-qlora","type":"concept","label":"监督微调／低秩适配／量化低秩适配","en":"SFT / LoRA / QLoRA","area":"llm","note":"Concepts/监督微调／低秩适配／量化低秩适配.md","description":"SFT 是训练目标与数据阶段；LoRA 和 QLoRA 是参数适配及内存相关方法。","boundary":"微调阶段与参数高效方法处于不同层次。","chapters":[55],"heading":"Pretraining、Continued Pretraining、SFT【重点】","category":"LLM"},{"id":"concept:sgd-momentum","key":"sgd-momentum","type":"concept","label":"随机梯度下降／动量","en":"SGD / Momentum","area":"training","note":"Concepts/随机梯度下降／动量.md","description":"SGD 使用抽样梯度；动量结合历史更新方向。","boundary":"现代 SGD 常指使用小批量的版本。","chapters":[45],"heading":"Batch GD 与 SGD【重点】","category":"优化器"},{"id":"concept:sigmoid","key":"sigmoid","type":"concept","label":"S 形概率变换","en":"Sigmoid","area":"data-evaluation","note":"Concepts/S 形概率变换.md","description":"把一个实数分数映射到零和一之间，常用于二元标签的概率。","boundary":"BCEWithLogitsLoss 前通常不要重复调用它。","chapters":[22],"heading":"Logit、Sigmoid、Softmax【重点精学】","category":"模型输出"},{"id":"concept:sliding-window","key":"sliding-window","type":"concept","label":"滑动窗口","en":"Sliding Window","area":"hot100","note":"Concepts/滑动窗口.md","description":"维护连续区间及其频次等状态，通过扩张与收缩寻找符合条件的答案。","boundary":"含负数的区间和不随长度单调变化，不能照搬正数滑窗。","chapters":[83],"heading":"Sliding Window，滑动窗口：合法性与收缩条件【重点精学】","category":"Hot 100"},{"id":"concept:softmax","key":"softmax","type":"concept","label":"类别概率归一化","en":"Softmax","area":"data-evaluation","note":"Concepts/类别概率归一化.md","description":"把一组分数转为总和为一的类别概率。","boundary":"独立多标签不应仅因标签多就套互斥 Softmax。","chapters":[22],"heading":"Logit、Sigmoid、Softmax【重点精学】","category":"模型输出"},{"id":"concept:tensor-shape-axis","key":"tensor-shape-axis","type":"concept","label":"张量／形状／轴","en":"Tensor / Shape / Axis","area":"data-evaluation","note":"Concepts/张量／形状／轴.md","description":"张量组织多维数据；形状给出各轴大小；轴表示计算或排列的方向。","boundary":"维数可能指轴数，也可能指某轴大小，要结合语境。","chapters":[22],"heading":"Tensor、Shape、Dimension、Axis【重点】","category":"模型输入"},{"id":"concept:threshold","key":"threshold","type":"concept","label":"分类阈值","en":"Threshold","area":"data-evaluation","note":"Concepts/分类阈值.md","description":"把概率或分数转成硬分类决策的边界。","boundary":"通常在验证数据上结合误报漏报成本选择。","chapters":[38],"heading":"Threshold、Confusion Matrix、Specificity【重点】","category":"评价"},{"id":"concept:token-embedding","key":"token-embedding","type":"concept","label":"词元／向量表示","en":"Token / Embedding","area":"llm","note":"Concepts/词元／向量表示.md","description":"Token 是离散处理单位，Embedding 把单位映射到可学习的向量。","boundary":"一个 token 不一定对应一个汉字或单词。","chapters":[52],"heading":null,"category":"LLM"},{"id":"concept:topological-sort","key":"topological-sort","type":"concept","label":"拓扑排序","en":"Topological Sort","area":"hot100","note":"Concepts/拓扑排序.md","description":"在有向无环依赖图中产生满足先后约束的节点顺序。","boundary":"入度法未处理完全部节点提示有环，普通访问过不等于有向环。","chapters":[89],"heading":"Topological Sort，拓扑排序：把“还欠几个前置条件”变成入度【重点精学】","category":"Hot 100"},{"id":"concept:train-eval-no-grad","key":"train-eval-no-grad","type":"concept","label":"训练模式／评估模式／关闭梯度记录","en":"Train / Eval / No Grad","area":"training","note":"Concepts/训练模式／评估模式／关闭梯度记录.md","description":"Train 和 Eval 改变特定层行为；No grad 控制梯度记录。","boundary":"评估模式与关闭梯度不能相互替代。","chapters":[44],"heading":"Train Mode、Eval Mode、No Grad【重点】","category":"训练流程"},{"id":"concept:transaction-acid","key":"transaction-acid","type":"concept","label":"事务及其性质","en":"Transaction / ACID","area":"infrastructure","note":"Concepts/事务及其性质.md","description":"把一组操作作为逻辑单元，讨论原子性、一致性、隔离性和持久性。","boundary":"隔离级别不同，并发时可观察的行为也不同。","chapters":[14],"heading":null,"category":"数据库"},{"id":"concept:two-pointers","key":"two-pointers","type":"concept","label":"双指针","en":"Two Pointers","area":"hot100","note":"Concepts/双指针.md","description":"让两个访问位置分别承担边界或候选角色，通过安全移动减少重复枚举。","boundary":"两个下标本身不是证明；移动规则需要排序、上界或其他排除依据。","chapters":[82],"heading":"Two Pointers 与 Loop Invariant：先说清两个指针的职责【重点精学】","category":"Hot 100"},{"id":"concept:vae-gan-diffusion","key":"vae-gan-diffusion","type":"concept","label":"变分自编码／对抗生成／扩散","en":"VAE / GAN / Diffusion","area":"multimodal","note":"Concepts/变分自编码／对抗生成／扩散.md","description":"通过不同训练目标与生成过程学习数据分布。","boundary":"不能因都能生成图片就把训练机制视为相同。","chapters":[63],"heading":"VAE 与 Latent Space【重点】","category":"生成模型"},{"id":"concept:vla","key":"vla","type":"concept","label":"视觉语言动作模型","en":"VLA","area":"embodied","note":"Concepts/视觉语言动作模型.md","description":"以视觉与语言条件产生可用于行动的输出。","boundary":"仅使用视觉的动作策略未必属于 VLA。","chapters":[69],"heading":null,"category":"具身智能"},{"id":"concept:warmup-warm-start","key":"warmup-warm-start","type":"concept","label":"预热／热启动","en":"Warmup / Warm Start","area":"training","note":"Concepts/预热／热启动.md","description":"Warmup 在初期逐步提高学习率；Warm start 从已有模型或状态开始。","boundary":"两者可以同时出现，但描述不同事情。","chapters":[43],"heading":"Warmup，预热【重点】","category":"更新"},{"id":"concept:weight-decay","key":"weight-decay","type":"concept","label":"权重衰减","en":"Weight Decay","area":"training","note":"Concepts/权重衰减.md","description":"更新时施加权重收缩倾向，控制模型偏好。","boundary":"与学习率衰减不同；与 L2 的等价关系依优化器而定。","chapters":[45],"heading":"AdamW 与 Weight Decay【重点精学】","category":"正则化"},{"id":"concept:world-model","key":"world-model","type":"concept","label":"世界模型","en":"World Model","area":"embodied","note":"Concepts/世界模型.md","description":"学习环境状态及其随动作变化的规律，服务预测或决策。","boundary":"视频看起来逼真并不自动意味着可靠的动作条件与控制能力。","chapters":[72],"heading":null,"category":"世界模型"},{"id":"concept:zero-grad-detach","key":"zero-grad-detach","type":"concept","label":"清空梯度／切断梯度路径","en":"Zero Grad / Detach","area":"training","note":"Concepts/清空梯度／切断梯度路径.md","description":"前者清除旧的累计梯度，后者阻止某条计算路径反传。","boundary":"Detach 不自动复制独立存储，也不等于冻结整个模型。","chapters":[44],"heading":"Zero Grad、Detach、Stop Gradient【认识】","category":"训练流程"},{"id":"concept:stack","key":"stack","type":"concept","label":"栈与嵌套上下文","en":"Stack","area":"hot100","note":"Concepts/栈与嵌套上下文.md","description":"保存后进先出的未完成上下文，支持括号匹配、最小值恢复与嵌套解码。","boundary":"普通栈表达嵌套关系，单调栈还维护候选数值顺序。","chapters":[5,92]},{"id":"concept:greedy","key":"greedy","type":"concept","label":"贪心与安全选择","en":"Greedy","area":"algorithms","note":"Concepts/贪心与安全选择.md","description":"通过可证明安全的当前选择或边界扩展，逐步构造满足目标的解。","boundary":"局部看起来有利不等于全局正确，需要排除或交换依据。","chapters":[7,94]},{"id":"concept:complexity","key":"complexity","type":"concept","label":"复杂度与资源成本","en":"Complexity","area":"algorithms","note":"Concepts/复杂度与资源成本.md","description":"把时间、辅助空间与输出成本分开分析，并说明期望、摊还和最坏情况的差别。","boundary":"循环层数不直接等于复杂度，数据结构操作与输出规模也要计入。","chapters":[7,8,13]},{"id":"concept:recursion","key":"recursion","type":"concept","label":"递归与子问题契约","en":"Recursion","area":"algorithms","note":"Concepts/递归与子问题契约.md","description":"定义一个调用解决什么子问题、返回什么结果，以及何时终止，再组织子调用。","boundary":"树上的返回值、搜索中的路径状态和回溯撤销各有不同语义。","chapters":[9,88,90]},{"id":"concept:data-structures","key":"data-structures","type":"concept","label":"数组、链表、树与图","en":"Data Structures","area":"algorithms","note":"Concepts/数组、链表、树与图.md","description":"根据主要操作选择信息的组织方式，理解访问、更新、顺序与连接关系的成本。","boundary":"数据结构提供操作能力，本身不决定整个任务的算法。","chapters":[5,6,87]},{"id":"concept:heap","key":"heap","type":"concept","label":"堆与优先队列","en":"Heap","area":"hot100","note":"Concepts/堆与优先队列.md","description":"以高效取极值和插入维护候选边界，服务 Top K、合并有序序列与流式统计。","boundary":"堆内部不保证全序，不能把堆数组当作排序结果。","chapters":[5,93]},{"id":"concept:trie","key":"trie","type":"concept","label":"前缀树","en":"Trie","area":"hot100","note":"Concepts/前缀树.md","description":"通过共享字符路径支持词与前缀查询，结束标记区分完整单词与前缀。","boundary":"空间依赖创建的节点和孩子结构，不能只说每个操作线性。","chapters":[12,89]},{"id":"concept:graph-algorithms","key":"graph-algorithms","type":"concept","label":"图、路径与依赖","en":"Graph Algorithms","area":"algorithms","note":"Concepts/图、路径与依赖.md","description":"把连接、可达、最短路与先后依赖转成节点、边及相应遍历或优化问题。","boundary":"图是否有向、边权是否非负、是否等权会改变适用算法。","chapters":[10,11,89]},{"id":"concept:operating-system","key":"operating-system","type":"concept","label":"操作系统与资源管理","en":"Operating System","area":"systems","note":"Concepts/操作系统与资源管理.md","description":"管理程序执行、内存、调度与同步，让有限资源服务多个任务。","boundary":"并发、并行、阻塞与异步描述的层次不同。","chapters":[2,3]},{"id":"concept:network","key":"network","type":"concept","label":"网络与服务性能","en":"Network","area":"infrastructure","note":"Concepts/网络与服务性能.md","description":"沿请求路径理解命名、传输、协议、拥塞、缓存和负载分配。","boundary":"延迟与吞吐是不同指标，服务可靠性还涉及重试与幂等。","chapters":[17,18]},{"id":"concept:consensus","key":"consensus","type":"concept","label":"分布式共识","en":"Consensus","area":"infrastructure","note":"Concepts/分布式共识.md","description":"在故障与通信约束下，让多个节点对日志或状态推进形成一致决定。","boundary":"复制数据不自动提供任意故障条件下的一致性。","chapters":[19,20]},{"id":"concept:cache","key":"cache","type":"concept","label":"缓存与复用","en":"Cache","area":"infrastructure","note":"Concepts/缓存与复用.md","description":"保存可复用结果以减少重复工作，并管理容量、有效性与替换策略。","boundary":"LRU 管替换顺序，KV cache 复用模型前缀，二者对象与约束不同。","chapters":[18,58,87]},{"id":"concept:feature-engineering","key":"feature-engineering","type":"concept","label":"特征处理与数据划分","en":"Feature Engineering","area":"data-evaluation","note":"Concepts/特征处理与数据划分.md","description":"把原始数据变成任务可用输入，在正确训练划分内估计处理统计。","boundary":"预处理、特征选择与目标编码都可能引入泄露。","chapters":[23,37,38]},{"id":"concept:linear-models","key":"linear-models","type":"concept","label":"线性模型与正则化","en":"Linear Models","area":"ml-methods","note":"Concepts/线性模型与正则化.md","description":"用线性组合建模，并通过链接函数、惩罚和基函数扩展表达与参数偏好。","boundary":"逻辑回归通常处理分类概率，名称里的回归不代表输出只能是连续值。","chapters":[26]},{"id":"concept:decision-tree","key":"decision-tree","type":"concept","label":"决策树与划分","en":"Decision Tree","area":"ml-methods","note":"Concepts/决策树与划分.md","description":"通过目标相关的特征条件逐步划分数据，在叶节点形成预测。","boundary":"深树易不稳定，复杂度控制与集成是不同处理途径。","chapters":[27]},{"id":"concept:clustering","key":"clustering","type":"concept","label":"聚类与密度结构","en":"Clustering","area":"ml-methods","note":"Concepts/聚类与密度结构.md","description":"依据距离、密度或概率模型刻画无标签数据的分组结构。","boundary":"簇与真实类别未必一致，不同尺度与形状假设会改变结果。","chapters":[31]},{"id":"concept:anomaly-detection","key":"anomaly-detection","type":"concept","label":"异常检测与分布外识别","en":"Anomaly Detection","area":"ml-methods","note":"Concepts/异常检测与分布外识别.md","description":"根据孤立性、局部密度、边界或模型误差构造异常分数。","boundary":"异常分数不自动等于经过校准的异常概率。","chapters":[34]},{"id":"concept:time-series","key":"time-series","type":"concept","label":"时间序列与状态估计","en":"Time Series","area":"ml-methods","note":"Concepts/时间序列与状态估计.md","description":"利用时间依赖、趋势、误差结构或隐藏状态建模随时间变化的数据。","boundary":"验证需要尊重时间顺序，未来信息不能进入过去预测。","chapters":[36]},{"id":"concept:causality","key":"causality","type":"concept","label":"因果、干预与不确定性","en":"Causality","area":"data-evaluation","note":"Concepts/因果、干预与不确定性.md","description":"区分相关预测与干预效应，利用实验、假设和不确定性评估支持结论。","boundary":"特征重要性与拟合效果不能单独证明因果关系。","chapters":[39]},{"id":"concept:neural-network","key":"neural-network","type":"concept","label":"神经网络与可微建模","en":"Neural Network","area":"training","note":"Concepts/神经网络与可微建模.md","description":"把参数化变换组合起来，以训练目标和梯度计算学习表征。","boundary":"网络结构、损失函数、优化方法和评价标准是不同层次。","chapters":[40,48]},{"id":"concept:cnn","key":"cnn","type":"concept","label":"卷积与视觉归纳偏置","en":"CNN","area":"architectures","note":"Concepts/卷积与视觉归纳偏置.md","description":"利用局部连接与权重共享学习视觉模式，并通过残差等结构组织深层计算。","boundary":"局部不变性与共享是建模偏好，实际效果需要数据和任务验证。","chapters":[48,49]},{"id":"concept:rnn","key":"rnn","type":"concept","label":"循环、状态与序列","en":"RNN","area":"architectures","note":"Concepts/循环、状态与序列.md","description":"通过随序列更新的隐藏状态汇总历史，门控结构调节信息保留。","boundary":"序列长度、梯度传播和并行计算约束共同影响适用性。","chapters":[48,50]},{"id":"concept:mlops","key":"mlops","type":"concept","label":"部署、监控与 MLOps","en":"MLOps","area":"architectures","note":"Concepts/部署、监控与 MLOps.md","description":"将模型训练、版本、部署和线上监控连接成可维护的工程流程。","boundary":"离线指标改善不自动保证线上数据分布和业务效果。","chapters":[51]},{"id":"concept:multimodal-representation","key":"multimodal-representation","type":"concept","label":"多模态对齐与表征","en":"Multimodal Representation","area":"multimodal","note":"Concepts/多模态对齐与表征.md","description":"学习跨文本、图像、语音等数据的表示与对应关系，服务检索和条件生成。","boundary":"相似向量、跨模态理解和可靠行动仍是不同评价目标。","chapters":[64]},{"id":"concept:bellman","key":"bellman","type":"concept","label":"回报、价值与 Bellman 关系","en":"Bellman","area":"rl","note":"Concepts/回报、价值与 Bellman 关系.md","description":"用即时奖励与后续价值的关系组织长期决策学习，区分估计与控制。","boundary":"价值取决于策略、折扣和任务定义，不能只比较单步奖励。","chapters":[65,66]},{"id":"concept:policy-gradient","key":"policy-gradient","type":"concept","label":"策略梯度与 Actor-Critic","en":"Policy Gradient","area":"rl","note":"Concepts/策略梯度与 Actor-Critic.md","description":"直接改进动作策略，并结合价值估计构造学习信号。","boundary":"策略目标中的限制与梯度裁剪属于不同机制。","chapters":[65,67]},{"id":"concept:imitation-learning","key":"imitation-learning","type":"concept","label":"模仿学习与示范数据","en":"Imitation Learning","area":"rl","note":"Concepts/模仿学习与示范数据.md","description":"从专家示范学习动作或策略，并考虑状态分布偏移与交互反馈。","boundary":"行为克隆能拟合示范，不保证滚动执行时仍停留在示范分布。","chapters":[68,71]},{"id":"concept:motion-planning","key":"motion-planning","type":"concept","label":"定位、规划与控制","en":"Motion Planning","area":"embodied","note":"Concepts/定位、规划与控制.md","description":"用感知和状态估计定位环境，再生成路径与反馈控制行动。","boundary":"几何路径、动力学约束与实际执行反馈需要分开处理。","chapters":[70]},{"id":"concept:disjoint-set-union","key":"disjoint-set-union","type":"concept","label":"并查集","en":"Disjoint Set Union","area":"algorithms","note":"Concepts/并查集.md","description":"用代表元维护互不重叠集合，支持连通判断与合并。","boundary":"普通结构主要处理增加连接；路径压缩改变树形但不改变集合。","chapters":[98]},{"id":"concept:zero-one-bfs","key":"zero-one-bfs","type":"concept","label":"零一最短路","en":"0-1 BFS","area":"algorithms","note":"Concepts/零一最短路.md","description":"用双端队列处理边权只有 0 与 1 的最短路。","boundary":"按距离改进松弛，不可照搬首次入队即永远确定。","chapters":[99]},{"id":"concept:bellman-ford","key":"bellman-ford","type":"concept","label":"Bellman-Ford 与负环","en":"Bellman-Ford","area":"algorithms","note":"Concepts/Bellman-Ford 与负环.md","description":"重复松弛处理负边，并区分源点可达负环的影响。","boundary":"不可达负环不会自动使该源点的全部结果失效。","chapters":[99]},{"id":"concept:fenwick-tree","key":"fenwick-tree","type":"concept","label":"树状数组","en":"Fenwick Tree","area":"algorithms","note":"Concepts/树状数组.md","description":"以二进制分块支持单点加与前缀求和。","boundary":"一基索引要防止更新 0；区间和可由两个前缀之差得到。","chapters":[100]},{"id":"concept:segment-tree","key":"segment-tree","type":"concept","label":"线段树与懒标记","en":"Segment Tree","area":"algorithms","note":"Concepts/线段树与懒标记.md","description":"分层维护可合并的区间摘要，并按需传播区间更新。","boundary":"标记复合次序与摘要更新必须和运算相符。","chapters":[100]},{"id":"concept:difference-array","key":"difference-array","type":"concept","label":"差分数组","en":"Difference Array","area":"algorithms","note":"Concepts/差分数组.md","description":"用区间端点变化压缩批量区间加，最后以前缀累加还原。","boundary":"适合离线还原；在线查询通常还需其他结构。","chapters":[100]},{"id":"concept:kmp-prefix-function","key":"kmp-prefix-function","type":"concept","label":"KMP 与前缀函数","en":"KMP Prefix Function","area":"algorithms","note":"Concepts/KMP 与前缀函数.md","description":"利用已匹配部分的真前后缀在失配后复用比较信息。","boundary":"前缀函数值是长度，报告匹配后要处理重叠和空模式约定。","chapters":[101]},{"id":"concept:aho-corasick","key":"aho-corasick","type":"concept","label":"多模式自动机","en":"Aho-Corasick","area":"algorithms","note":"Concepts/多模式自动机.md","description":"在前缀树上使用失败链接与输出关系寻找多个模式。","boundary":"复杂度需要声明转移实现并另计实际输出数量。","chapters":[101]},{"id":"concept:lis-tails","key":"lis-tails","type":"concept","label":"最长递增子序列与结尾状态","en":"LIS Tails","area":"algorithms","note":"Concepts/最长递增子序列与结尾状态.md","description":"保存每种长度的最小结尾，以二分更新最长严格递增长度。","boundary":"tails 不一定是原输入中的实际子序列，恢复路径另需前驱。","chapters":[102]},{"id":"concept:weighted-interval-dp","key":"weighted-interval-dp","type":"concept","label":"带权区间调度","en":"Weighted Interval Scheduling","area":"algorithms","note":"Concepts/带权区间调度.md","description":"按结束时间组织任务，把选择接到兼容前驱的最优收益。","boundary":"任务数最大与收益最大不同，最早结束的贪心不能无条件复用。","chapters":[102]},{"id":"concept:interval-dp","key":"interval-dp","type":"concept","label":"区间动态规划","en":"Interval DP","area":"algorithms","note":"Concepts/区间动态规划.md","description":"用连续区间定义子问题，枚举切分并按长度填表。","boundary":"合并成本由任务决定，不能只套一个区间模板。","chapters":[102]},{"id":"concept:bitmask-dp","key":"bitmask-dp","type":"concept","label":"状态压缩动态规划","en":"Bitmask DP","area":"algorithms","note":"Concepts/状态压缩动态规划.md","description":"把小规模集合编码进状态，显式保留访问集合与终点。","boundary":"位表示不会消除指数状态数，语言整数位宽也有限制。","chapters":[102]},{"id":"concept:binary-search-answer","key":"binary-search-answer","type":"concept","label":"二分答案与可行性","en":"Binary Search on Answer","area":"algorithms","note":"Concepts/二分答案与可行性.md","description":"利用候选答案下的单调可行性查找最优边界。","boundary":"可行性检查的贪心必须独立证明，负数等约束会改变论证。","chapters":[103]},{"id":"concept:reservoir-sampling","key":"reservoir-sampling","type":"concept","label":"蓄水池采样","en":"Reservoir Sampling","area":"algorithms","note":"Concepts/蓄水池采样.md","description":"在未知长度的数据流中使用固定空间进行均匀采样。","boundary":"均匀随机区间和采样单位的定义决定概率是否正确。","chapters":[104]},{"id":"concept:bloom-filter","key":"bloom-filter","type":"concept","label":"布隆过滤器","en":"Bloom Filter","area":"algorithms","note":"Concepts/布隆过滤器.md","description":"用位数组与多个哈希位置做允许假阳性的成员过滤。","boundary":"标准只插入条件下无假阴性，普通位图不能直接安全删除。","chapters":[104]},{"id":"concept:amortized-analysis","key":"amortized-analysis","type":"concept","label":"摊还分析","en":"Amortized Analysis","area":"algorithms","note":"Concepts/摊还分析.md","description":"通过一串操作的总代价说明每次操作的平均分摊成本。","boundary":"它不等于依赖随机输入的期望分析，也不是每次都便宜。","chapters":[105]},{"id":"chapter:01","type":"chapter","label":"第 01 讲 · 整套知识地图与学习目标","area":"practice","note":"Chapters/第 01 讲 整套知识地图与学习目标.md","description":"先建立一个整体地图。计算机科学的底层，关注计算机如何存储信息、运行程序，以及多台机器如何互相通信。数据结构和算法解决的是：怎样组织数据，以及怎样用尽可能少的时间和资源完成任务。操作系统管理硬件和程序。数据库负责可靠地保存、查询和更新数据。计算机网络负责让不同机器交换信息。分布式系统负责让很多机器协同工作。","chapter":1,"source":"chapters/01.md"},{"id":"chapter:02","type":"chapter","label":"第 02 讲 · 计算机组成：CPU、GPU、内存、存储和操作系统","area":"systems","note":"Chapters/第 02 讲 计算机组成：CPU、GPU、内存、存储和操作系统.md","description":"计算机的基本执行单元是 CPU，中央处理器。CPU 擅长逻辑判断、顺序执行、处理复杂的控制流程。GPU，图形处理器，擅长大量相似计算同时进行。深度学习中的矩阵运算高度并行，所以 GPU 成为训练和推理的主要硬件之一。GPU 并不是在所有事情上都比 CPU 快；它的优势来自合适的计算任务和足够的数据并行性。","chapter":2,"source":"chapters/02.md"},{"id":"chapter:03","type":"chapter","label":"第 03 讲 · 系统里的算法：CPU 调度、页面置换、垃圾回收与编译","area":"systems","note":"Chapters/第 03 讲 系统里的算法：CPU 调度、页面置换、垃圾回收与编译.md","description":"操作系统调度决定谁获得 CPU。先来先服务简单，但长任务可能挡住短任务。Round robin 给各任务轮流分配时间片，兼顾响应。最短任务优先利用任务时长信息减少某些等待，但真实时长不总可知，也可能让长任务饥饿。多级反馈队列根据任务运行行为调整优先级，在交互响应与吞吐之间折中。调度算法的好坏取决于目标，不是只看总运算次数。","chapter":3,"source":"chapters/03.md"},{"id":"chapter:04","type":"chapter","label":"第 04 讲 · 程序、编译器、API 与软件抽象","area":"systems","note":"Chapters/第 04 讲 程序、编译器、API 与软件抽象.md","description":"程序设计语言负责把人的意图表达成机器可执行的步骤。Python 适合快速开发、数据分析和机器学习。C 和 C++ 常用于性能敏感的软件和系统。Java、Go、Rust、JavaScript 也各有生态：Go 常见于云服务，Rust 强调内存安全，JavaScript 是网页前端的重要语言。","chapter":4,"source":"chapters/04.md"},{"id":"chapter:05","type":"chapter","label":"第 05 讲 · 数据结构：计算机怎样组织信息","area":"algorithms","note":"Chapters/第 05 讲 数据结构：计算机怎样组织信息.md","description":"数据结构可以理解为数据的收纳方式。不同收纳方式，决定了查找、插入、删除和排序的成本。","chapter":5,"source":"chapters/05.md"},{"id":"chapter:06","type":"chapter","label":"第 06 讲 · 树、哈希与区间结构：为什么换一种收纳方式就会变快","area":"algorithms","note":"Chapters/第 06 讲 树、哈希与区间结构：为什么换一种收纳方式就会变快.md","description":"哈希表根据键计算存储位置，不同键可能落在同一个位置，这就是冲突。链地址法在这个位置保留一组候选，再比较真正的键。开放寻址则按规则继续探查其他槽位。装得太满时，探查和冲突会增加，因此常通过扩容、重新散列维持效率。哈希相同不意味着对象相同，也不意味着哈希函数坏了。它适合按账号、订单编号快速查找，但一般不能直接回答某个价格区间里的所有记录。","chapter":6,"source":"chapters/06.md"},{"id":"chapter:07","type":"chapter","label":"第 07 讲 · 算法设计思想：不求推导，但必须认识","area":"algorithms","note":"Chapters/第 07 讲 算法设计思想：不求推导，但必须认识.md","description":"Algorithm，算法，就是解决问题的一系列明确步骤。Time Complexity，时间复杂度，描述输入规模增长时，计算开销如何增长。Space Complexity，空间复杂度，描述所需内存如何增长。Big O，大 O 记号，主要讨论增长速度，而不是在某台电脑上的实际运行秒数。一个算法理论复杂度更好，也不一定在所有小规模输入上更快。","chapter":7,"source":"chapters/07.md"},{"id":"chapter:08","type":"chapter","label":"第 08 讲 · 排序与选择：不是所有排序都靠同一种思路","area":"algorithms","note":"Chapters/第 08 讲 排序与选择：不是所有排序都靠同一种思路.md","description":"这一讲先把排序算法拆开。排序不仅是把数字从小排到大，也常常是后续去重、合并日志、范围查询和连接数据的准备步骤。稳定排序意味着关键字相同的记录保持原来的先后次序。例如先按时间排好的订单，再按客户稳定排序，同一客户的订单仍保留时间顺序。","chapter":8,"source":"chapters/08.md"},{"id":"chapter:09","type":"chapter","label":"第 09 讲 · 搜索与动态规划：怎样避免把同一件事算很多次","area":"algorithms","note":"Chapters/第 09 讲 搜索与动态规划：怎样避免把同一件事算很多次.md","description":"二分搜索每次通过一次判断排除一半候选区域。最常见对象是有序数组，但真正关键是判定结果具有单调性，例如某个生产速度是否足以在期限内完成订单。这样可以搜索可行与不可行之间的分界，而不只是搜索一个数。它要求能正确确定舍弃哪一半；数据没有顺序或判定不单调时不能直接使用。面试时说明这种适用前提，比只说速度很快更有价值。","chapter":9,"source":"chapters/09.md"},{"id":"chapter:10","type":"chapter","label":"第 10 讲 · 图算法之一：从遍历到最短路线","area":"algorithms","note":"Chapters/第 10 讲 图算法之一：从遍历到最短路线.md","description":"广度优先搜索使用队列，先探索一步能够到达的节点，再探索两步能够到达的节点。因此在每条边代价相同的图中，它能找到最少步数路径。深度优先搜索使用递归或显式栈，沿一条路径深入，走不通再返回，适合分析依赖、连通结构与进行回溯。DFS 找到一条路径不意味着找到最短路径。两者都需要记录访问状态，避免在环里无限绕行。","chapter":10,"source":"chapters/10.md"},{"id":"chapter:11","type":"chapter","label":"第 11 讲 · 图算法之二：连接、依赖、流量与重要性","area":"algorithms","note":"Chapters/第 11 讲 图算法之二：连接、依赖、流量与重要性.md","description":"最小生成树要以最低总边成本连接所有节点，而不是让每对节点之间的路线都最短。Kruskal 把边按成本排列，依次挑选不会产生环的边，通常用并查集检查。Prim 从一个节点开始，每次选最便宜的边，把一个新节点接入已有树。铺设网络或管线时，理解这种总连接成本很有用。两种方法都体现贪心，但选择的对象和维护的结构不同。","chapter":11,"source":"chapters/11.md"},{"id":"chapter:12","type":"chapter","label":"第 12 讲 · 字符串、压缩与流式算法：海量文本怎样处理","area":"algorithms","note":"Chapters/第 12 讲 字符串、压缩与流式算法：海量文本怎样处理.md","description":"朴素字符串匹配遇到不一致时，往往退回去重新比较已经看过的字符。KMP 预先分析模式串自身的前后缀结构，失败时知道哪些信息还能沿用，因此避免反复回看文本。Boyer-Moore 常从模式串末端开始比较，利用不匹配的字符等规则大幅跳过不可能的位置。前者强调不浪费已知匹配信息，后者强调大胆而有依据地跳跃。两者解决精确匹配，不是语义相似搜索。","chapter":12,"source":"chapters/12.md"},{"id":"chapter:13","type":"chapter","label":"第 13 讲 · 跨领域算法思想：P 与 NP、FFT、优化、哈希、加密","area":"algorithms","note":"Chapters/第 13 讲 跨领域算法思想：P 与 NP、FFT、优化、哈希、加密.md","description":"可计算性问是否存在总能完成的算法，复杂度问完成需要多少资源。有些问题一般情况下不可判定，如适当表述下的停机问题；有些可计算但规模大时成本极高。一个程序在小样本上能跑，不代表能扩展到真实规模。复杂度通常关注输入增长，而不是某台电脑今天跑了几秒。","chapter":13,"source":"chapters/13.md"},{"id":"chapter:14","type":"chapter","label":"第 14 讲 · 数据库：存储、检索、事务与索引","area":"infrastructure","note":"Chapters/第 14 讲 数据库：存储、检索、事务与索引.md","description":"Database，数据库，是组织并管理持久数据的系统。DBMS 是数据库管理系统。关系型数据库，例如 PostgreSQL 和 MySQL，把数据放在表中。每行代表一条记录，每列代表一种字段。SQL 是查询和修改关系数据的主要语言。SELECT 负责查找，INSERT 负责插入，UPDATE 负责更新，DELETE 负责删除。JOIN 能把多张表按照关联条件组合起来。","chapter":14,"source":"chapters/14.md"},{"id":"chapter:15","type":"chapter","label":"第 15 讲 · 数据库算法之一：索引与存储引擎","area":"infrastructure","note":"Chapters/第 15 讲 数据库算法之一：索引与存储引擎.md","description":"数据库索引之所以常使用多路树，而不是简单二叉树，是因为一次读取磁盘页或内存页可以得到许多键。每个节点保存很多分界点，一次读取就能决定进入哪个大范围，让树保持较矮。B+ 树通常让内部节点只负责导航，记录或记录引用集中在叶子，叶子之间顺序连接，因此范围扫描更方便。","chapter":15,"source":"chapters/15.md"},{"id":"chapter:16","type":"chapter","label":"第 16 讲 · 数据库算法之二：连接、事务与崩溃恢复","area":"infrastructure","note":"Chapters/第 16 讲 数据库算法之二：连接、事务与崩溃恢复.md","description":"嵌套循环连接遍历一张表的记录，再去另一张表寻找匹配。有合适索引且外表很小时，它并不一定慢。哈希连接先把一侧按连接键建立哈希表，再扫描另一侧探测匹配，适合许多等值连接，但内存不足可能需要分批落盘。归并连接利用两侧已经有序的连接键，像合并两个名单一样向前推进。它需要有序输入，已有索引或排序可以提供这种顺序。不存在永远最快的连接算法，数据规模、选择性、索引和内存决定选择。","chapter":16,"source":"chapters/16.md"},{"id":"chapter:17","type":"chapter","label":"第 17 讲 · 计算机网络：一次网页请求经历什么","area":"infrastructure","note":"Chapters/第 17 讲 计算机网络：一次网页请求经历什么.md","description":"网络是多台设备传输数据的基础。IP Address，IP 地址，负责标识网络中的通信端点。Packet，数据包，是网络传输的数据单位。Router，路由器，负责把数据包朝目的地转发。DNS，域名系统，把人类易读的域名解析到相关网络地址。","chapter":17,"source":"chapters/17.md"},{"id":"chapter:18","type":"chapter","label":"第 18 讲 · 网络与服务算法：拥塞、限流、缓存、负载均衡","area":"infrastructure","note":"Chapters/第 18 讲 网络与服务算法：拥塞、限流、缓存、负载均衡.md","description":"TCP 通过序号、确认和必要的重传，使接收方获得可靠且按序的字节流。滑动窗口允许多个数据段在等待确认期间同时在路上，避免每发一点就停下来等。接收方流量控制关心对方是否来得及接收，拥塞控制关心网络本身是否承受得住。它们解决不同瓶颈。可靠传输并不意味着应用业务绝不会重复执行：请求是否已被服务器处理，仍然需要应用层协议判断。","chapter":18,"source":"chapters/18.md"},{"id":"chapter:19","type":"chapter","label":"第 19 讲 · 分布式系统与软件工程：怎样把程序运行成产品","area":"infrastructure","note":"Chapters/第 19 讲 分布式系统与软件工程：怎样把程序运行成产品.md","description":"一个程序在自己电脑上能跑，只说明它完成了第一步。真正产品还要支持同时访问、异常恢复、部署更新、监控与成本控制。这就是软件工程与分布式系统的价值。","chapter":19,"source":"chapters/19.md"},{"id":"chapter:20","type":"chapter","label":"第 20 讲 · 分布式算法：让多台机器对同一件事保持一致","area":"infrastructure","note":"Chapters/第 20 讲 分布式算法：让多台机器对同一件事保持一致.md","description":"共识问题不是简单地让机器各投一票，而是在消息延迟、节点重启和网络断开时，仍让已经确定的更新顺序不互相矛盾。Raft 把问题拆成选主、日志复制与安全规则：领导者组织更新，多数派确认帮助形成可靠进展，新领导者也不能随意覆盖已提交结果。Paxos 通过提案编号、承诺与接受规则保证选择的一致性，Multi-Paxos 将相关思想用于连续的日志决定。两者常针对崩溃故障，不自动抵抗任意恶意节点。","chapter":20,"source":"chapters/20.md"},{"id":"chapter:21","type":"chapter","label":"第 21 讲 · 机器学习到底在解决什么问题","area":"data-evaluation","note":"Chapters/第 21 讲 机器学习到底在解决什么问题.md","description":"Machine Learning，机器学习，是从数据中学习输入到输出之间的关系，或发现数据内部的结构，而不是为每个情况手写规则。一个机器学习项目通常包括定义任务、收集数据、构造特征、选择模型、训练模型、评估模型和部署模型。","chapter":21,"source":"chapters/21.md"},{"id":"chapter:22","type":"chapter","label":"第 22 讲 · 训练词汇起点：样本、张量、标签、Logit 与概率","area":"data-evaluation","note":"Chapters/第 22 讲 训练词汇起点：样本、张量、标签、Logit 与概率.md","description":"算法名称告诉你用了哪种方法，下面这些词则告诉你方法具体在处理什么。把它们接起来，才能听懂别人描述一次训练。这里没有公式，也不需要记住函数写法。","chapter":22,"source":"chapters/22.md"},{"id":"chapter:23","type":"chapter","label":"第 23 讲 · 数据处理词汇：缺失值、编码、采样、泄露与特征选择","area":"data-evaluation","note":"Chapters/第 23 讲 数据处理词汇：缺失值、编码、采样、泄露与特征选择.md","description":"缺失值可能是没有记录、传感器故障，也可能是某类人本来就不填写。Imputation，插补，用中位数、最常见值或模型估计等填补缺失。Missingness indicator 额外告诉模型原来的值是否缺失。缺失本身可能有预测信息，但也可能暴露上线时不存在的工作流程差异。把所有缺失一律填零，会把“没有记录”与“真实等于零”混淆。","chapter":23,"source":"chapters/23.md"},{"id":"chapter:24","type":"chapter","label":"第 24 讲 · 学习方式地图：半监督、自监督、迁移、主动学习与持续学习","area":"data-evaluation","note":"Chapters/第 24 讲 学习方式地图：半监督、自监督、迁移、主动学习与持续学习.md","description":"半监督学习同时利用少量有标签和大量无标签数据。伪标签让模型为无标签样本给出候选答案，再筛选较可信的部分继续训练。Label propagation 根据相似图把标签信息传给邻居。它们希望利用未标注数据结构，但错误伪标签可能被不断强化，因此需要置信筛选、验证和适当的不确定性处理。","chapter":24,"source":"chapters/24.md"},{"id":"chapter:25","type":"chapter","label":"第 25 讲 · 传统机器学习算法：线性模型、树、随机森林和 Boosting","area":"ml-methods","note":"Chapters/第 25 讲 传统机器学习算法：线性模型、树、随机森林和 Boosting.md","description":"这一讲介绍常见的算法家族，后面的独立章节会继续展开。先从 Linear Regression，线性回归，开始。它假设预测结果可以由多个输入变量的加权组合来近似，适合预测连续数值。优点是简单、快速、容易解释，缺点是对复杂非线性关系表达能力有限，除非人为加入更丰富的特征。","chapter":25,"source":"chapters/25.md"},{"id":"chapter:26","type":"chapter","label":"第 26 讲 · 线性模型家族：回归、Ridge、Lasso、Logistic 与 GAM","area":"ml-methods","note":"Chapters/第 26 讲 线性模型家族：回归、Ridge、Lasso、Logistic 与 GAM.md","description":"线性回归用输入特征的加权组合预测一个连续量，例如根据面积、位置和楼龄预测房价。它可以作为快速、可解释的基线。所谓线性，主要是针对可学习系数；预先加入平方项、交互项或其他变换后，也能描述一定的非线性关系。系数大小不能脱离单位与特征相关性解释，更不能直接读成因果效应。模型在训练范围外可以给出外推，但外推不一定可信。","chapter":26,"source":"chapters/26.md"},{"id":"chapter:27","type":"chapter","label":"第 27 讲 · 决策树与随机森林：从一次提问到许多不同的树","area":"ml-methods","note":"Chapters/第 27 讲 决策树与随机森林：从一次提问到许多不同的树.md","description":"决策树通过一系列条件把样本分组。Node 是节点，split 是划分，leaf 是不再继续划分的叶节点。预测新订单是否取消时，树可能先按价格区间分，再按配送时间分，最后在叶节点给出取消比例等预测。分类树预测类别或概率，回归树预测连续值。树不是人在训练前手写好的全部规则；训练会依据目标选择特征与切分点。","chapter":27,"source":"chapters/27.md"},{"id":"chapter:28","type":"chapter","label":"第 28 讲 · Boosting 家族：AdaBoost、GBDT、XGBoost、LightGBM、CatBoost","area":"ml-methods","note":"Chapters/第 28 讲 Boosting 家族：AdaBoost、GBDT、XGBoost、LightGBM、CatBoost.md","description":"AdaBoost 顺序训练多个较弱的模型，并提高前面误判样本的权重，让后续模型更关注这些样本。最后把模型按相应权重组合。它强调对难例的逐轮关注，是提升方法的经典代表。标签错误也可能被不断强调，因此对噪声要小心。它与随机森林的区别不是树多还是树少，而是后面的训练是否依赖前面已经取得的结果。","chapter":28,"source":"chapters/28.md"},{"id":"chapter:29","type":"chapter","label":"第 29 讲 · 近邻、核方法与概率分类：KNN、SVM、朴素贝叶斯、LDA、GP","area":"ml-methods","note":"Chapters/第 29 讲 近邻、核方法与概率分类：KNN、SVM、朴素贝叶斯、LDA、GP.md","description":"KNN 对新样本寻找最相近的若干已知样本，再投票或平均得到预测。它把“相似输入往往有相似答案”作为基本假设，几乎不需要传统意义上的参数拟合。关键在距离怎么定义、特征是否缩放，以及选择多少邻居。高维时距离可能不再容易区分，预测计算与存储也可能很贵。KNN 有标签并用邻居答案预测；K-means 没有这类监督标签，目的是分组。","chapter":29,"source":"chapters/29.md"},{"id":"chapter:30","type":"chapter","label":"第 30 讲 · 无监督学习、推荐系统、异常检测与时间序列","area":"ml-methods","note":"Chapters/第 30 讲 无监督学习、推荐系统、异常检测与时间序列.md","description":"Clustering，聚类，是把相似样本自动分组。K-means，K 均值聚类，先选定簇的数量，再反复分配样本和更新簇中心，直到基本稳定。它适合大致球形、以距离衡量相似性的簇。DBSCAN 是基于密度的聚类方法，能够发现不规则形状的密集区域，并识别一部分噪声点。Gaussian Mixture Model，高斯混合模型，用概率分布的混合表达不同群体，和 K-means 相比更强调软分配：一个样本可以以不同概率属于多个群体。","chapter":30,"source":"chapters/30.md"},{"id":"chapter:31","type":"chapter","label":"第 31 讲 · 聚类算法：K-means、DBSCAN、HDBSCAN、层次聚类与 GMM","area":"ml-methods","note":"Chapters/第 31 讲 聚类算法：K-means、DBSCAN、HDBSCAN、层次聚类与 GMM.md","description":"K-means 先选定分组数量，交替执行把样本分给最近中心、再根据成员更新中心。它适合在所用特征与距离下比较紧凑的群体，不能保证适合任意形状的簇。K-means++ 改善初始中心选择，让中心不要过于挤在一起，但不保证找到全局最优。特征尺度会影响距离，因此客户收入和年龄不能不加思考地直接混在一起。","chapter":31,"source":"chapters/31.md"},{"id":"chapter:32","type":"chapter","label":"第 32 讲 · 降维与表示：PCA、SVD、NMF、ICA、t-SNE、UMAP","area":"ml-methods","note":"Chapters/第 32 讲 降维与表示：PCA、SVD、NMF、ICA、t-SNE、UMAP.md","description":"PCA 寻找数据变化最明显的一组线性方向，用较少坐标保留尽可能多的总体变化。它可用于压缩、去噪或预处理，但变化最大不等于最有预测价值：类别差异有时藏在小方差方向里。标准 PCA 本身没有监督标签，因此不能保证保留最利于分类的信息。输入尺度很不同会影响结果，是否先标准化要依据任务决定。","chapter":32,"source":"chapters/32.md"},{"id":"chapter:33","type":"chapter","label":"第 33 讲 · 概率模型与隐藏状态：EM、HMM、Viterbi、贝叶斯网络","area":"ml-methods","note":"Chapters/第 33 讲 概率模型与隐藏状态：EM、HMM、Viterbi、贝叶斯网络.md","description":"最大似然选择让已有观察在模型下尽量合理的参数。MAP，最大后验，在观察之外还加入先验偏好。它们是参数估计原则，不是只属于某个模型的算法。神经网络用交叉熵训练，在相应概率解释下也与最大似然有关。先验不是随意相信某种结果，而是把已有假设放进模型，并应检查结论对它是否敏感。","chapter":33,"source":"chapters/33.md"},{"id":"chapter:34","type":"chapter","label":"第 34 讲 · 异常检测：Isolation Forest、LOF、One-Class SVM 与 OOD","area":"ml-methods","note":"Chapters/第 34 讲 异常检测：Isolation Forest、LOF、One-Class SVM 与 OOD.md","description":"Outlier 是相对已有数据显得不寻常的点。Novelty detection 通常先从较干净的正常数据学习，再检测新输入是否异常。OOD，分布外输入，强调新输入偏离模型训练适用范围。异常不等于错误，更不等于恶意：突然出现的新用户行为可能只是合法的新业务。方法最终输出的异常分数，还需要匹配实际决策与误报成本。","chapter":34,"source":"chapters/34.md"},{"id":"chapter:35","type":"chapter","label":"第 35 讲 · 推荐与排序：协同过滤、矩阵分解、双塔、LambdaMART","area":"ml-methods","note":"Chapters/第 35 讲 推荐与排序：协同过滤、矩阵分解、双塔、LambdaMART.md","description":"推荐系统通常先从巨大候选库召回一批对象，再用更昂贵的模型排序，最后按多样性、去重或约束重排。召回阶段关注别漏掉好候选，排序阶段关注有限候选里的精细顺序。一个商品根本没被召回，后面的强排序器也无法把它推荐出来。分阶段设计是用不同计算预算解决不同规模的问题。","chapter":35,"source":"chapters/35.md"},{"id":"chapter:36","type":"chapter","label":"第 36 讲 · 时间序列：ARIMA、ETS、GARCH、Kalman 与深度预测","area":"ml-methods","note":"Chapters/第 36 讲 时间序列：ARIMA、ETS、GARCH、Kalman 与深度预测.md","description":"Trend 是长期变化，seasonality 是周期性模式，lag 是过去若干时刻的观测。平稳性关注某些统计性质是否随时间保持稳定。它不是说数据永远不波动。预测未来首先要决定可用信息的截止时刻、预测多远，以及在每个时点如何更新模型。时间序列与普通表格的关键差别，是顺序与依赖不能随便打乱。","chapter":36,"source":"chapters/36.md"},{"id":"chapter:37","type":"chapter","label":"第 37 讲 · 模型训练、过拟合、指标和实验方法","area":"data-evaluation","note":"Chapters/第 37 讲 模型训练、过拟合、指标和实验方法.md","description":"理解一个算法的名字，只完成一半。真正面试里，面试官更在意你能否判断模型是不是有效。","chapter":37,"source":"chapters/37.md"},{"id":"chapter:38","type":"chapter","label":"第 38 讲 · 评价的细节：阈值、AUC、校准、Macro 与 Micro","area":"data-evaluation","note":"Chapters/第 38 讲 评价的细节：阈值、AUC、校准、Macro 与 Micro.md","description":"预测概率之后还要选分类阈值。提高阈值通常让系统少报正类，但可能漏掉更多真实正类。混淆矩阵区分真阳性、假阳性、真阴性、假阴性。Sensitivity 通常就是召回率，也叫 true positive rate；specificity 则关心真实负类里有多少被正确排除。它们不是同一个方向的能力，应该结合漏报与误报成本讨论。","chapter":38,"source":"chapters/38.md"},{"id":"chapter:39","type":"chapter","label":"第 39 讲 · 预测之外：因果、置信、不确定性与实验对照","area":"data-evaluation","note":"Chapters/第 39 讲 预测之外：因果、置信、不确定性与实验对照.md","description":"预测问题问看到这些特征时结果可能怎样。因果问题问主动改变某个因素会怎样。用户收到优惠券后购买率高，不代表优惠券造成全部差异，因为营销系统可能本来就给高意愿用户发券。混杂变量同时影响是否收到处理和结果，造成表面关联。高预测准确率不能替代因果识别。","chapter":39,"source":"chapters/39.md"},{"id":"chapter:40","type":"chapter","label":"第 40 讲 · 深度学习基础：神经网络怎样训练","area":"training","note":"Chapters/第 40 讲 深度学习基础：神经网络怎样训练.md","description":"Deep Learning，深度学习，是通过多层可学习的变换，从数据中提取复杂表征。Neural Network，神经网络，由许多带参数的运算单元组织成层。Input Layer 接收输入，Hidden Layers 处理信息，Output Layer 产生预测。MLP，Multi Layer Perceptron，多层感知机，是最基本的前馈神经网络形式。","chapter":40,"source":"chapters/40.md"},{"id":"chapter:41","type":"chapter","label":"第 41 讲 · 损失函数第一讲：BCE、交叉熵、MSE 为什么不同","area":"training","note":"Chapters/第 41 讲 损失函数第一讲：BCE、交叉熵、MSE 为什么不同.md","description":"Loss，损失，给模型的错误打分，是训练时希望改善的对象。Objective，目标函数，可能还包含正则化等额外要求。Metric，评估指标，告诉我们效果是否符合任务需要。训练目标和汇报指标可以不同：例如用 BCE 训练是否购买的概率预测器，上线时关注精确率或实际转化效果。选择一种可优化的损失，只是为了让训练有方向，不保证它与最终业务目标完全一致。","chapter":41,"source":"chapters/41.md"},{"id":"chapter:42","type":"chapter","label":"第 42 讲 · 损失函数第二讲：Focal、Dice、KL、对比学习与排序损失","area":"training","note":"Chapters/第 42 讲 损失函数第二讲：Focal、Dice、KL、对比学习与排序损失.md","description":"当某类样本非常少时，可以让它在损失里占更大权重，避免大量容易的多数类样本主导训练。Class weight 是类别权重；BCE 中的 positive weight 是对正标签项施加的权重。这与复制少数类样本、修改分类阈值相关，但不是同一个操作。权重改变训练偏好，也可能改变概率校准情况，不能默认输出仍直接反映自然人群中的发生比例。最后仍应在符合部署分布的数据上检查。","chapter":42,"source":"chapters/42.md"},{"id":"chapter:43","type":"chapter","label":"第 43 讲 · Learning Rate：学习率、Warmup 和 Scheduler","area":"training","note":"Chapters/第 43 讲 Learning Rate：学习率、Warmup 和 Scheduler.md","description":"学习率控制优化器更新模型参数时的总体步幅。它不是学习了多少知识，也不是训练运行了多少轮。可以想象在一片地形中寻找低处：更新方向告诉你朝哪里走，学习率影响你往那个方向走多大一步。不同优化器还会根据历史梯度改变各参数的实际更新，因此学习率并不是每个参数绝对改变的固定数值。","chapter":43,"source":"chapters/43.md"},{"id":"chapter:44","type":"chapter","label":"第 44 讲 · 一次训练到底发生什么：Batch、Step、Epoch 与反向传播","area":"training","note":"Chapters/第 44 讲 一次训练到底发生什么：Batch、Step、Epoch 与反向传播.md","description":"前向传播把输入变成预测。损失函数把预测与目标比较。反向传播计算各个参数对损失变化的影响，也就是梯度。优化器再依据这些梯度和自身状态更新参数。反向传播负责算梯度，不等于更新参数；Adam 和 SGD 是更新方法，不是计算网络结构的替代品。这条链条是听懂训练代码的基础。","chapter":44,"source":"chapters/44.md"},{"id":"chapter:45","type":"chapter","label":"第 45 讲 · 优化器家族：SGD、Momentum、Adam 与 AdamW","area":"training","note":"Chapters/第 45 讲 优化器家族：SGD、Momentum、Adam 与 AdamW.md","description":"全批量梯度下降用全部训练数据计算一次更新方向，每一步比较稳定，但大数据时成本高。随机梯度下降在严格命名下可指每次只用一个样本；现代训练中说 SGD，经常实际上使用小批量。小批量牺牲了单步方向的精确性，却让模型更频繁地更新，并能利用硬件并行。不要把随机梯度理解为随便乱改参数：它来自抽样数据对全体梯度的估计。","chapter":45,"source":"chapters/45.md"},{"id":"chapter:46","type":"chapter","label":"第 46 讲 · 正则化与归一化：Dropout、BatchNorm、LayerNorm、RMSNorm","area":"training","note":"Chapters/第 46 讲 正则化与归一化：Dropout、BatchNorm、LayerNorm、RMSNorm.md","description":"容量描述模型能表达多复杂的关系。归纳偏置是模型或训练对哪些规律更容易学习的偏好，例如卷积假定局部模式可以重复出现。过拟合不是参数多的同义词，而是对训练数据中的特殊细节依赖过强，导致新数据效果差。增加数据、改进数据代表性、限制容量和采用正则化都是可能途径，但没有一种单独措施保证解决所有泛化问题。","chapter":46,"source":"chapters/46.md"},{"id":"chapter:47","type":"chapter","label":"第 47 讲 · 训练稳定性与显存词汇：NaN、梯度裁剪、混合精度、Checkpointing","area":"training","note":"Chapters/第 47 讲 训练稳定性与显存词汇：NaN、梯度裁剪、混合精度、Checkpointing.md","description":"初始化决定训练起点。所有神经元用完全相同权重可能无法打破对称；尺度太大或太小也可能让信息与梯度难以传播。Xavier 和 He 初始化是依据层结构及激活特性选择初始尺度的常见方法。它们帮助训练起步，不直接赋予模型知识。预训练模型的权重则已经来自学习，和随机初始化不是一回事。","chapter":47,"source":"chapters/47.md"},{"id":"chapter:48","type":"chapter","label":"第 48 讲 · 深度学习架构：CNN、RNN、Transformer 与视觉模型","area":"architectures","note":"Chapters/第 48 讲 深度学习架构：CNN、RNN、Transformer 与视觉模型.md","description":"不同神经网络架构，是对不同数据结构采取的不同设计偏好。CNN，Convolutional Neural Network，卷积神经网络，使用局部卷积核处理图像等网格结构数据。它利用局部模式复用的思想，在图像识别、目标检测和许多视觉任务中长期非常重要。ResNet，残差网络，通过残差连接使深层网络更容易训练。","chapter":48,"source":"chapters/48.md"},{"id":"chapter:49","type":"chapter","label":"第 49 讲 · 视觉网络细节：卷积、Pooling、ResNet、U-Net、YOLO、DETR","area":"architectures","note":"Chapters/第 49 讲 视觉网络细节：卷积、Pooling、ResNet、U-Net、YOLO、DETR.md","description":"卷积用一组可学习的小模板扫描局部区域，把同样的识别规则复用于图像不同位置。Kernel 在这里是卷积核，不是操作系统内核，也不是 SVM 的核函数。Channel 是特征通道，早期可能对应颜色，后面则对应学到的不同模式。卷积减少参数并利用局部结构，但并不自动让模型对任意旋转、尺度和位置变化都保持不变。","chapter":49,"source":"chapters/49.md"},{"id":"chapter:50","type":"chapter","label":"第 50 讲 · 序列与图网络：RNN、LSTM、GRU、GCN、GAT、Mamba","area":"architectures","note":"Chapters/第 50 讲 序列与图网络：RNN、LSTM、GRU、GCN、GAT、Mamba.md","description":"RNN 按序读取输入，用 hidden state，隐藏状态，压缩已经看到的历史，再结合下一个输入更新。它适合流式序列处理，但很长历史的信息可能被遗忘，训练也容易遇到梯度传播困难。隐藏状态不是对整个过去的无损存档。推理时通常可以持续更新状态，不必像普通全注意力那样保留所有过去位置的完整缓存。","chapter":50,"source":"chapters/50.md"},{"id":"chapter:51","type":"chapter","label":"第 51 讲 · 真实 AI 项目：数据、部署、监控与 MLOps","area":"architectures","note":"Chapters/第 51 讲 真实 AI 项目：数据、部署、监控与 MLOps.md","description":"MLOps，可以理解为机器学习领域的软件工程和运维。AI 项目不只是训练出一个模型，还包括长期稳定地收集数据、复现实验、部署模型、监控效果和更新版本。","chapter":51,"source":"chapters/51.md"},{"id":"chapter:52","type":"chapter","label":"第 52 讲 · LLM 入门：Token、Embedding、Transformer 与生成机制","area":"llm","note":"Chapters/第 52 讲 LLM 入门：Token、Embedding、Transformer 与生成机制.md","description":"LLM，是 Large Language Model，大语言模型。它通常先通过大规模数据训练，再根据上下文生成后续的 Token。Token 可以是一个字、一个词的一部分、一个词或其他符号，并不总等于一个完整单词。Tokenization，分词或标记化，把文字转换为模型可以处理的 Token 序列。BPE，Byte Pair Encoding，是常见 Tokenizer 设计思路之一，通过逐步合并频繁出现的符号片段建立词表。","chapter":52,"source":"chapters/52.md"},{"id":"chapter:53","type":"chapter","label":"第 53 讲 · Transformer 零件表：Token、BPE、位置编码、多头、GQA、MoE","area":"llm","note":"Chapters/第 53 讲 Transformer 零件表：Token、BPE、位置编码、多头、GQA、MoE.md","description":"Tokenizer 把文字转成 token 序列，vocabulary 是可用 token 的集合。BPE 逐步合并频繁的符号对，WordPiece 使用相关的子词建模思路，Unigram tokenizer 从候选子词集合及概率模型出发选择分词。Token 不固定等于汉字或单词，空格和符号也可能占 token。不同 tokenizer 下同一句话长度不同，因此不能把字符数直接当作上下文消耗。","chapter":53,"source":"chapters/53.md"},{"id":"chapter:54","type":"chapter","label":"第 54 讲 · LLM 是怎样训练成聊天助手的","area":"llm","note":"Chapters/第 54 讲 LLM 是怎样训练成聊天助手的.md","description":"现代 LLM 的训练可以粗分为 Pretraining，预训练，以及 Post Training，后训练。预训练主要建立广泛的语言和世界知识表征。后训练则改善指令遵循、回答格式、特定任务能力、工具使用和偏好对齐。","chapter":54,"source":"chapters/54.md"},{"id":"chapter:55","type":"chapter","label":"第 55 讲 · LLM 训练词汇：预训练、SFT、LoRA、QLoRA、Packing、蒸馏","area":"llm","note":"Chapters/第 55 讲 LLM 训练词汇：预训练、SFT、LoRA、QLoRA、Packing、蒸馏.md","description":"预训练从大规模数据学习一般规律。继续预训练在已有模型上继续使用类似目标，常用于增加领域数据。SFT 使用输入与期望回答的示范，塑造任务行为。它们都可能更新参数，但数据形式与目标重点不同。加入新文档不一定非得微调：需要经常更新且可引用的知识，还可通过检索提供。","chapter":55,"source":"chapters/55.md"},{"id":"chapter:56","type":"chapter","label":"第 56 讲 · 偏好与推理训练：RLHF、DPO、PPO、GRPO、KL 与 Reward","area":"llm","note":"Chapters/第 56 讲 偏好与推理训练：RLHF、DPO、PPO、GRPO、KL 与 Reward.md","description":"偏好对给出同一输入下两个候选，指出哪个更好。Reward model 根据这些信号学习评分。Reference model 提供一个行为基准，用于约束新模型不要改变得过头。它们不是同一个角色：评分器决定什么更好，参考模型决定偏离谁有代价。评分模型也可能有偏差，不能把高分直接当成真实正确。","chapter":56,"source":"chapters/56.md"},{"id":"chapter:57","type":"chapter","label":"第 57 讲 · LLM 推理：为什么有的模型又快又便宜","area":"llm","note":"Chapters/第 57 讲 LLM 推理：为什么有的模型又快又便宜.md","description":"Inference，推理，指模型训练结束后实际产生回答。Prompt Processing，也叫 Prefill，是模型先处理已提供的上下文。Decoding，解码，是模型继续生成新 Token。TTFT，Time To First Token，首个 Token 延迟，影响用户多久看到回复开始。Tokens Per Second，每秒 Token 数，影响回复生成速度。Throughput，吞吐量，衡量系统在一段时间内能够处理多少请求或 Token。","chapter":57,"source":"chapters/57.md"},{"id":"chapter:58","type":"chapter","label":"第 58 讲 · 推理加速算法：KV Cache、FlashAttention、量化、推测解码","area":"llm","note":"Chapters/第 58 讲 推理加速算法：KV Cache、FlashAttention、量化、推测解码.md","description":"Prefill 处理输入上下文，decode 逐步生成新 token。TTFT 衡量多久看到第一个 token，TPOT 衡量后续 token 的生成间隔。一次请求的总延迟还包含排队、工具调用与网络。某项优化提高整体吞吐，不一定降低每个用户的等待时间；选择优化前应知道实际瓶颈在哪里。","chapter":58,"source":"chapters/58.md"},{"id":"chapter:59","type":"chapter","label":"第 59 讲 · RAG、搜索、Agent 与工具调用","area":"retrieval-agents","note":"Chapters/第 59 讲 RAG、搜索、Agent 与工具调用.md","description":"RAG，Retrieval Augmented Generation，检索增强生成，是在生成回答前，先从外部文档或知识库检索相关信息，再将检索内容提供给 LLM。它主要解决模型参数无法及时更新、企业私有知识不在训练数据中、以及回答需要明确依据等问题。RAG 能减少某些知识性幻觉，但不能保证所有答案正确。","chapter":59,"source":"chapters/59.md"},{"id":"chapter:60","type":"chapter","label":"第 60 讲 · 检索算法细讲：BM25、HNSW、IVF、PQ、RRF、重排序","area":"retrieval-agents","note":"Chapters/第 60 讲 检索算法细讲：BM25、HNSW、IVF、PQ、RRF、重排序.md","description":"倒排索引从词指向包含该词的文档，避免搜索时逐篇扫描。TF-IDF 同时考虑词在文档中有多突出，以及它在整个文档集合中是否罕见。BM25 进一步用词频饱和与文档长度调整等设计评分。罕见产品编号和精确术语常适合关键词检索；改写很多、字面不同的表达则可能需要语义表示。BM25 不是一种生成式语言模型。","chapter":60,"source":"chapters/60.md"},{"id":"chapter:61","type":"chapter","label":"第 61 讲 · Agent 的小零件：工具调用、状态、规划、验证与错误恢复","area":"retrieval-agents","note":"Chapters/第 61 讲 Agent 的小零件：工具调用、状态、规划、验证与错误恢复.md","description":"工具调用让模型选择外部能力，并生成合适参数；真正执行由应用系统负责。Schema 规定字段类型和约束，结构化输出让应用更容易读取结果。JSON 格式正确，不保证参数对应真实对象或操作合理。模型提出删除文件的参数，也不意味着它自然获得删除权限，执行层仍应检查授权。","chapter":61,"source":"chapters/61.md"},{"id":"chapter:62","type":"chapter","label":"第 62 讲 · 生成式 AI、多模态、语音与视频模型","area":"multimodal","note":"Chapters/第 62 讲 生成式 AI、多模态、语音与视频模型.md","description":"Generative AI，生成式人工智能，不只有 LLM。生成模型还可以生成图像、语音、音乐、视频、三维结构甚至机器人动作。Generative Model，生成模型，试图学习数据分布并产生新的样本。","chapter":62,"source":"chapters/62.md"},{"id":"chapter:63","type":"chapter","label":"第 63 讲 · 生成算法家族：VAE、GAN、Normalizing Flow、Diffusion、Flow Matching","area":"multimodal","note":"Chapters/第 63 讲 生成算法家族：VAE、GAN、Normalizing Flow、Diffusion、Flow Matching.md","description":"判别模型重点区分或预测目标，生成模型重点学习如何描述、采样数据。二者不是只能二选一：一个系统可以先生成候选，再用判别器打分，也可以让生成目标帮助学习表示。生成新图片不是从数据库复制一张图片的定义，当然训练数据重复仍可能造成记忆与复现问题。","chapter":63,"source":"chapters/63.md"},{"id":"chapter:64","type":"chapter","label":"第 64 讲 · 多模态与表征：Word2Vec、CLIP、DINO、语音、视频、三维","area":"multimodal","note":"Chapters/第 64 讲 多模态与表征：Word2Vec、CLIP、DINO、语音、视频、三维.md","description":"Word2Vec 从词与上下文共现学习向量，GloVe 利用全局共现统计，FastText 加入子词信息，帮助处理词形和未见词。它们的典型词表示相对固定。上下文表示则让同一个词在不同句子中得到不同向量，如“苹果”是水果还是公司。向量靠近表示模型学到的某种相关性，不等于两个词完全同义。","chapter":64,"source":"chapters/64.md"},{"id":"chapter:65","type":"chapter","label":"第 65 讲 · 强化学习：Q-learning、PPO、Actor-Critic 与自我博弈","area":"rl","note":"Chapters/第 65 讲 强化学习：Q-learning、PPO、Actor-Critic 与自我博弈.md","description":"Reinforcement Learning，强化学习，研究如何在不断交互的环境中作决策，目标通常是让长期累计回报尽可能好。Agent 是行动者，Environment 是环境，State 是环境状态，Observation 是实际能够看到的信息，Action 是可执行动作，Reward 是奖励，Policy 是决定采取哪个动作的策略。","chapter":65,"source":"chapters/65.md"},{"id":"chapter:66","type":"chapter","label":"第 66 讲 · 强化学习之一：价值、TD、Q-learning、SARSA、DQN","area":"rl","note":"Chapters/第 66 讲 强化学习之一：价值、TD、Q-learning、SARSA、DQN.md","description":"State 是环境完整状态，observation 是智能体实际看到的信息。机器人摄像头看不到被遮住的物体，因此二者往往不同。Action 是可采取的动作。Episode 是一段从开始到终止的交互，如一局游戏，不是训练数据完整遍历一遍的 epoch。Trajectory 或 rollout 是这段状态、动作、奖励的记录，也可以是一段未结束的轨迹。","chapter":66,"source":"chapters/66.md"},{"id":"chapter:67","type":"chapter","label":"第 67 讲 · 强化学习之二：Bandit、PPO、SAC、TD3、离线 RL","area":"rl","note":"Chapters/第 67 讲 强化学习之二：Bandit、PPO、SAC、TD3、离线 RL.md","description":"多臂老虎机研究反复选择不同选项，平衡探索未知与利用已知收益，通常不包含一般强化学习那样复杂的状态转移。Epsilon-greedy 大部分时间选当前最好，少部分随机探索。UCB 给不确定选项额外探索价值。Thompson sampling 从当前不确定性分布中抽一种可能情况，再按它行动。广告和实验分配中会用到相关思想，contextual bandit 再加入当前用户或场景信息。","chapter":67,"source":"chapters/67.md"},{"id":"chapter:68","type":"chapter","label":"第 68 讲 · 模仿与多智能体：BC、DAgger、GAIL、Self-Play、MAPPO","area":"rl","note":"Chapters/第 68 讲 模仿与多智能体：BC、DAgger、GAIL、Self-Play、MAPPO.md","description":"行为克隆把专家看到的观察与专家动作当作监督数据，学习在类似情形下模仿。它起步直接，不必从零探索奖励。问题是策略出现一个小失误后，可能进入专家示范没覆盖的状态，随后越错越远。这叫分布偏移或累积误差，不是增加一点训练准确率就一定能解决。","chapter":68,"source":"chapters/68.md"},{"id":"chapter:69","type":"chapter","label":"第 69 讲 · VLA 与具身智能：让模型从理解走向行动","area":"embodied","note":"Chapters/第 69 讲 VLA 与具身智能：让模型从理解走向行动.md","description":"Embodied AI，具身智能，研究具有身体或行动接口的智能体怎样感知环境、决策并采取动作。Robot Learning，机器人学习，用数据驱动的方法获得控制能力。VLA，Vision Language Action，视觉语言动作模型，是近年重要的研究方向之一。它的典型输入是摄像头观察、语言任务以及可能存在的机器人内部状态，输出是某种可执行的动作表示。","chapter":69,"source":"chapters/69.md"},{"id":"chapter:70","type":"chapter","label":"第 70 讲 · 机器人基础算法：SLAM、ICP、RRT、PID、MPC、CEM","area":"embodied","note":"Chapters/第 70 讲 机器人基础算法：SLAM、ICP、RRT、PID、MPC、CEM.md","description":"Pose 表示位置与朝向，coordinate frame 是描述它们的坐标系。机器人相机、机械臂底座、夹爪各有坐标系，必须正确转换。正运动学从关节状态计算末端位置，逆运动学从目标末端姿态求可能的关节配置。逆解可能不唯一或根本不存在，还要考虑关节限位与碰撞，不是把坐标直接抄到电机上。","chapter":70,"source":"chapters/70.md"},{"id":"chapter:71","type":"chapter","label":"第 71 讲 · VLA 算法路线：RT-2、OpenVLA、ACT、Diffusion Policy、Pi Zero","area":"embodied","note":"Chapters/第 71 讲 VLA 算法路线：RT-2、OpenVLA、ACT、Diffusion Policy、Pi Zero.md","description":"VLM 可以看图理解“拿起红色杯子”的意思，VLA 进一步输出某种动作表示。常见输入还有机器人本体状态，例如关节位置。动作可能是末端位移、关节目标或速度，并不必然直接输出电机电流。把图像说对、把语言理解对、把杯子真正拿起来，是三个不同的评价环节。","chapter":71,"source":"chapters/71.md"},{"id":"chapter:72","type":"chapter","label":"第 72 讲 · World Model：世界模型与可预测的环境","area":"embodied","note":"Chapters/第 72 讲 World Model：世界模型与可预测的环境.md","description":"World Model，世界模型，核心思想是学习一个环境模型，描述环境处于什么状态，以及行动之后环境可能怎样变化。它不一定真的生成高清图像，也不一定是一个自然语言模型。世界模型可以学习像素层面的未来画面，也可以只预测压缩后的内部状态或表征。","chapter":72,"source":"chapters/72.md"},{"id":"chapter:73","type":"chapter","label":"第 73 讲 · 世界模型路线：RSSM、Dreamer、MuZero、TD-MPC、JEPA、Genie","area":"embodied","note":"Chapters/第 73 讲 世界模型路线：RSSM、Dreamer、MuZero、TD-MPC、JEPA、Genie.md","description":"世界模型可能包含将观察编码成内部状态的表示模型、预测状态如何随动作变化的动力学模型，以及预测奖励等任务信息的组件。并非每条路线都重建高清画面。对控制有用的模型，应保留与后果和决策有关的信息，而不只是产生视觉上漂亮的结果。模型是否预测奖励与是否预测图像是两个独立设计选择。","chapter":73,"source":"chapters/73.md"},{"id":"chapter:74","type":"chapter","label":"第 74 讲 · 面试问答演练：算法、数据库、网络与工程","area":"practice","note":"Chapters/第 74 讲 面试问答演练：算法、数据库、网络与工程.md","description":"这一讲开始模拟面试。每听到一个问题，可以先暂停几秒，尝试自己回答。参考回答不追求面面俱到，而是用最短时间表达基本机制、使用场景与局限。","chapter":74,"source":"chapters/74.md"},{"id":"chapter:75","type":"chapter","label":"第 75 讲 · 面试问答演练：ML、DL 与 LLM","area":"practice","note":"Chapters/第 75 讲 面试问答演练：ML、DL 与 LLM.md","description":"【答题停顿】参考回答：监督学习根据标签预测结果，包括分类和回归。无监督学习寻找数据结构，例如聚类和降维。自监督学习从数据本身构造训练任务。强化学习通过与环境交互优化长期奖励。","chapter":75,"source":"chapters/75.md"},{"id":"chapter:76","type":"chapter","label":"第 76 讲 · 面试问答演练：Agent、强化学习、VLA 与 World Model","area":"practice","note":"Chapters/第 76 讲 面试问答演练：Agent、强化学习、VLA 与 World Model.md","description":"【答题停顿】参考回答：Agent 是能够围绕目标进行多步决策并使用工具执行行动的 AI 系统。LLM 可以为它提供语言和推理能力，但 Agent 还包含工具、状态管理、控制流程与错误恢复机制。","chapter":76,"source":"chapters/76.md"},{"id":"chapter:77","type":"chapter","label":"第 77 讲 · 训练微知识点：二十道口述追问","area":"practice","note":"Chapters/第 77 讲 训练微知识点：二十道口述追问.md","description":"每道题先尝试自己回答，再听参考回答。这里考的是概念与边界，不要求背公式或实现。","chapter":77,"source":"chapters/77.md"},{"id":"chapter:78","type":"chapter","label":"第 78 讲 · 算法比较与现代 AI：二十道口述追问","area":"practice","note":"Chapters/第 78 讲 算法比较与现代 AI：二十道口述追问.md","description":"每道题先尝试自己回答，再听参考回答。这里考的是概念与边界，不要求背公式或实现。","chapter":78,"source":"chapters/78.md"},{"id":"chapter:79","type":"chapter","label":"第 79 讲 · 高频快速复习：只记最核心的区别","area":"practice","note":"Chapters/第 79 讲 高频快速复习：只记最核心的区别.md","description":"现在进入快速复习。我们不追求技术细节，而是复述每个概念的核心区分。","chapter":79,"source":"chapters/79.md"},{"id":"chapter:80","type":"chapter","label":"第 80 讲 · 如何诚实回答“你对机器学习掌握多少”","area":"practice","note":"Chapters/第 80 讲 如何诚实回答“你对机器学习掌握多少”.md","description":"这是一个很重要的问题，因为面试官不仅评估知识，也在评估你对自己能力边界的认识。不要仅仅因为听过很多算法名称，就声称自己精通所有机器学习方法。也不要因为没有系统上过计算机科学专业课程，就完全低估自己的数学和建模能力。","chapter":80,"source":"chapters/80.md"},{"id":"chapter:81","type":"chapter","label":"第 81 讲 · Hot 100 · 哈希：把反复查找变成状态查询","area":"hot100","note":"Chapters/第 81 讲 Hot 100 · 哈希：把反复查找变成状态查询.md","description":"本讲对应 Hot 100 官方“哈希”分组，共 3 题。先理解状态与不变式，再用题目检查自己能否解释移动、转移或剪枝为什么成立。题单核对日期：2026-10-16。","chapter":81,"source":"chapters/81.md"},{"id":"chapter:82","type":"chapter","label":"第 82 讲 · Hot 100 · 双指针：一次移动排除哪些候选","area":"hot100","note":"Chapters/第 82 讲 Hot 100 · 双指针：一次移动排除哪些候选.md","description":"本讲对应 Hot 100 官方“双指针”分组，共 4 题。先理解状态与不变式，再用题目检查自己能否解释移动、转移或剪枝为什么成立。题单核对日期：2026-10-16。","chapter":82,"source":"chapters/82.md"},{"id":"chapter:83","type":"chapter","label":"第 83 讲 · Hot 100 · 滑动窗口：维护一个可解释的连续区间","area":"hot100","note":"Chapters/第 83 讲 Hot 100 · 滑动窗口：维护一个可解释的连续区间.md","description":"本讲对应 Hot 100 官方“滑动窗口”分组，共 2 题。先理解状态与不变式，再用题目检查自己能否解释移动、转移或剪枝为什么成立。题单核对日期：2026-10-16。","chapter":83,"source":"chapters/83.md"},{"id":"chapter:84","type":"chapter","label":"第 84 讲 · Hot 100 · 连续区间：前缀和、单调队列与最小覆盖","area":"hot100","note":"Chapters/第 84 讲 Hot 100 · 连续区间：前缀和、单调队列与最小覆盖.md","description":"本讲对应 Hot 100 官方“子串”分组，共 3 题。先理解状态与不变式，再用题目检查自己能否解释移动、转移或剪枝为什么成立。题单核对日期：2026-10-16。","chapter":84,"source":"chapters/84.md"},{"id":"chapter:85","type":"chapter","label":"第 85 讲 · Hot 100 · 数组：局部最优、区间合并与原地编码","area":"hot100","note":"Chapters/第 85 讲 Hot 100 · 数组：局部最优、区间合并与原地编码.md","description":"本讲对应 Hot 100 官方“普通数组”分组，共 5 题。先理解状态与不变式，再用题目检查自己能否解释移动、转移或剪枝为什么成立。题单核对日期：2026-10-16。","chapter":85,"source":"chapters/85.md"},{"id":"chapter:86","type":"chapter","label":"第 86 讲 · Hot 100 · 矩阵：标记、边界与有序性","area":"hot100","note":"Chapters/第 86 讲 Hot 100 · 矩阵：标记、边界与有序性.md","description":"本讲对应 Hot 100 官方“矩阵”分组，共 4 题。先理解状态与不变式，再用题目检查自己能否解释移动、转移或剪枝为什么成立。题单核对日期：2026-10-16。","chapter":86,"source":"chapters/86.md"},{"id":"chapter:87","type":"chapter","label":"第 87 讲 · Hot 100 · 链表：连接关系、指针距离与组合数据结构","area":"hot100","note":"Chapters/第 87 讲 Hot 100 · 链表：连接关系、指针距离与组合数据结构.md","description":"本讲对应 Hot 100 官方“链表”分组，共 14 题。先理解状态与不变式，再用题目检查自己能否解释移动、转移或剪枝为什么成立。题单核对日期：2026-10-16。","chapter":87,"source":"chapters/87.md"},{"id":"chapter:88","type":"chapter","label":"第 88 讲 · Hot 100 · 二叉树：返回给父节点什么，在哪里更新答案","area":"hot100","note":"Chapters/第 88 讲 Hot 100 · 二叉树：返回给父节点什么，在哪里更新答案.md","description":"本讲对应 Hot 100 官方“二叉树”分组，共 15 题。先理解状态与不变式，再用题目检查自己能否解释移动、转移或剪枝为什么成立。题单核对日期：2026-10-16。","chapter":88,"source":"chapters/
