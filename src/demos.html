<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS 与 AI · 例子与交互演示</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f8f7f3,#171b20);--fg:light-dark(#192b32,#e6ebed);--muted:light-dark(#52646d,#a9b9c1);--line:light-dark(#d4ddde,#3b4a52);--panel:light-dark(#fff,#20272e);--accent:light-dark(#086c72,#7dd6d3);--soft:light-dark(#e3f2f0,#183d42);--series:light-dark(#086c72,#7dd6d3);--second:light-dark(#a35413,#ffc38d);font-family:system-ui,"Microsoft Yahei",sans-serif;background:var(--bg);color:var(--fg);font-size:16px;line-height:1.65}
*{box-sizing:border-box}body{margin:0}a{color:var(--accent);text-underline-offset:3px}header,main,footer{max-width:1120px;margin:auto;padding:24px}header{padding-bottom:12px}header small{letter-spacing:.12em;color:var(--muted)}h1{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.2;margin:12px 0}h2{font-size:1.25rem;margin:0 0 14px}h3{font-size:1.05rem}p{margin:10px 0}header p,footer{color:var(--muted)}nav{display:flex;gap:16px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:30px}.controls{border-top:2px solid var(--accent);padding-top:18px}label{display:block;font-weight:600;margin:0 0 7px}select,input{font:inherit;color:inherit}select{display:block;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-bottom:18px}input[type=range]{width:100%;accent-color:var(--accent)}output{font-variant-numeric:tabular-nums}.step-controls{display:flex;align-items:center;gap:10px;margin:20px 0}button{font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:8px 12px;cursor:pointer}button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--second);outline-offset:3px}.counter{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}.stage{min-width:0}.canvas{padding:22px 0;min-height:190px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.message{min-height:3.3em}.metrics{margin:16px 0}.metrics div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:7px 0}.metrics dt{color:var(--muted)}.metrics dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.cells{display:flex;flex-wrap:wrap;gap:8px}.cell{min-width:50px;text-align:center}.cell b{display:block;padding:10px 12px;border-radius:4px;background:var(--panel);border:1px solid var(--line);font-weight:500;min-height:48px}.cell.active b{background:var(--soft);border-color:var(--accent)}.cell small{display:block;color:var(--muted)}.bars{display:grid;gap:14px}.barrow{display:grid;grid-template-columns:90px minmax(0,1fr) 75px;align-items:center;gap:12px}.track{background:var(--line);height:20px}.fill{height:100%;background:var(--series);opacity:.45}.fill.active{opacity:1}.value{text-align:right;font-variant-numeric:tabular-nums}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{text-align:left;border-bottom:1px solid var(--line);padding:8px 10px}th{font-weight:600}svg{display:block;width:100%;height:auto}svg text{fill:var(--fg);font:13px system-ui,sans-serif}svg .axis{stroke:var(--line);fill:none;stroke-width:1}svg .curve{stroke:var(--series);fill:none;stroke-width:2}svg .reference{stroke:var(--second);stroke-dasharray:5 4;fill:none}.matrices{display:flex;flex-wrap:wrap;gap:24px}.matrix td{text-align:center;min-width:42px;border:1px solid var(--line)}.matrix td.active{background:var(--soft);font-weight:600}.explanation{margin-top:30px;border-top:1px solid var(--line);padding-top:18px}.explanation li{margin-bottom:10px}.explanation details{padding:12px 0}.explanation summary{cursor:pointer;color:var(--accent)}.related{margin-top:20px;display:flex;flex-wrap:wrap;gap:14px}.all-examples{margin-top:36px;border-top:1px solid var(--line);padding-top:20px}.all-examples ul{columns:2;column-gap:32px;padding-left:22px}.all-examples li{break-inside:avoid;margin-bottom:8px}.anchor{display:none}.hint{color:var(--muted);font-size:.9rem}#empty{display:none}noscript{display:block;padding:24px}
@media(max-width:760px){header,main,footer{padding:18px}.layout{grid-template-columns:1fr;gap:16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.parameter{grid-column:1/-1}.canvas{padding:14px 0}.all-examples ul{columns:1}.barrow{grid-template-columns:70px minmax(0,1fr) 64px;gap:8px}}@media(prefers-reduced-motion:no-preference){.fill{transition:width .18s ease}}
</style></head><body>
<header><small>DICTIONARY OF COMPUTER SCIENCE AND AI</small><h1>把概念算一遍，再改变条件</h1><p>30 个完整案例 · 20 个交互演示 · 无外部依赖，可离线打开</p><nav><a href="EXAMPLES.md">案例集</a><a href="KNOWLEDGE_MAP.md">知识地图</a><a href="../cs_ai_v2_audiobook.html">听讲稿</a></nav></header>
<noscript>交互演示需要启用 JavaScript；完整手算过程也可阅读 EXAMPLES.md。</noscript>
<main><div id="anchors">__DEMO_ANCHORS__</div><div class="layout"><aside class="controls">
<div><label for="demo-select">选择演示</label><select id="demo-select"></select></div>
<div><label for="scenario-select">输入／对照场景</label><select id="scenario-select"></select></div>
<div class="parameter" id="parameter"><label for="parameter-range"><span id="parameter-label"></span>：<output id="parameter-value"></output></label><input id="parameter-range" type="range"></div>
</aside><section class="stage" aria-labelledby="demo-title"><h2 id="demo-title"></h2><p id="scenario"></p>
<div class="step-controls"><button id="previous" type="button">上一步</button><button id="next" class="primary" type="button">下一步</button><span id="counter" class="counter"></span></div>
<p id="message" class="message" aria-live="polite"></p><div id="canvas" class="canvas"></div><dl id="demo-metrics" class="metrics"></dl>
<div class="explanation"><h3>手算与解释</h3><ol id="worked"></ol><p id="result"></p><p id="pitfall"></p><details><summary id="question"></summary><p id="answer"></p></details><div id="related" class="related"></div></div>
</section></div><section class="all-examples"><h2>全部 30 个案例</h2><p class="hint">前 20 个附交互演示；其余案例在案例集及对应章节中提供手算与自测。</p><ul id="all-examples"></ul></section></main>
<footer>演示使用简化输入。计算规则、适用条件与易错点见对应案例；原章节编号和 90 道口述题保持稳定。</footer>
<script id="exampleData" type="application/json">__EXAMPLE_DATA__</script>
<script>
(()=>{'use strict';
__DEMO_ENGINES__
const examples=JSON.parse(document.getElementById('exampleData').textContent);
const $=id=>document.getElementById(id),select=$('demo-select'),scenario=$('scenario-select'),range=$('parameter-range'),canvas=$('canvas');
let current=demos[0],trace,step=0;
const svgNS='http://www.w3.org/2000/svg';
function el(tag,text,attrs={}){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;for(const[k,v]of Object.entries(attrs))node.setAttribute(k,v);return node}
function svgEl(tag,attrs={},text){const node=document.createElementNS(svgNS,tag);for(const[k,v]of Object.entries(attrs))node.setAttribute(k,v);if(text!==undefined)node.textContent=text;return node}
function svgBase(height,label){const w=Math.max(280,Math.floor(canvas.clientWidth));const s=svgEl('svg',{viewBox:`0 0 ${w} ${height}`,role:'img','aria-label':label});canvas.append(s);return {s,w}}
function cells(values,active=[],labels=[]){const box=el('div',undefined,{class:'cells'});values.forEach((v,i)=>{const c=el('div',undefined,{class:'cell'+(active.includes(i)?' active':'')});c.append(el('b',v),el('small',labels[i]??`[${i}]`));box.append(c)});return box}
function renderTable(headers,rows){const wrap=el('div',undefined,{class:'scroll'}),t=el('table'),head=el('thead'),tr=el('tr');for(const h of headers)tr.append(el('th',h,{scope:'col'}));head.append(tr);t.append(head);const body=el('tbody');for(const row of rows){const r=el('tr');for(const v of row)r.append(el('td',v));body.append(r)}t.append(body);wrap.append(t);return wrap}
function plot(v){const {s,w}=svgBase(290,v.kind==='series'?`${v.yLabel} 随 ${v.xLabel} 变化`:'二维样本与聚类中心');const left=68,right=w-20,top=22,bottom=232;
 const points=v.kind==='series'?v.values.map((y,x)=>[x,y]):[...v.points,...v.centers];
 const xs=points.map(q=>q[0]),ys=points.map(q=>q[1]);if(v.reference!==undefined)ys.push(v.reference);
 function domain(a){const lo=Math.min(...a),hi=Math.max(...a),pad=(hi-lo||Math.abs(hi)||1)*.12;return [lo-pad,hi+pad]}
 const [xmin,xmax]=v.kind==='series'?[0,Math.max(1,...xs)]:domain(xs),[ymin,ymax]=domain(ys),x=a=>left+6+(a-xmin)/(xmax-xmin)*(right-left-12),y=a=>bottom-(a-ymin)/(ymax-ymin)*(bottom-top);
 s.append(svgEl('rect',{x:left,y:top,width:right-left,height:bottom-top,class:'axis'}));
 const tick=n=>Math.abs(n)>=1000?n.toExponential(1):Number(n.toPrecision(3));const xticks=v.kind==='series'?[...new Set([0,Math.round(xmax/3),Math.round(2*xmax/3),xmax])]:Array.from({length:4},(_,i)=>xmin+(xmax-xmin)*i/3);xticks.forEach((n,i)=>s.append(svgEl('text',{x:x(n),y:bottom+20,'text-anchor':i===0?'start':i===xticks.length-1?'end':'middle'},tick(n))));for(let i=0;i<4;i++){const n=ymin+(ymax-ymin)*i/3;s.append(svgEl('text',{x:left-8,y:y(n)+4,'text-anchor':'end'},tick(n)))}
 s.append(svgEl('text',{x:(left+right)/2,y:282,'text-anchor':'middle',class:'axis-title','data-axis':'x'},v.xLabel),svgEl('text',{x:left,y:14,class:'axis-title','data-axis':'y'},v.yLabel));
 if(v.reference!==undefined){s.append(svgEl('path',{d:`M${left},${y(v.reference)}H${right}`,class:'reference'}),svgEl('text',{x:right-4,y:y(v.reference)-7,'text-anchor':'end'},'目标 '+v.reference))}
 if(v.kind==='series'){s.append(svgEl('path',{d:points.map((q,i)=>`${i?'L':'M'}${x(q[0])},${y(q[1])}`).join(' '),class:'curve'}));for(const q of points)s.append(svgEl('circle',{cx:x(q[0]),cy:y(q[1]),r:3,fill:'var(--series)'}))}
 else{v.points.forEach((q,i)=>{s.append(svgEl('circle',{cx:x(q[0]),cy:y(q[1]),r:6,fill:v.assignment[i]?'var(--second)':'var(--series)'}));s.append(svgEl('text',{x:x(q[0])+8,y:y(q[1])-8},'簇 '+(v.assignment[i]+1)))});v.centers.forEach((q,i)=>s.append(svgEl('text',{x:x(q[0]),y:y(q[1])+6,'text-anchor':'middle',fill:i?'var(--second)':'var(--series)'},'✚')))}
}
function renderView(v){canvas.replaceChildren();
 if(v.kind==='array'){canvas.append(cells(v.values,v.active,v.labels));return}
 if(v.kind==='table'){canvas.append(renderTable(v.headers,v.rows));return}
 if(v.kind==='bars'){const box=el('div',undefined,{class:'bars'}),max=v.max??Math.max(...v.values,1e-10);v.values.forEach((n,i)=>{const r=el('div',undefined,{class:'barrow'}),track=el('div',undefined,{class:'track'}),fill=el('div',undefined,{class:'fill'+(v.active?.includes(i)?' active':'')});fill.style.width=`${100*n/max}%`;track.append(fill);r.append(el('span',v.labels?.[i]??i),track,el('span',fmt(n),{class:'value'}));box.append(r)});canvas.append(box);return}
 if(v.kind==='graph'){const {s,w}=svgBase(290,'有向图；节点标注当前距离或入度'),pos={A:[.12,65],B:[.12,190],C:[.46,65],D:[.70,140],E:[.9,65],F:[.88,235]};
 for(const[a,b]of v.edges){const ax=pos[a][0]*w,ay=pos[a][1],bx=pos[b][0]*w,by=pos[b][1],dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len,ex=bx-ux*26,ey=by-uy*26;s.append(svgEl('path',{d:`M${ax+ux*26},${ay+uy*26}L${ex},${ey}`,class:'axis'}),svgEl('path',{d:`M${ex-ux*8-uy*4},${ey-uy*8+ux*4}L${ex},${ey}L${ex-ux*8+uy*4},${ey-uy*8-ux*4}`,stroke:'var(--muted)',fill:'none'}))}
 for(const n of v.nodes){const [a,b]=pos[n];s.append(svgEl('circle',{cx:a*w,cy:b,r:24,fill:v.active.includes(n)?'var(--soft)':'var(--panel)',stroke:'var(--line)'}),svgEl('text',{x:a*w,y:b+4,'text-anchor':'middle'},n));s.append(svgEl('text',{x:a*w,y:b+43,'text-anchor':'middle'},v.labels[n]===undefined?'—':v.labels[n]))}return}
 if(v.kind==='series'||v.kind==='scatter'){plot(v);if(v.kind==='scatter')canvas.append(el('p','● 样本（簇编号见标签）　✚ 中心',{class:'hint'}));return}
 if(v.kind==='matrix'){const wrap=el('div',undefined,{class:'matrices'});for(const [label,rows,type]of [['输入',v.input,'input'],['核',v.kernel,'kernel'],['输出',v.output,'output']]){const box=el('div'),t=el('table',undefined,{class:'matrix'});box.append(el('h3',label));rows.forEach((row,r)=>{const tr=el('tr');row.forEach((n,c)=>{const active=type==='input'?r>=v.row&&r<v.row+2&&c>=v.col&&c<v.col+2:type==='output'&&r===v.row&&c===v.col;tr.append(el('td',n??'·',{class:active?'active':''}))});t.append(tr)});box.append(t);wrap.append(box)}canvas.append(wrap)}
}
function draw(){step=Math.max(0,Math.min(trace.frames.length-1,step));const f=trace.frames[step];$('message').textContent=f.message;$('counter').textContent=`${step+1} / ${trace.frames.length}`;$('previous').disabled=step===0;$('next').disabled=step===trace.frames.length-1;renderView(f.view);$('demo-metrics').replaceChildren();for(const [k,v]of f.rows){const row=el('div');row.append(el('dt',k),el('dd',v));$('demo-metrics').append(row)}}
function calculate(){trace=runDemo(current.id,Number(scenario.value),Number(range.value));step=0;$('parameter-value').textContent=trace.value;draw()}
function choose(id){current=demos.find(d=>d.id===id)||demos[0];select.value=current.id;scenario.replaceChildren(...current.variants.map((v,i)=>el('option',v,{value:i})));$('parameter').hidden=!current.control;if(current.control){for(const key of ['min','max','step'])range[key]=current.control[key];range.value=current.control.value;$('parameter-label').textContent=current.control.label}
 const x=examples.find(x=>x.id===current.example);$('demo-title').textContent=x.title;$('scenario').textContent=x.scenario;$('worked').replaceChildren(...x.steps.map(s=>el('li',s)));$('result').textContent='结果：'+x.result;$('pitfall').textContent='易错点：'+x.pitfall;$('question').textContent='自测：'+x.question;$('answer').textContent=x.answer;$('related').replaceChildren();for(const num of x.chapters)$('related').append(el('a',`阅读第 ${num} 讲`,{href:`../chapters/${String(num).padStart(2,'0')}.md`}));$('related').append(el('a','阅读案例集',{href:`EXAMPLES.md#example-${x.id}`}));calculate()}
select.append(...demos.map(d=>el('option',d.name,{value:d.id})));
for(const x of examples){const li=el('li'),a=el('a',`${String(x.number).padStart(2,'0')} · ${x.title}`,{href:x.demo?'#'+x.demo:`EXAMPLES.md#example-${x.id}`});li.append(a);$('all-examples').append(li)}
select.addEventListener('change',()=>{location.hash=select.value});scenario.addEventListener('change',calculate);range.addEventListener('input',calculate);$('previous').addEventListener('click',()=>{step--;draw()});$('next').addEventListener('click',()=>{step++;draw()});window.addEventListener('hashchange',()=>choose(location.hash.slice(1)));new ResizeObserver(()=>{if(trace)renderView(trace.frames[step].view)}).observe(canvas);choose(location.hash.slice(1));
})();
</script></body></html>
