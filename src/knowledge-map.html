<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS 与 AI · 知识地图</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f7f8fa,#15191c);--paper:light-dark(#fff,#1d2327);--ink:light-dark(#202b30,#e3e9eb);--muted:light-dark(#5c6a72,#a7b5bc);--line:light-dark(#d9e0e5,#38454d);--accent:light-dark(#236557,#83c7b3);--soft:light-dark(#e9f2ef,#263e37);--relation:light-dark(#47718b,#91bfd9)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}a{color:var(--accent);text-underline-offset:3px}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button,input,select{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px}button:hover{background:var(--soft)}button[aria-pressed=true]{background:var(--accent);color:var(--paper)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--relation);outline-offset:3px}header{max-width:1480px;margin:auto;padding:28px 28px 14px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent)}h1{font-weight:600;font-size:29px;margin:5px 0}header p{color:var(--muted);margin:0}main{max-width:1480px;margin:auto;padding:0 28px 32px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}.controls label{display:flex;gap:7px;align-items:center;white-space:nowrap}.search{flex:1;min-width:220px}.search input{width:auto;min-width:0;flex:1}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:22px}.graph-shell{min-width:0}.graph-shell svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.legend{color:var(--muted);font-size:13px;margin:10px 0;display:flex;gap:16px;flex-wrap:wrap}.key{display:inline-flex;align-items:center;gap:6px}.key:before{content:"";display:inline-block;width:23px;height:2px;background:var(--line)}.key.concept:before{background:var(--relation)}.key.prerequisite:before{background:var(--accent)}.detail{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;min-width:0}.detail h2{font-size:23px;font-weight:600;margin:0 0 6px;overflow-wrap:anywhere}.detail h3{font-size:15px;margin:22px 0 8px}.detail p{margin:8px 0}.meta{font-size:12px;color:var(--muted)}.list{display:flex;flex-wrap:wrap;gap:7px}.list button{font-size:13px;text-align:left;padding:5px 9px}.relations{padding-left:20px}.relations li{margin:8px 0}.relations button{border:0;background:none;padding:0;color:var(--accent);text-align:left;border-radius:0}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:7px;margin:0 0 16px}.results button{text-align:left}.results:empty{display:none}.graph-node rect{fill:var(--paper);stroke:var(--line)}.graph-node text{fill:var(--ink);font:13px system-ui,sans-serif}.graph-node.area rect{fill:var(--soft)}.graph-node.active rect{stroke:var(--accent);stroke-width:2}.graph-node:hover rect{stroke:var(--relation)}.edge{stroke:var(--line);stroke-width:1.3;fill:none}.edge.semantic{stroke:var(--relation)}.edge.prerequisite{stroke:var(--accent);stroke-width:1.8}.layer-label{fill:var(--muted);font:12px system-ui,sans-serif}.graph-caption{font-size:12px;color:var(--muted);margin:7px 0}.backlinks{font-size:13px}.empty{color:var(--muted)}footer{max-width:1480px;padding:0 28px 24px;margin:auto;color:var(--muted);font-size:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}header{padding:20px 16px 8px}main{padding:0 16px 24px}footer{padding:0 16px 20px}.detail{padding:18px}.controls label{flex-wrap:wrap}h1{font-size:25px}}@media(prefers-reduced-motion:no-preference){.graph-node rect{transition:stroke .16s}}
</style>
</head>
<body>
<header><div class="eyebrow">DICTIONARY OF COMPUTER SCIENCE AND AI</div><h1>知识地图</h1><p id="counts"></p></header>
<main>
<div class="controls"><button id="overview">整体结构</button><label class="search">查找<input id="search" type="search" placeholder="例如：BCE、前缀和、LC 560" autocomplete="off"></label><label>关系<select id="relation"><option value="all">全部关系</option><option value="prerequisite">推荐先修</option><option value="contrast">概念对照</option><option value="practice">练习连接</option></select></label></div>
<div id="results" class="results" aria-live="polite"></div>
<div class="layout"><section class="graph-shell" aria-label="关系图"><svg id="graph" role="group" aria-label="知识领域与局部关系图"></svg><div class="legend"><span class="key">目录与章节</span><span class="key concept">关联、应用与对照</span><span class="key prerequisite">推荐先修</span></div><p class="graph-caption" id="caption"></p></section><article class="detail" id="detail" aria-live="polite"></article></div>
</main>
<footer>节点和关系来自同一份笔记源。推荐先修表示理解顺序；其他连接请读具体说明。<a href="KNOWLEDGE_MAP.md">文字地图</a> · <a href="../obsidian-vault/00-知识地图.md">Obsidian 入口</a> · <a href="https://github.com/DengZhiyuan-math/dictionary-of-computer-science-and-AI/releases/latest">下载笔记库</a></footer>
<script id="graphData" type="application/json">__KNOWLEDGE_GRAPH__</script>
<script>
(()=>{'use strict';
const graph=JSON.parse(document.getElementById('graphData').textContent),byId=new Map(graph.nodes.map(n=>[n.id,n])),ns='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id),svg=$('graph'),detail=$('detail'),repo='https://github.com/DengZhiyuan-math/dictionary-of-computer-science-and-AI/blob/main/';
let selected='home';try{const id=decodeURIComponent(location.hash.slice(1));if(byId.has(id))selected=id}catch(e){}
const names={area:'领域',concept:'概念',chapter:'章节',problem:'练习',route:'路线',home:'总览'};
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const se=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);return e};
const short=n=>n.type==='chapter'?`第 ${String(n.chapter).padStart(2,'0')} 讲`:n.type==='problem'?`LC ${n.problem}`:n.label;
function choose(id){if(!byId.has(id))return;selected=id;$('search').value='';$('results').replaceChildren();try{history.replaceState(null,'','#'+encodeURIComponent(id))}catch(e){}render()}
function btn(id,label){const b=el('button',label||byId.get(id).label);b.type='button';b.onclick=()=>choose(id);return b}
function heading(text){detail.append(el('h3',text))}
function nodeLink(id){const n=byId.get(id);const a=el('a',n.type==='chapter'?'阅读完整章节':n.type==='problem'?'阅读对应讲解':'阅读相关章节');const source=n.source||(n.chapters?.length?`chapters/${String(n.chapters[0]).padStart(2,'0')}.md`:null);if(!source)return;a.href=repo+source;a.target='_blank';a.rel='noopener noreferrer';detail.append(a)}
function filterEdge(e){const f=$('relation').value;return f==='all'||e.type===f}
function renderDetail(n){detail.replaceChildren();detail.append(el('div',names[n.type]+(n.layer?' · '+n.layer:''),'meta'),el('h2',n.label),el('p',n.description));if(n.en)detail.append(el('p',n.en,'meta'));if(n.boundary){heading('边界与易混点');detail.append(el('p',n.boundary))}
 if(n.id==='home'){heading('阅读方式');detail.append(el('p','点击领域查看概念与章节；点击概念查看先修、应用、对照和练习。查找可定位全部笔记。'));heading('专题路线');const list=el('div',undefined,'list');for(const r of graph.nodes.filter(n=>n.type==='route'))list.append(btn(r.id));detail.append(list);return}
 const parent=n.area?byId.get('area:'+n.area):null;if(parent&&n.type!=='area'){const list=el('div',undefined,'list');list.append(btn(parent.id,'返回领域 · '+parent.label));detail.append(list)}
 if(n.type==='area'){for(const [type,label] of [['concept','核心概念'],['chapter','章节原文']]){heading(label);const list=el('div',undefined,'list');for(const e of graph.edges.filter(e=>e.type==='contains'&&e.from===n.id&&byId.get(e.to).type===type))list.append(btn(e.to));detail.append(list)}}
 else if(n.type==='route'){heading('推荐阅读次序');const list=el('ol');for(const key of n.steps){const li=el('li');li.append(btn('concept:'+key));list.append(li)}detail.append(list)}
 else {nodeLink(n.id);if(n.url){detail.append(document.createTextNode(' · '));const a=el('a','打开官方题目');a.href=n.url;a.target='_blank';a.rel='noopener noreferrer';detail.append(a)}}
 const relevant=graph.edges.filter(e=>(e.from===n.id||e.to===n.id)&&!['contains','route-step'].includes(e.type)&&filterEdge(e));
 if(relevant.length){heading('关系与反向索引');const list=el('ul',undefined,'relations');for(const e of relevant){const target=e.from===n.id?e.to:e.from,li=el('li'),kind=e.type==='prerequisite'?(e.to===n.id?'推荐先理解':'可继续学习'):graph.metadata.semantics[e.type];li.append(btn(target),document.createTextNode(' · '+kind+(kind===e.label?'':'：'+e.label)));list.append(li)}detail.append(list)}
}
function renderGraph(n){svg.replaceChildren();const width=Math.max(300,svg.parentElement.clientWidth);let shown=[],links=[],pos=new Map(),height;
 if(n.id==='home'){const areas=graph.nodes.filter(n=>n.type==='area'),layers=[...new Set(areas.map(n=>n.layer))];const cols=width<540?2:3,nodeW=(width-38-(cols-1)*12)/cols;let y=35;for(const layer of layers){const label=se('text',{x:18,y:y-10,class:'layer-label'});label.textContent=layer;svg.append(label);const members=areas.filter(n=>n.layer===layer);for(const [i,a] of members.entries()){pos.set(a.id,{x:19+(i%cols)*(nodeW+12),y:y+Math.floor(i/cols)*72,w:nodeW,h:54});shown.push(a)}y+=Math.ceil(members.length/cols)*72+27}height=y;links=[];$('caption').textContent='14 个领域按学习层次展开；点击领域进入局部关系。'}
 else{const all=graph.edges.filter(e=>(e.from===n.id||e.to===n.id)&&filterEdge(e));let neighbors=[...new Set(all.map(e=>e.from===n.id?e.to:e.from))];neighbors.sort((a,b)=>{const rank={area:0,concept:1,route:2,chapter:3,problem:4};return rank[byId.get(a).type]-rank[byId.get(b).type]});const limit=width<540?10:16;neighbors=neighbors.slice(0,limit);shown=[n,...neighbors.map(id=>byId.get(id))];const rowH=76,nodeW=Math.min(280,width-40);height=130+Math.ceil(neighbors.length/2)*rowH;pos.set(n.id,{x:(width-nodeW)/2,y:20,w:nodeW,h:58});const w=(width-52)/2;for(const [i,id] of neighbors.entries())pos.set(id,{x:i%2?width-w-18:18,y:122+Math.floor(i/2)*rowH,w,h:56});links=all.filter(e=>pos.has(e.from)&&pos.has(e.to));$('caption').textContent=`局部图显示 ${shown.length} 个节点；右侧列出当前关系筛选下的完整连接。`}
 svg.setAttribute('viewBox',`0 0 ${width} ${Math.max(240,height)}`);
 const title=se('title');title.textContent=n.label;svg.prepend(title);
 const desc=se('desc');desc.textContent='通过节点链接选择知识领域、概念、章节或练习，查看关系说明。';svg.append(desc);
 const defs=se('defs'),marker=se('marker',{id:'map-arrow',viewBox:'0 0 8 8',refX:8,refY:4,markerWidth:6,markerHeight:6,orient:'auto'});marker.append(se('path',{d:'M 0 0 L 8 4 L 0 8 z',fill:'var(--muted)'}));defs.append(marker);svg.append(defs);
 for(const e of links){const a=pos.get(e.from),b=pos.get(e.to),down=b.y>=a.y,y1=a.y+(down?a.h:0),y2=b.y+(down?0:b.h),mid=(y1+y2)/2,p=se('path',{d:`M ${a.x+a.w/2} ${y1} C ${a.x+a.w/2} ${mid}, ${b.x+b.w/2} ${mid}, ${b.x+b.w/2} ${y2}`,'marker-end':'url(#map-arrow)',class:'edge '+(['related','contrast','supports'].includes(e.type)?'semantic':e.type==='prerequisite'?'prerequisite':'')});svg.append(p)}
 for(const node of shown){const p=pos.get(node.id),a=se('a',{href:'#'+encodeURIComponent(node.id),class:'graph-node '+node.type+(node.id===selected?' active':''),'aria-label':names[node.type]+'：'+node.label});a.onclick=event=>{event.preventDefault();choose(node.id)};const title=se('title');title.textContent=node.label;a.append(title,se('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:8}));let label=short(node),max=Math.max(6,Math.floor((p.w-20)/13));const lines=[];while(label.length>max&&lines.length<2){lines.push(label.slice(0,max));label=label.slice(max)}if(label)lines.push(label.length>max?label.slice(0,max-1)+'…':label);const text=se('text',{x:p.x+p.w/2,y:p.y+p.h/2-(lines.length-1)*8+4,'text-anchor':'middle'});for(const [i,l] of lines.entries()){const span=se('tspan',{x:p.x+p.w/2,dy:i?16:0});span.textContent=l;text.append(span)}a.append(text);svg.append(a)}
}
function render(){const n=byId.get(selected);renderDetail(n);renderGraph(n)}
$('counts').textContent=`${graph.stats.areas} 个领域 · ${graph.stats.concepts} 个概念词条组 · ${graph.stats.chapters} 讲 · ${graph.stats.problems} 道练习`;
$('overview').onclick=()=>choose('home');$('relation').onchange=render;
$('search').oninput=()=>{const q=$('search').value.trim().toLowerCase(),box=$('results');box.replaceChildren();if(!q)return;const matches=graph.nodes.filter(n=>(n.label+' '+(n.en||'')+' '+n.description).toLowerCase().includes(q)).slice(0,12);for(const n of matches)box.append(btn(n.id,`${names[n.type]} · ${n.label}`));if(!matches.length)box.append(el('p','没有匹配的笔记。','empty'))};
window.addEventListener('hashchange',()=>{try{const id=decodeURIComponent(location.hash.slice(1));if(byId.has(id)){selected=id;render()}}catch(e){}});
new ResizeObserver(()=>renderGraph(byId.get(selected))).observe(svg.parentElement);render();
})();
</script>
</body></html>
